<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#12151c;font-family:'Nunito',sans-serif;color:#f6f4ef;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
  .hud{position:fixed;z-index:20;pointer-events:none;}
  .tl{top:20px;left:24px;}
  .tl .t{font-family:'Fredoka',sans-serif;font-weight:700;font-size:27px;letter-spacing:.5px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35);}
  .tl .s{font-weight:800;font-size:11px;letter-spacing:1px;color:#ffd23f;margin-top:3px;}
  kbd,.key{display:inline-block;font-family:'Nunito',sans-serif;font-weight:800;font-style:normal;color:#ffd23f;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:7px;padding:0 7px;line-height:1.7;}
  .hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;font-weight:700;font-size:12.5px;white-space:nowrap;
    color:#d9dce2;background:rgba(18,21,28,.68);border:1px solid rgba(255,255,255,.14);border-radius:980px;padding:9px 20px;backdrop-filter:blur(8px);}
  .hint b{font-family:'Nunito',sans-serif;font-weight:800;color:#ffd23f;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:7px;padding:0 7px;}
  #loader{position:fixed;inset:0;z-index:50;background:#12151c;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease;}
  #loader.hide{opacity:0;pointer-events:none;}
  #loader .m{font-family:'Fredoka',sans-serif;font-weight:600;font-size:46px;}
  #loader .wrap{display:flex;flex-direction:column;align-items:center;gap:18px;}
  #loader .bar{width:min(62vw,300px);height:10px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);overflow:hidden;}
  #loader .bar i{display:block;height:100%;width:0%;background:#ffcf00;border-radius:99px;transition:width .25s ease;}
  #loader .pct{font-weight:800;font-size:12px;letter-spacing:2px;color:#ffd23f;}
  #controls{position:fixed;inset:0;z-index:60;background:rgba(12,14,20,.82);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;}
  #controls.hide{opacity:0;pointer-events:none;}
  #controls .card{width:min(92vw,470px);padding:38px 44px 34px;background:rgba(26,29,38,.95);border:1px solid rgba(255,255,255,.12);border-radius:24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45);}
  #controls h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:39px;letter-spacing:.5px;line-height:1;
    margin:0 0 30px;}   /* takes over the spacing the old subtitle line used to provide */
  #controls .row{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15.5px;color:#cfd3da;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.07);}
  #controls .row b{font-family:'Nunito',sans-serif;font-weight:800;color:#ffd23f;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:8px;padding:2px 10px;font-size:14.5px;}
  #controls .go{margin-top:30px;padding:14px 52px;background:#ffcf00;color:#20222a;border:none;border-radius:16px;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:18.5px;letter-spacing:.5px;cursor:pointer;
    box-shadow:0 4px 0 #c79e00, 0 8px 18px rgba(0,0,0,.35);transition:transform .08s ease, box-shadow .08s ease, background .15s ease;}
  #controls .go:hover{background:#ffda33;}
  #controls .go:active{transform:translateY(3px);box-shadow:0 1px 0 #c79e00, 0 4px 10px rgba(0,0,0,.3);}
  /* top-right cluster: laid out by flex so the sound button can never collide with the
     Leave link, whatever width the font gives that text */
  #topright{position:fixed;top:20px;right:24px;z-index:30;display:flex;align-items:center;gap:10px;}
  #leave,#snd{font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;
    color:#f6f4ef;text-decoration:none;background:rgba(18,21,28,.68);border:1px solid rgba(255,255,255,.16);
    border-bottom-width:2px;border-radius:980px;backdrop-filter:blur(8px);
    transition:background .15s ease, color .15s ease;}
  #leave{padding:8px 18px;}
  #leave:hover,#snd:hover{background:rgba(255,207,0,.92);color:#20222a;border-color:rgba(255,207,0,.9);}
  #snd{width:36px;height:33px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  #snd svg{width:17px;height:17px;display:block;}
  #snd .x{display:none;} #snd.off .x{display:block;} #snd.off .w{display:none;}
  #fade{position:fixed;inset:0;background:#05070d;opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:40;}
  #fade.on{opacity:1;}
  #prompt{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:25;font-weight:700;font-size:15px;
    color:#fff;background:rgba(18,21,28,.74);border:1px solid rgba(255,255,255,.16);border-radius:980px;
    padding:12px 26px;backdrop-filter:blur(8px);opacity:0;transition:opacity .18s ease;pointer-events:none;white-space:nowrap;}
  #prompt.on{opacity:1;}
  #prompt b{font-family:'Nunito',sans-serif;font-weight:800;color:#ffd23f;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:8px;padding:1px 9px;}
  #viewer{position:fixed;inset:0;z-index:45;background:rgba(7,9,14,.93);display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;}
  #viewer.on{display:flex;}
  #viewer .card{max-width:min(860px,92vw);width:100%;background:#141720;border:1px solid rgba(255,255,255,.12);border-radius:20px;overflow:hidden;}
  #viewer .mwrap{position:relative;width:100%;}
  #viewer .media{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:56px;color:#141720;}
  /* ‹ › step through an asset's extra shots (only shown when it has more than one) */
  #viewer .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
    background:rgba(12,17,32,.74);border:1px solid rgba(255,255,255,.18);color:#e7eaf0;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:24px;line-height:1;padding-bottom:3px;
    display:none;align-items:center;justify-content:center;cursor:pointer;user-select:none;z-index:2;
    transition:background .18s ease,border-color .18s ease;}
  #viewer .nav.on{display:flex;}
  #viewer .nav:hover{background:rgba(56,189,248,.3);border-color:rgba(56,189,248,.65);}
  #viewer .nav.prev{left:14px;}
  #viewer .nav.next{right:14px;}
  #viewer .cap .s{margin-top:7px;font-weight:800;font-size:11px;letter-spacing:1.4px;color:#38bdf8;}
  #viewer .cap{padding:16px 20px;font-weight:800;font-size:12.5px;letter-spacing:1px;color:#b9bdc6;}
  #viewer .cap .d{margin-top:7px;font-weight:500;font-size:12px;letter-spacing:.3px;line-height:1.55;color:#8f95a3;}
  #viewer .cap a{display:inline-block;margin:10px 16px 0 0;color:#38bdf8;font-size:12px;letter-spacing:1px;
    text-decoration:none;border-bottom:1px solid rgba(56,189,248,.45);}
  #viewer .x{position:fixed;top:22px;right:24px;font-weight:800;font-size:13px;color:#b9bdc6;cursor:pointer;}
  #c{z-index:1;}
  #shopbg{position:fixed;inset:0;z-index:0;background:#0c1120 center/cover no-repeat;filter:blur(20px) brightness(.68) saturate(1.15);opacity:0;transition:opacity .55s ease;pointer-events:none;transform:scale(1.09);}
  #shopbg.on{opacity:1;}
  /* touch controls: only rendered on coarse-pointer devices (body.touch, set in JS) */
  #joy,#btnJump,#btnAct,#btnBack{display:none;}
  body.touch .hint{display:none;}
  body.touch #joy{display:block;position:fixed;left:24px;bottom:24px;z-index:26;width:122px;height:122px;border-radius:50%;
    background:rgba(18,21,28,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);touch-action:none;}
  body.touch #joy .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(255,207,0,.92);box-shadow:0 3px 0 #c79e00, 0 6px 14px rgba(0,0,0,.4);pointer-events:none;}
  body.touch #btnJump{display:flex;position:fixed;right:24px;bottom:34px;z-index:26;width:76px;height:76px;border-radius:50%;border:none;
    align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.5px;color:#20222a;
    background:rgba(255,207,0,.92);box-shadow:0 4px 0 #c79e00, 0 8px 18px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;}
  body.touch #btnAct.on{display:flex;position:fixed;right:32px;bottom:128px;z-index:26;border:none;align-items:center;justify-content:center;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;letter-spacing:.5px;color:#20222a;border-radius:980px;padding:13px 26px;
    background:rgba(255,255,255,.94);box-shadow:0 4px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;}
  body.touch #btnBack.on{display:flex;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:46;border:none;align-items:center;justify-content:center;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;letter-spacing:.5px;color:#f6f4ef;border-radius:980px;padding:12px 30px;
    background:rgba(18,21,28,.74);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);touch-action:none;user-select:none;-webkit-user-select:none;}
</style>

<body>
  <div id="shopbg"></div>
  <canvas id="c"></canvas>
  <div id="topright">
    <button id="snd" title="Sound" aria-label="Toggle sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/>
      <g class="w"><path d="M15.6 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></g>
      <g class="x"><path d="M16.5 9.5l5 5"/><path d="M21.5 9.5l-5 5"/></g></svg></button>
    <a id="leave" href="/">Leave the Realm</a>
  </div>
  <div class="hint"><b>WASD</b> / arrows to walk &nbsp;·&nbsp; <b>Shift</b> run &nbsp;·&nbsp; <b>Space</b> hop &nbsp;·&nbsp; drag to look</div>
  <div id="loader"><div class="wrap"><div class="m">BUILDING…</div><div class="bar"><i></i></div><div class="pct">0%</div></div></div>
  <div id="controls"><div class="card">
    <h2>CONTROLS</h2>
    <div class="row"><span>Move</span><b>WASD / Arrows</b></div>
    <div class="row"><span>Run</span><b>Shift</b></div>
    <div class="row"><span>Jump</span><b>Space</b></div>
    <div class="row"><span>Look around</span><b>Drag mouse</b></div>
    <div class="row"><span>Enter a building</span><b>E</b></div>
    <div class="row"><span>Arms</span><b>T</b></div>
    <button class="go" id="startBtn">Enter</button>
  </div></div>
  <div id="fade"></div>
  <div id="prompt"></div>
  <div id="joy"><div class="knob" id="joyKnob"></div></div>
  <button id="btnJump">JUMP</button>
  <button id="btnAct">ENTER</button>
  <button id="btnBack">BACK</button>
  <div id="viewer"><div class="x">Q ✕</div><div class="card"><div class="mwrap"><div class="media"></div><div class="nav prev">‹</div><div class="nav next">›</div></div><div class="cap"></div></div></div>

  <script src="/vendor/three.min.js"></script>
  <script src="/vendor/GLTFLoader.js"></script>
  <script src="/vendor/DRACOLoader.js"></script>
  <!-- post FX (three r128 examples, vendored): bloom + SMAA. The AO and the AgX grade are ours, below. -->
  <script src="/vendor/pp/Pass.js"></script>
  <script src="/vendor/pp/CopyShader.js"></script>
  <script src="/vendor/pp/LuminosityHighPassShader.js"></script>
  <script src="/vendor/pp/UnrealBloomPass.js"></script>
  <script src="/vendor/pp/SMAAShader.js"></script>
  <script src="/vendor/pp/SMAAPass.js"></script>
  <script>
  // kick the display fonts loading immediately so canvas-drawn labels (signs, panels) use them
  if(document.fonts){ document.fonts.load('600 40px "Fredoka"'); document.fonts.load('800 14px "Nunito"'); }
  const canvas = document.getElementById('c');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0c1120);
  scene.fog = new THREE.Fog(0x0c1120, 34, 76);   // pushed back again: from the spawn point every structure reads (mansion near face ~52 away, run-down house ~34, shop ~27, ruins ~24), and the border tree line + background woodland still layer into the haze
  // SKY DOME: linear fog only tints geometry, so without this the sky stays a flat clear color and
  // the "fog" reads as a ground gradient with a hard horizon line. The dome paints the fog color at
  // the horizon and blends it up into the sky color, so the fog visibly reaches into the sky.
  const skyDome=new THREE.Mesh(
    new THREE.SphereGeometry(150, 64, 40),   // enough segments that the gradient has no faceting at the horizon
    new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false,
      uniforms:{ topColor:{value:new THREE.Color(0x9fc4e8)}, bottomColor:{value:new THREE.Color(0xbcd0e0)},
                 offset:{value:6.0}, exponent:{value:0.55}, hzn:{value:0.10} },
      // OBJECT space, not world: the dome rides with the camera, and world position would fold
      // the camera's own height back into h, which is what put the true horizon a quarter of the
      // way up the gradient. In object space h depends only on the direction you are looking.
      vertexShader:'varying vec3 vWorldPosition; void main(){ vWorldPosition=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader:'uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition;\n'+
        // hzn: the gradient does not start climbing until a little way above the horizon, so
        // there is a band of pure fog colour where the sky meets the ground. Without it the
        // gradient rises fast enough (exponent 0.55) that fully fogged ground and the sky just
        // above it differ by a visible step, and every horizon reads as an edge.
        'uniform float hzn;\n'+
        'void main(){ float h=normalize(vWorldPosition+vec3(0.0,offset,0.0)).y;\n'+
        '  float t=pow(max(h-hzn,0.0)/max(1.0-hzn,1e-4),exponent);\n'+
        '  gl_FragColor=vec4(mix(bottomColor,topColor,t),1.0); }' }));

  skyDome.frustumCulled=false;
  scene.add(skyDome);
  // The dome has to RIDE WITH THE CAMERA. Parked at the world origin its own horizon (h=0) sits
  // wherever the origin is, so from a camera 34 units up a horizontal ray landed at h~0.27 on the
  // dome, a quarter of the way up the gradient: the sky just above the true horizon came out ~21
  // luminance levels darker than the fully fogged ground and every horizon read as a hard line.
  // Centred on the camera, h at the true horizon is offset/radius, which the hzn band covers.
  function skyFollow(c){ skyDome.position.copy(c.position); }

  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setSize(innerWidth, innerHeight, false);   // updateStyle false: CSS inset:0 + 100% owns the layout box
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  // lighting — cool sky + a warm key with soft shadows (one shared composition)
  const hemi=new THREE.HemisphereLight(0x9fc0ff, 0x20304a, 0.7); scene.add(hemi);
  const amb=new THREE.AmbientLight(0xffedcf, 0.2); scene.add(amb);   // warm white: daylight reads yellow, not clinical white (night runs it at 0.11 so the tint barely registers there)
  const key = new THREE.DirectionalLight(0xffdf8f, 1.55);   // warm yellow sun
  key.position.set(7, 13, 6); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1; key.shadow.camera.far = 48;
  key.shadow.camera.left = -12; key.shadow.camera.right = 12; key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
  key.shadow.bias = -0.0004; key.shadow.radius = 3;
  scene.add(key); scene.add(key.target);
  const rim = new THREE.DirectionalLight(0x5a86ff, 0.5); rim.position.set(-7,6,-6); scene.add(rim);

  // ── ENVIRONMENT REFLECTIONS — a tiny HDR sky (gradient dome + hot sun blob + cool fill)
  // baked once through PMREM and applied scene-wide, so every brick has a real world to
  // mirror. Per-material strength lives in userData.envBase; applyTOD scales all of them
  // with the daylight so reflections dim at night instead of glinting with a daytime sky.
  const ALL_MATS=new Set();
  function regMat(m, base){ if(!m||ALL_MATS.has(m)) return; m.userData.envBase=base; ALL_MATS.add(m); }
  // One polish pass per material: LEGO ABS gets a gloss ceiling, glass gets mirror-sharp
  // clarity (the frosted look came from high roughness on the TRANS materials, not opacity).
  function polish(o, cap){
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(!m || m.roughness==null || ALL_MATS.has(m)) return;
      m.metalness=0;
      const glassy = m.transparent===true || m.opacity<1 || /trans|glass/i.test(m.name||'');
      if(glassy){ if(m.opacity<1) m.transparent=true; m.roughness=Math.min(m.roughness,0.08);
        // A LEGO glass brick is a SOLID piece, so double-sided alpha blended its front and back
        // faces both, in arbitrary order (depthWrite is off): two layers of ~50% alpha compound
        // toward white, which is what made every window read as a milky slab you could not see
        // through. Front faces only gives one layer per brick and the interiors read again.
        m.side=THREE.FrontSide;
        // and 2.0 made them mirror the painted canvas sky hard enough to wash out on their own
        regMat(m,0.85); }
      else { m.roughness=Math.min(m.roughness, cap==null?0.38:cap); regMat(m,0.5); }
    });
  }
  {
    // The sky is painted on an equirect canvas (gradient + hot sun blob + soft ground band)
    // and PMREM-filtered so every roughness level gets a clean pre-blurred reflection.
    const cv=document.createElement('canvas'); cv.width=512; cv.height=256; const cc=cv.getContext('2d');
    const grd=cc.createLinearGradient(0,0,0,256);
    grd.addColorStop(0,'#7fb2e6'); grd.addColorStop(0.5,'#dce8f2'); grd.addColorStop(0.56,'#c7d6e2');
    grd.addColorStop(0.62,'#45543f'); grd.addColorStop(1,'#242e26');
    cc.fillStyle=grd; cc.fillRect(0,0,512,256);
    const sun=cc.createRadialGradient(140,66,3,140,66,46);
    sun.addColorStop(0,'rgba(255,252,235,1)'); sun.addColorStop(0.2,'rgba(255,243,205,0.95)'); sun.addColorStop(1,'rgba(255,243,205,0)');
    cc.fillStyle=sun; cc.beginPath(); cc.arc(140,66,46,0,Math.PI*2); cc.fill();
    const fill=cc.createRadialGradient(400,80,4,400,80,60);
    fill.addColorStop(0,'rgba(190,215,255,0.75)'); fill.addColorStop(1,'rgba(190,215,255,0)');
    cc.fillStyle=fill; cc.beginPath(); cc.arc(400,80,60,0,Math.PI*2); cc.fill();
    const eqTex=new THREE.CanvasTexture(cv);
    eqTex.mapping=THREE.EquirectangularReflectionMapping; eqTex.encoding=THREE.sRGBEncoding;
    const pm=new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader();
    scene.environment=pm.fromEquirectangular(eqTex).texture;
    pm.dispose(); eqTex.dispose();
    window.__R=renderer;   // debug handle for material/reflection tuning, strip with the rest of __D
  }

  // ══ RENDER PIPELINE ═══════════════════════════════════════════════════════════
  // Blender's rendered viewport gets its solidity from two things this page never had:
  // contact darkening in every crevice, and a filmic view transform that holds saturated
  // colour instead of washing it out. So the world now renders into a linear HDR buffer,
  // picks up screen-space ambient occlusion, blooms, and is graded through AgX (the same
  // transform Blender has used since 4.0) rather than ACES.
  //
  // Cost is ONE geometry pass, exactly as before: the AO reads the depth texture the main
  // pass already writes, at half resolution. Everything after it is fullscreen quads.
  // The portal menu keeps the old direct-to-screen ACES path (see frame()), so its
  // approved look and its transparent backdrop are untouched.
  const PIPE = (function(){
    const coarse = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
    // Touch devices keep the old direct render: the HDR buffers alone are ~130MB at 2x dpr.
    if(location.hash==='#nopipe' || coarse || !renderer.capabilities.isWebGL2 || !THREE.FullScreenQuad) return null;

    const V='varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }';
    // shared depth helpers: the depth texture is non-linear perspective depth in [0,1]
    const DEPTH_FNS=`
      uniform sampler2D tDepth; uniform mat4 projMat; uniform mat4 invProjMat;
      uniform float cNear; uniform float cFar;
      float rawDepth(vec2 uv){ return texture2D(tDepth,uv).x; }

        // covered ~63% of the screen height, so the samples landed on unrelated geometry and
        // the result was grain no blur could reach. The floor keeps far AO above a texel.

  // tentacles is a 41-bone chain carrying 40 discrete segment meshes, one per bone, so the whole
  // thing can be driven from JS: posing bone i moves everything below it. That is what lets the
  // arms CREEP OUT of the player's back a segment at a time instead of popping in.
  let tentRig=null, tentArms=[], tentClaws=[], tentHolder=null, tentFrontZ=0;
  let tentOn=false, tentGrow=0;                        // 0 = fully retracted, 1 = fully out

    const root=g.scene; root.updateMatrixWorld(true);
    root.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=false; o.frustumCulled=false;
      if(o.material){ o.material=o.material.clone(); o.material.metalness=0.75; o.material.roughness=0.32;
        regMat(o.material,0.8); } } });
    // The glTF binds ONE skeleton per skinned mesh, so there are 164 of them, but they all point
    // at the same underlying bones: 4 chains of 41 (the arms) and 4 of 3 (the claws at the tips).
    // Collect the unique bones and walk each root down its single-child chain instead.
    const all=new Set();
    root.traverse(o=>{ if(o.isSkinnedMesh && o.skeleton) o.skeleton.bones.forEach(b=>all.add(b)); });
    const roots=[...all].filter(b=>!b.parent||!b.parent.isBone);
    roots.forEach(r=>{
      const chain=[]; let n=r;
      while(n){ chain.push(n); n=(n.children||[]).filter(k=>k.isBone)[0]; }
      const rec={chain, rest:chain.map(b=>b.quaternion.clone())};
      // 4 chains of 41 are the arms; 4 of 3 are the harness clamps that bolt them to the back.
      // The clamps have their own armatures with no link to the arms, so they must be grown
      // alongside them or they sit on the back fully formed while the arms are still retracted.
      if(chain.length>10) tentArms.push(rec); else tentClaws.push(rec);
    });

    // begins at its bone1, and those four sit in a square 0.27 wide x 0.21 tall whose centre is
    // 1.078 ABOVE that shared root (measured off the rig in Blender). Shifting the rig by the
    // root therefore floats the square a whole 1.078 up the body, which is why the arms grew out
    // of the neck. Shift by the SQUARE'S CENTRE instead and it lands on the mount.
    // Blender (x,y,z) -> three (x, z, -y). Root three (6.114, 0, 7.163); the four bone1 sockets
    // sit at three offsets (-0.088,1.176,-0.201) (-0.103,0.971,-0.205) (0.180,0.973,-0.123)
    // (0.172,1.186,-0.125) from it: a square 0.283 wide x 0.215 tall centred (0.039,1.079,-0.164).
    // The arms run out along -z from there, which is exactly the direction the figure's back
    // faces (the face print sits at the head's MAX z), so no extra rotation is needed.
    root.position.set(-6.152, -1.079, -6.999);

    // The authored square is not perfectly flat: it carries a slight yaw, so two of the four
    // sockets sit ~0.04 deeper than the other two. Measure the DEEPEST one and stand the whole
    // rig off by it, or that pair ends up buried inside the torso instead of on its back.
    root.updateMatrixWorld(true);
    // THE EXPORT HAS NO SHAPE IN IT. Measured off the glb: every segment bone carries local
    // translation (0, 0.2464, 0) and IDENTITY rotation, so all four arms are perfectly straight
    // rods (straightness 1.000, arc == chord == 4.337) aimed within a few degrees of each other.
    // The curved look in Blender comes from the rig's IK/control setup, which glTF does not bake;
    // what exported is the bind pose. So the tentacle curve is built here rather than preserved.
    // A constant rotation at every joint of a uniform straight chain bends it into a circular arc,
    // which is exactly the shape wanted, and bone1 aims that arc.
    { const v=new THREE.Vector3(), c=new THREE.Vector3();

      tentArms.forEach(a=>{

        // rather than from the order the skins happen to come out of the file

        const top=a.sy>0;

        // higher and arcs further so it sweeps over the shoulders; the lower pair sweeps wide.
        a.aim=new THREE.Vector3(a.sx*(top?0.90:0.72), top?0.55:0.16, top?-0.55:-0.75).normalize();
        a.arc=top?1.30:1.10;                          // total turn along the whole arm, radians

        // vertical plane it points along instead of corkscrewing sideways

        const roll=Math.atan2(-w.dot(Z0), w.dot(X0));  // spin about the aim until local X lands on w
        const qW=qA.clone().multiply(new THREE.Quaternion().setFromAxisAngle(UPV, roll));
        const pq=new THREE.Quaternion(); a.chain[1].parent.getWorldQuaternion(pq);
        a.q1=pq.invert().multiply(qW);                 // bone1's local rotation that aims the arc
        a.phase=(a.sx+1)+(a.sy>0?0.7:2.3);

  const UPV=new THREE.Vector3(0,1,0), XAX=new THREE.Vector3(1,0,0);
  const TENT_BEND=1;                                   // +1 arcs them up over the figure; -1 drives them into the ground
  const DOCOCK_H=1.91;

  function mountTentacles(){
    const model=window.__figModel;
    if(tentHolder || !tentRig || !model) return;
    model.updateWorldMatrix(true,true);
    const inv=new THREE.Matrix4().copy(model.matrixWorld).invert();
    const lbox=o=>new THREE.Box3().setFromObject(o).applyMatrix4(inv);
    const body=lbox(model);
    // THE TORSO, not the head and not the whole bbox. Measured off figure.glb in Blender:
    // Base.1349 is the torso brick, model-local x -0.299..0.323, y 0.837..1.558, z 0.920..1.245,
    // and the face print (sym_11.002) sits at the head's MAX z, so +z is the front and the
    // torso's BACK FACE is its min z. Found by geometry rather than by that name alone so a
    // re-export cannot silently break it.
    let torso=model.getObjectByName('Base.1349'), tb=torso?lbox(torso):null;
    if(!tb || tb.max.y<1.0){
      let best=0; tb=null;
      model.traverse(o=>{ if(!o.isMesh) return; const b=lbox(o);
        const v=(b.max.x-b.min.x)*(b.max.y-b.min.y)*(b.max.z-b.min.z);
        if(b.min.y>0.75 && Math.abs((b.min.x+b.max.x)/2)<0.35 && v>best){ best=v; tb=b; } });
      if(!tb) tb=body;
    }
    const figH=body.max.y-body.min.y;                  // 1.646 on the shipped figure
    tentHolder=new THREE.Group();
    tentHolder.scale.setScalar(figH/DOCOCK_H);
    // The rig has already been shifted so the four sockets' SQUARE sits at its origin, so the
    // holder position IS where that square lands: centred on the torso's back panel.
    tentHolder.position.set((tb.min.x+tb.max.x)/2, (tb.min.y+tb.max.y)/2,
                           tb.min.z-TENT_BACK-tentFrontZ*(figH/DOCOCK_H));
    tentHolder.add(tentRig);
    model.add(tentHolder);                              // rides with the body, waddle and all
    tentHolder.visible=false;
    window.__tent.holder=tentHolder; window.__tent.mounted=true;
    window.__tent.info={figH:+figH.toFixed(3), scale:+(figH/DOCOCK_H).toFixed(3),
      torso:[+tb.min.x.toFixed(3),+tb.max.x.toFixed(3),+tb.min.y.toFixed(3),+tb.max.y.toFixed(3),+tb.min.z.toFixed(3),+tb.max.z.toFixed(3)],
      mount:[+tentHolder.position.x.toFixed(3),+tentHolder.position.y.toFixed(3),+tentHolder.position.z.toFixed(3)]};

  // ── THE CREEP-OUT. Each arm is 40 segments on 40 bones, so "growing" is just deciding how many
  // of them exist yet: bones past the growth front collapse to nothing and take everything below
  // them with it, which reads as the arm unspooling out of the back rather than popping in. The
  // four are staggered so they emerge one after another.
  function updateTentacles(dt){
    if(!tentArms.length) return;
    mountTentacles();
    if(!tentHolder) return;
    const want = tentOn?1:0;
    if(tentGrow!==want){
      tentGrow += Math.sign(want-tentGrow)*dt*TENT_SPEED;
      tentGrow = Math.max(0, Math.min(1, tentGrow));
    }
    const showing = tentGrow>0.001;
    tentHolder.visible = showing && mode==='hub';
    if(!showing) return;
    const now=performance.now()*0.001;
    tentArms.forEach((a,i)=>{
      const n=a.chain.length;
      // stagger: each arm waits until the one before it is part way out
      const t=Math.max(0, Math.min(1, (tentGrow - i*0.11) / (1 - (tentArms.length-1)*0.11)));
      const front=t*n;
      const th=TENT_BEND*a.arc/(n-2)*t;               // constant turn per joint = a circular arc
      for(let j=0;j<n;j++){
        const b=a.chain[j];
        const k=Math.max(0, Math.min(1, front-j));
        b.scale.setScalar(k<0.02?0.02:k);              // never exactly 0: a zero matrix is degenerate
        if(j===0) b.quaternion.copy(a.rest[0]);
        else if(j===1) b.quaternion.copy(a.q1);        // aims the arc out of its corner of the square
        else b.quaternion.setFromAxisAngle(XAX, th + 0.0025*Math.sin(now*1.15 + a.phase + j*0.20)*t);
      }
    });
    // the clamps seat first, so they are up before the arm they hold starts to unspool
    const cs=Math.max(0.02, Math.min(1, tentGrow*3));
    tentClaws.forEach(c=>{ c.chain.forEach(b=>b.scale.setScalar(cs)); });
  }

  // ── PROPS: Porsche (driveway), skull (by ruins door), Tardis + crystal (ruins balcony) ──
  // Each loads into a stud-snapped holder, recentered on X/Z with feet on the ground, then scaled
  // to a target world size. Holders are exposed on window.__props for live tuning during placement.
  window.__props={};
  function loadProp(url, cfg){
    const holder=new THREE.Group();
    holder.position.set(snap(cfg.pos[0]), cfg.y||0, snap(cfg.pos[1]));
    holder.rotation.y=cfg.rotY||0;
    scene.add(holder); window.__props[cfg.name]=holder; holder.userData.cfg=cfg;
    gltf.load(url,(g)=>{ const m=g.scene;
      m.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; o.frustumCulled=false; polish(o); } });
      m.updateMatrixWorld(true);
      let box=new THREE.Box3().setFromObject(m);
      m.position.x-=(box.min.x+box.max.x)/2; m.position.z-=(box.min.z+box.max.z)/2; m.position.y-=box.min.y;
      holder.add(m); m.updateMatrixWorld(true); box=new THREE.Box3().setFromObject(m);
      let s=1;
      if(cfg.targetH) s=cfg.targetH/((box.max.y-box.min.y)||1);
      else if(cfg.targetLen) s=cfg.targetLen/(Math.max(box.max.x-box.min.x, box.max.z-box.min.z)||1);
      else if(cfg.scale) s=cfg.scale;   // exact scale factor (e.g. stud-pitch matching)
      holder.scale.setScalar(s);
      holder.userData.model=m; window.__props[cfg.name].userData.model=m;
      if(cfg.solid){ holder.updateWorldMatrix(true,true); rasterizeSolid(holder); }
      // solidUp: a prop standing on the ruins' BALCONY. cfg.solid would rasterize it at ground
      // body height, where it does not exist, so it would stay walk-through up top; this puts it
      // in the balcony grid instead, and only there (never in the ground grid underneath it).
      if(cfg.solidUp){ holder.updateWorldMatrix(true,true);
        rasterizeSolid(holder, ruinsUpCells, UP_Y0, UP_Y1, true); }
      if(cfg.onload) cfg.onload(holder,m);
    }, undefined, e=>console.warn(url+' load failed', e));
    return holder;
  }

  // ── BRIDGE + RIVER WATER ── the LEGO bridge MOC (brown arch + its own blue water plates +
  // green bank bushes) is the only crossing to the run-down house. The MOC's stud pitch is
  // its own (see BRIDGE_SCALE below), so the scale registers its studs with the world grid. Holder y -0.22 seats
  // the water plates' top flush with the ground tiles' plate top; the arch's feet stamp into
  // the grey path. rotY PI/2 turns the MOC's water run east-west so the deck crosses it
  // north-south, in line with the path to the house. The deck and steps are climbable via
  // the heightmap + the bridge STAIR_ZONE; the water plates are flagged noHM so they never
  // become walkable, and riverAt's solid cells keep the player out of the water.
  // 0.3513 is the MOC's stud pitch MEASURED off the shipped glb (water plate 2.8104 across its
  // 8 studs, deck 2.1069 across its 6), not a guess. Re-measure it if bridge.glb is re-exported:
  // the 2026-08-26 planted rebuild came out 1.5% smaller than the first export (0.35666).
  const BRIDGE_SCALE=PITCH/0.3513;
  loadProp('./assets/bridge.glb', {name:'bridge', pos:[20.69,-12.19], y:-0.22, rotY:Math.PI/2, scale:BRIDGE_SCALE,
    onload:(holder,m)=>{
      m.traverse(o=>{ if(!o.isMesh||!o.material) return; const n=o.material.name||'';
        if(/MB23/i.test(n)){
          o.userData.noHM=true;                                              // water is scenery, never a floor
          o.material.roughness=0.12; o.material.userData.envBase=1.4; }      // wet sheen; the day cycle still dims it at night
        // the planted bridge carries its reeds well past the water and onto both banks, right
        // across the path. They are scenery like the reeds instanced down the rest of the river:
        // never a floor, never an obstacle, or they would wall off the approach to the deck.
        if(/MB28|MB154/i.test(n)) o.userData.noHM=o.userData.noSolid=true; });
      holder.updateWorldMatrix(true,true);
      rasterizeSolid(holder);                                                // after the flags above, so the reeds stay walk-through
      buildHeightmap(holder);                                                // deck + steps become walkable surfaces
      // WATER PLANTS — the MOC's own green clumps and bank plates, repeated over the WHOLE
      // river instead of only where the bridge stands. Their geometry is lifted straight out
      // of the model (world space, then recentered on its own base) and instanced across the
      // full width of the water, mid-channel as well as along both banks, at the same y the
      // MOC seats them (bases on the riverbed, poking up through the plates), so they read
      // exactly as they do at the bridge. Scenery only: no collision, and the bridge's own
      // stretch is skipped so nothing doubles up.
      const kits=[];
      m.traverse(o=>{ if(o.isMesh && /MB28/i.test(o.material.name||'')){
        const ge=o.geometry.clone(); ge.applyMatrix4(o.matrixWorld); ge.computeBoundingBox();
        const b=ge.boundingBox; ge.translate(-(b.min.x+b.max.x)/2, -b.min.y, -(b.min.z+b.max.z)/2);
        kits.push({geo:ge, mat:o.material, r:0.5*Math.max(b.max.x-b.min.x, b.max.z-b.min.z)}); } });
      if(kits.length){
        const rng=(s=>()=>(s=(Math.imul(48271,s)>>>0)%2147483647)/2147483647)(90210);
        const picks=kits.map(()=>[]), END=RV_S[RV_S.length-1];
        // spacing hash: clumps may crowd the way the MOC's own do, but never grow through each other
        const acc=new Map(), CELL=1.4, key=(cx,cz)=>cx*100003+cz;
        const fits=(x,z,r)=>{ const cx=Math.floor(x/CELL), cz=Math.floor(z/CELL);
          for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++){ const L=acc.get(key(cx+i,cz+j)); if(!L) continue;
            for(const q of L) if(Math.hypot(q[0]-x,q[1]-z) < (q[2]+r)*0.8) return false; } return true; };
        const add=(x,z,r)=>{ const k=key(Math.floor(x/CELL),Math.floor(z/CELL));
          let L=acc.get(k); if(!L) acc.set(k,L=[]); L.push([x,z,r]); };
        // a plant must stand INSIDE the water: riverAt is the same test the shoreline mosaic
        // quantises to whole studs, so sampling a quarter stud out on each axis keeps clumps
        // off the ragged edge cells and out of the grass
        const wet=(x,z)=>riverAt(x,z)&&riverAt(x+0.2,z)&&riverAt(x-0.2,z)&&riverAt(x,z+0.2)&&riverAt(x,z-0.2);
        for(let s=1.0; s<END-1.0; s+=0.6+rng()*0.5){
          for(const side of [1,-1]){ const p=riverPoint(s,side);
            // measure how far the water actually reaches along this normal rather than trusting
            // riverHW: the bridge and map-edge tapers pull the bank in, and the mosaic quantises
            // it to whole studs, so a clump placed off the raw wander can end up on dry land
            let lo=0, hi=RV_HW+2.6;
            while(hi-lo>0.04){ const m2=(lo+hi)/2;
              if(riverAt(p[0]+p[2]*m2, p[1]+p[3]*m2)) lo=m2; else hi=m2; }
            if(lo<0.5) continue;                                                // channel too tight here
            const n=Math.max(1, Math.round(lo/1.05));                           // one band of plants per ~3 studs of width
            for(let q=0;q<n;q++){
              const ki=Math.floor(rng()*kits.length), K=kits[ki];
              const u=lo*(q+rng())/n;                                           // centerline out to the bank, jittered
              const x=p[0]+p[2]*u, z=p[1]+p[3]*u;
              if(x>13.4 && x<27.0 && z>-15.6 && z<-9.2) continue;               // the bridge already has its own
              if(x>69.4 || z<-42.8) continue;                                   // past the last studded water plate, deep in the fog
              if(!wet(x,z) || !fits(x,z,K.r)) continue;
              add(x,z,K.r); picks[ki].push([x,z,rng()*Math.PI*2]); } } }
        const mm=new THREE.Matrix4(), q=new THREE.Quaternion(), ax=new THREE.Vector3(0,1,0),
              pv=new THREE.Vector3(), one=new THREE.Vector3(1,1,1);
        kits.forEach((k,i)=>{ const L=picks[i]; if(!L.length) return;
          const im=new THREE.InstancedMesh(k.geo,k.mat,L.length); im.castShadow=im.receiveShadow=true;
          L.forEach((s,j)=>{ q.setFromAxisAngle(ax,s[2]); mm.compose(pv.set(s[0],-0.22,s[1]),q,one); im.setMatrixAt(j,mm); });
          im.instanceMatrix.needsUpdate=true; scene.add(im); });
        window.__reeds=picks;                                                   // debug handle, strip with the rest
      }
    }});
  // The river continues past the MOC's own 40-stud water run with cloned 8x16 water plates
  // (the user's own blue pieces), tiled flush at 16-stud pitch with real seam gaps: west to

    geo.translate(-(b.min.x+b.max.x)/2, -b.min.y, -(b.min.z+b.max.z)/2);     // center, base at y 0
    const mat=src.material; mat.metalness=0; mat.roughness=0.12; regMat(mat,1.4);

    const spots=[];                             // [x, z, rotY]

    // rectangle sitting across the bend is exactly what made the corner read square, so that
    // span is left to the shoreline mosaic, which can round it stud by stud.
    for(let k=0;k<7;k++) spots.push([31.03+k*LP,RV_Z,Math.PI/2]);            // east stretch: bridge water -> past the apron
    for(let k=0;k<5;k++) spots.push([RV_X,-16.63-k*LP,0]);                   // north stretch: bend -> out past the apron

    // bridge came out at 0.3513, and borrowing its scale stretched these plates to 8.11 studs,
    // pushing them past the channel edge and overlapping every 16-stud seam.
    const WATER_SCALE=PITCH/0.35666;
    const mm=new THREE.Matrix4(), sc=new THREE.Vector3(WATER_SCALE,WATER_SCALE,WATER_SCALE);
    const q=new THREE.Quaternion(), ax=new THREE.Vector3(0,1,0), pv=new THREE.Vector3();
    spots.forEach((s,i)=>{ q.setFromAxisAngle(ax,s[2]); mm.compose(pv.set(s[0],-0.22,s[1]),q,sc); im.setMatrixAt(i,mm); });
    im.instanceMatrix.needsUpdate=true; scene.add(im);
    // far-water: flat matching strips carrying each open end into the fog (2mm under the
    // plate tops, above the far land sheet), so the river reads as flowing off the map
    const fw=new THREE.MeshStandardMaterial({ color:mat.color, metalness:0, roughness:0.12 }); regMat(fw,1.2);
    [[89.5,RV_Z,41,2.956],[RV_X,-61.5,2.956,37]].forEach(([px,pz,w,d])=>{
      const p=new THREE.Mesh(new THREE.PlaneGeometry(w,d), fw);
      p.rotation.x=-Math.PI/2; p.position.set(px,-0.0695,pz); scene.add(p); });
    window.__water=im;                          // debug handle, strip with the rest
  }, undefined, e=>console.warn('water plate load failed', e));

    // So: the highpass shimmer layer is gone entirely, the bands are narrow (Q 2.4 to 3.2), the
    // top band stops at ~1.4kHz, and a low rush sits underneath. Peak level is well down too.
    // The swell has to be its own node: an LFO ADDS to whatever an AudioParam holds, so hanging
    // one on a gain that the distance code also writes makes the two fight, and the LFO's own
    // midpoint becomes a floor the fade can never get under. That is exactly the bug this had.
    const rSwell=actx.createGain(); rSwell.gain.value=1; rSwell.connect(ambBus);
    lfo(0.09,0.78,1.0,rSwell.gain);
    river=noiseLoop('lowpass',300,0.8,0.0,rSwell);                 // the body of the flow
    const rMid=noiseLoop('bandpass',520,2.6,0.0,rSwell);           // burble
    const rTop=noiseLoop('bandpass',1050,3.1,0.0,rSwell);          // ripples over stones
    lfo(0.074,215,360,river.filter.frequency);
    lfo(0.096,430,640,rMid.filter.frequency);
    lfo(0.137,880,1360,rTop.filter.frequency);
    river.mid=rMid; river.top=rTop;
    river.set=v=>{ const t=actx.currentTime;                       // max is a third of what it was
      river.gain.gain.setTargetAtTime(v*0.075,t,0.3);
      rMid.gain.gain.setTargetAtTime(v*0.055,t,0.3);
      rTop.gain.gain.setTargetAtTime(v*0.030,t,0.3); };
  }catch(e){ actx=null; } }
  if(sndBtn) sndBtn.addEventListener('click',()=>{ sndOn=!sndOn; paintSnd();
    try{ localStorage.setItem('realm.sound',sndOn?'1':'0'); }catch(e){}
    if(!actx){ if(sndOn) initAudio(); return; }
    if(actx.state==='suspended') actx.resume();
    master.gain.setTargetAtTime(sndOn?0.65:0, actx.currentTime, 0.08); });
  // give the browser back its audio thread when the tab is hidden
  document.addEventListener('visibilitychange',()=>{ if(!actx) return;
    if(document.hidden) actx.suspend(); else if(sndOn) actx.resume(); });

  // ── FOOTSTEPS. Which one plays is decided by the ground under the player, not by where the
  // player started: surfaceAt() is handed out by the ground loader so it reads the very same
  // onPad/onWalk/riverAt outline the tiles are laid from.
  function grain(t,vol,f,q,dur,dest){                 // one filtered noise burst = one bit of grit
    const src=actx.createBufferSource(); src.buffer=noiseBuf;
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q;
    const g=actx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
    src.connect(bp).connect(g).connect(dest||sfxBus); src.start(t); src.stop(t+dur+0.02); }
  function tick(v,surf){ if(!actx||!sndOn) return; const t=actx.currentTime;
    const vol=0.15+Math.min(0.1,(v||0)*0.015);
    if(surf==='green'){
      // GRASS: no click at all, just a short broadband swish that dies fast
      grain(t, vol*0.5, 1500+Math.random()*700, 0.7, 0.075);
      grain(t+0.012, vol*0.28, 3400+Math.random()*1200, 0.5, 0.05);
      const o=actx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(150+Math.random()*25,t); o.frequency.exponentialRampToValueAtTime(95,t+0.06);
      const gb=actx.createGain(); gb.gain.setValueAtTime(vol*0.35,t); gb.gain.exponentialRampToValueAtTime(0.0004,t+0.07);
      o.connect(gb).connect(sfxBus); o.start(t); o.stop(t+0.09);
    } else if(surf==='water'){
      // the bridge deck: the only place you can stand over water. Hollow plank knock.
      const o=actx.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(180+Math.random()*30,t); o.frequency.exponentialRampToValueAtTime(105,t+0.07);
      const gb=actx.createGain(); gb.gain.setValueAtTime(vol*1.1,t); gb.gain.exponentialRampToValueAtTime(0.0005,t+0.1);
      o.connect(gb).connect(sfxBus); o.start(t); o.stop(t+0.12);
      grain(t, vol*0.45, 900+Math.random()*400, 1.4, 0.05);
    } else {
      // GRAVEL / SIDEWALK: a hard tap and then three or four loose grains skittering after it,
      // which is what separates a gravel crunch from a plain click
      grain(t, vol*0.85, 2100+Math.random()*600, 1.2, 0.035);
      const n=3+Math.floor(Math.random()*3);
      for(let i=0;i<n;i++) grain(t+0.008+Math.random()*0.05, vol*(0.10+Math.random()*0.22),
        2600+Math.random()*2600, 3+Math.random()*4, 0.018+Math.random()*0.022);
      const o=actx.createOscillator(); o.type='triangle';       // the minifig's own hollow ABS foot
      o.frequency.setValueAtTime(235+Math.random()*35,t); o.frequency.exponentialRampToValueAtTime(150,t+0.05);
      const gb=actx.createGain(); gb.gain.setValueAtTime(vol*0.7,t); gb.gain.exponentialRampToValueAtTime(0.0005,t+0.075);
      o.connect(gb).connect(sfxBus); o.start(t); o.stop(t+0.09);
    } }

  // ── BRICK SNAP. Two bricks meeting, the sound a LEGO game makes when a build assembles
  // itself: a hard click of shell on shell, a chunky mid body, and the hollow knock of the stud
  // seating in the tube under it. `up` is the assembling sound (the knock FALLS, the way a piece
  // settles home); coming apart plays it in reverse, pitch rising, with a drier, shorter click.
  // The first version of this was inaudible in play: it ran at 0.075 scaled by the full distance
  // falloff, which put it five to seven times under a footstep by the time a sign was at its
  // trigger distance. It is louder now and barely attenuated, because the thing making the noise
  // is a house-sized sign, not a pebble.
  function brickSnap(vol, up){ if(!actx||!sndOn) return; const t=actx.currentTime;
    const f=2500+Math.random()*1100;
    grain(t, vol*0.85, f, up?1.5:2.2, up?0.030:0.020);            // shell on shell
    grain(t+0.004, vol*0.5, 1200+Math.random()*500, 2.0, 0.045);  // the chunky middle of the clack
    const o=actx.createOscillator(); o.type='triangle';
    const a=300+Math.random()*60, b=a*(up?0.55:1.75);
    o.frequency.setValueAtTime(up?a:b, t); o.frequency.exponentialRampToValueAtTime(up?b:a, t+0.06);
    const g=actx.createGain(); g.gain.setValueAtTime(vol*(up?1.15:0.8), t);
    g.gain.exponentialRampToValueAtTime(0.0004, t+(up?0.10:0.07));
    o.connect(g).connect(sfxBus); o.start(t); o.stop(t+0.12);
    const o2=actx.createOscillator(); o2.type='sine';             // the low seat of the stud
    o2.frequency.setValueAtTime(up?150:250, t); o2.frequency.exponentialRampToValueAtTime(up?96:150, t+0.07);
    const g2=actx.createGain(); g2.gain.setValueAtTime(vol*0.55, t);
    g2.gain.exponentialRampToValueAtTime(0.0004, t+0.09);
    o2.connect(g2).connect(sfxBus); o2.start(t); o2.stop(t+0.11); }

  // ── DOORBELL, for the coffee shop. Two struck notes, each a sine with a bell partial over it
  // (2.76x, the classic inharmonic bell ratio) and a long exponential tail.
  function doorbell(vol){ if(!actx||!sndOn) return; const t0=actx.currentTime;
    [[0,660],[0.30,524]].forEach(([off,f])=>{ const t=t0+off;
      [[f,1.0,1.5],[f*2.76,0.30,1.0],[f*5.4,0.09,0.5]].forEach(([hz,amp,dur])=>{
        const o=actx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(hz,t);
        const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(vol*amp,t+0.006);
        g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
        o.connect(g).connect(sfxBus); o.start(t); o.stop(t+dur+0.05); }); }); }

  // ── WOODEN DOOR, for the run-down house: the latch lets go, then the timber swings.
  // NOTE ON LEVELS: a high-Q bandpass passes almost none of a noise source's energy, so the gains
  // in here look enormous next to the rest of the file. Do not "fix" them by eye.
  // HOW THESE WERE BALANCED, because peak sampling lies about short sounds: a ScriptProcessor on
  // the sfx bus sums every sample, and each sound is compared by MEAN POWER (its energy over its
  // own duration), which is what loudness actually tracks. A footstep measures 21.7. Every
  // deliberate foreground event in here is tuned to about 3.5x that: brickSnap(0.20) is 77,
  // doorbell(0.17) and doorOpen(0.135) land on the same figure. An earlier pass set the bell to
  // 0.42 off a peak reading and it was 21x a footstep, which is a shout, not a doorbell.
  function doorOpen(vol){ if(!actx||!sndOn) return; const t=actx.currentTime;
    grain(t, vol*2.4, 1800+Math.random()*500, 0.9, 0.040);        // the latch letting go
    grain(t+0.02, vol*1.6, 620, 0.7, 0.06);
    const src=actx.createBufferSource(); src.buffer=loopBuf; src.loop=true;
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=7+Math.random()*4;
    const f0=250+Math.random()*90, dur=0.85;
    bp.frequency.setValueAtTime(f0,t+0.06); bp.frequency.linearRampToValueAtTime(f0*0.5,t+0.06+dur);
    const g=actx.createGain(); g.gain.setValueAtTime(0.0004,t+0.06);
    g.gain.exponentialRampToValueAtTime(vol*14,t+0.14);
    let tt=t+0.14; while(tt<t+dur){ const d=0.05+Math.random()*0.1;   // stick-slip of the hinge
      g.gain.exponentialRampToValueAtTime(vol*14*(0.25+Math.random()*0.7), tt+d); tt+=d; }
    g.gain.exponentialRampToValueAtTime(0.0004,t+0.06+dur);
    src.connect(bp).connect(g).connect(sfxBus); src.start(t+0.06); src.stop(t+0.06+dur+0.05);
    const o=actx.createOscillator(); o.type='sine';               // the weight of the door swinging
    o.frequency.setValueAtTime(96,t+0.06); o.frequency.exponentialRampToValueAtTime(62,t+0.7);
    const gb=actx.createGain(); gb.gain.setValueAtTime(0.0004,t+0.06);
    gb.gain.exponentialRampToValueAtTime(vol*1.5,t+0.16); gb.gain.exponentialRampToValueAtTime(0.0004,t+0.8);
    o.connect(gb).connect(sfxBus); o.start(t+0.06); o.stop(t+0.9); }

  // ── BIRDSONG. One call is a run of 2 to 5 whistled notes, each a quick pitch sweep; the runs
  // are spaced randomly and panned randomly so they read as different birds around the map.
  function bird(vol){ if(!actx) return; const t0=actx.currentTime;
    const pan=actx.createStereoPanner?actx.createStereoPanner():null;
    const out=actx.createGain(); out.gain.value=vol;
    if(pan){ pan.pan.value=Math.random()*1.6-0.8; out.connect(pan).connect(ambBus); } else out.connect(ambBus);
    const n=2+Math.floor(Math.random()*4), base=2200+Math.random()*1700, up=Math.random()<0.5;
    for(let i=0;i<n;i++){ const t=t0+i*(0.07+Math.random()*0.09), d=0.05+Math.random()*0.06;
      const o=actx.createOscillator(); o.type='sine';
      const f=base*(1+i*(up?0.06:-0.05))*(0.94+Math.random()*0.12);
      o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*(up?1.5:0.68),t+d);
      const g=actx.createGain(); g.gain.setValueAtTime(0.0004,t);
      g.gain.exponentialRampToValueAtTime(1,t+0.012); g.gain.exponentialRampToValueAtTime(0.0004,t+d);
      o.connect(g).connect(out); o.start(t); o.stop(t+d+0.02); } }

  // ── WOOD CREAK, for the run-down house. A creak is stick-slip: the timber grips, releases,
  // grips again, so this is a high-Q band sweeping DOWN while its level stutters, over a low
  // body thump. Volume comes from how close the player is to the house (see audioFrame).
  function creak(vol){ if(!actx) return; const t=actx.currentTime, dur=0.45+Math.random()*0.65;
    const src=actx.createBufferSource(); src.buffer=loopBuf; src.loop=true;
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=13+Math.random()*9;
    const f0=185+Math.random()*150;
    bp.frequency.setValueAtTime(f0,t); bp.frequency.linearRampToValueAtTime(f0*(0.58+Math.random()*0.28),t+dur);
    const g=actx.createGain(); g.gain.setValueAtTime(0.0004,t); g.gain.exponentialRampToValueAtTime(vol,t+0.05);
    let tt=t+0.05; while(tt<t+dur-0.12){ const d=0.035+Math.random()*0.1;   // the stutter
      g.gain.exponentialRampToValueAtTime(vol*(0.22+Math.random()*0.8),tt+d); tt+=d; }
    g.gain.exponentialRampToValueAtTime(0.0004,t+dur);
    src.connect(bp).connect(g).connect(ambBus); src.start(t); src.stop(t+dur+0.05);
    const o=actx.createOscillator(); o.type='sine';                        // the beam taking the load
    o.frequency.setValueAtTime(86+Math.random()*22,t); o.frequency.exponentialRampToValueAtTime(58,t+dur*0.8);
    const gb=actx.createGain(); gb.gain.setValueAtTime(0.0004,t);
    gb.gain.exponentialRampToValueAtTime(vol*0.55,t+0.09); gb.gain.exponentialRampToValueAtTime(0.0004,t+dur*0.9);
    o.connect(gb).connect(ambBus); o.start(t); o.stop(t+dur); }

  // ── ELECTRIC ARC. The Easter egg's only tell: something in the chest behind the run-down house
  // is still live. Three or four crackling bursts over half a second, each a highpassed noise
  // snap over a detuned square pair with the pitch jittering, under a low thrum. Deliberately
  // short and dry so it reads as a spark, not a machine.
  function zap(vol){ if(!actx||!sndOn) return; const t0=actx.currentTime;
    const n=3+Math.floor(Math.random()*2);
    for(let i=0;i<n;i++){ const t=t0+i*(0.07+Math.random()*0.11), d=0.05+Math.random()*0.07;
      grain(t, vol*(0.7+Math.random()*0.6), 3200+Math.random()*2800, 1.0, d);
      for(const det of [1,1.013]){                       // two detuned squares: the buzz of an arc
        const o=actx.createOscillator(); o.type='square';
        const f=(170+Math.random()*240)*det;
        o.frequency.setValueAtTime(f,t);
        o.frequency.linearRampToValueAtTime(f*(0.7+Math.random()*0.7), t+d);
        const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(vol*0.5,t+0.006);
        g.gain.exponentialRampToValueAtTime(0.0001,t+d);
        o.connect(g).connect(sfxBus); o.start(t); o.stop(t+d+0.02); } }
    const o=actx.createOscillator(); o.type='sawtooth';  // the thrum underneath
    o.frequency.setValueAtTime(58,t0); o.frequency.exponentialRampToValueAtTime(41,t0+0.55);
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220;
    const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol*0.45,t0+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.6);
    o.connect(lp).connect(g).connect(sfxBus); o.start(t0); o.stop(t0+0.65); }
  // where you have to be standing to hear it: across the bridge (its deck ends at z -15.52),
  // on the approach in front of the run-down house (its front wall is z -21.40)
  const ZAP_ZONE=[16.6,25.4,-21.6,-15.2];
  let zapTimer=25+Math.random()*20;

  // ── PER FRAME. Distance fades and the two scheduled sounds. Everything is measured from the
  // PLAYER, not the camera, so swinging the camera around does not change what you hear.
  const RDH_RECT=[16.28,25.09,-30.32,-21.40];        // the run-down house's own footprint
  function nearRect(r,x,z){ return Math.hypot(Math.max(r[0]-x,0,x-r[1]), Math.max(r[2]-z,0,z-r[3])); }
  const fall=(d,near,far)=>d<=near?1:d>=far?0:(1-(d-near)/(far-near));
  function audioFrame(dt){
    if(!actx||!sndOn||actx.state!=='running') return;
    const px=player.position.x, pz=player.position.z;
    // RIVER: silent past 26 units, full (but never loud) with your feet in the shallows, and
    // everything between is a straight ramp, so walking toward it swells and walking off fades.
    if(river){ const d=riverProj(px,pz)[0];
      river.set(mode==='hub' ? fall(d,2.2,26)*(0.55+0.45*fall(d,2.2,10)) : 0); }
    // BIRDS: a call every 3.5 to 10 seconds. They hold at full through the day, START DYING DOWN
    // AT SUNSET (the evening keyframe is dayT 0.5) and are gone well before the night keyframe at
    // 0.75, then come back at first light. The old curve peaked at midday and was already down to
    // 0.28 by sunset, so they faded through the afternoon instead of holding and then dropping.
    const sm=(a,b,x)=>{ const u=Math.max(0,Math.min(1,(x-a)/(b-a))); return u*u*(3-2*u); };
    const day = dayT<0.50 ? 1                                   // morning through sunset: full
              : dayT<0.70 ? 1-sm(0.50,0.70,dayT)                // sunset into dusk: dying down
              : dayT<0.93 ? 0                                   // night: silent
              : sm(0.93,1.00,dayT);                             // first light: back
    birdTimer-=dt;
    if(birdTimer<=0){ birdTimer=3.5+Math.random()*6.5; if(day>0.12) bird(0.030*day); }
    // THE RUN-DOWN HOUSE creaks every 7 to 17 seconds, and only when you are close enough to
    // hear it: full at the walls, nothing past 24 units.
    creakTimer-=dt;
    if(creakTimer<=0){ creakTimer=7+Math.random()*10;
      const v=fall(nearRect(RDH_RECT,px,pz),1.5,24);
      if(v>0.05 && mode==='hub') creak(0.055*v); }
    // THE CHEST'S ARC. The countdown runs all the time, but it only ever FIRES while you are
    // standing on the approach in front of the run-down house, so the sound belongs to that spot
    // and is never heard anywhere else. Miss the window and it comes back round in a few seconds
    // rather than making you wait another two minutes.
    zapTimer-=dt;
    if(zapTimer<=0){
      const inZone = px>ZAP_ZONE[0] && px<ZAP_ZONE[1] && pz>ZAP_ZONE[2] && pz<ZAP_ZONE[3];
      if(inZone && mode==='hub'){ zap(0.185); zapTimer=105+Math.random()*30; }
      else zapTimer=7;
    }
    // inside a portal menu the world is behind glass: duck the bed, keep it turning
    ambBus.gain.setTargetAtTime(mode==='hub'?1:0.35, actx.currentTime, 0.3);
  }

  // ── controls ──
  const keys={}; let camYaw=0, camPitch=0.24, camDist=8.45;   // opening shot: straight down the path from the spawn, figure small in frame
  addEventListener('keydown', e=>{ const k=e.key.toLowerCase();
    if(k==='q'){ if(viewerOpen) closeViewer(); else if(mode==='menu') exitPortal(); return; }
    if(k==='t'){ if(mode==='hub' && !fading && tentArms.length){ tentOn=!tentOn;
      if(typeof brickSnap==='function') brickSnap(0.16, tentOn); } return; }
    if(k==='e'){ if(mode==='hub' && nearPortal && !fading) enterPortal(nearPortal);
      else if(mode==='hub' && nearChest && !fading) inspectChest(); return; }
    if(viewerOpen){ if(k==='arrowleft'){ stepShot(-1); return; } if(k==='arrowright'){ stepShot(1); return; } }
    if(mode==='menu' && !viewerOpen){ if(k==='arrowleft'||k==='a'){ menuPan=clampPan(menuPan-PGAP); return; }
      if(k==='arrowright'||k==='d'){ menuPan=clampPan(menuPan+PGAP); return; } }
    keys[k]=true; if(e.key===' '){ e.preventDefault(); jumpQ=true; } initAudio(); });
  addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
  // drag to look (higher sensitivity); in menu mode the same drag browses the panel row
  const SENS=0.0065;
  let drag=false,lx=0,ly=0,mdrag=false,mMoved=0; const pt=e=>{const t=(e.touches&&e.touches[0])||e;return{x:t.clientX,y:t.clientY};};
  canvas.addEventListener('mousedown',e=>{ initAudio(); const p=pt(e); lx=p.x; ly=p.y;
    if(mode==='hub') drag=true; else if(mode==='menu'&&!viewerOpen){ mdrag=true; mMoved=0; } });
  addEventListener('mousemove',e=>{ const p=pt(e);
    if(mdrag&&mode==='menu'){ mMoved+=Math.abs(p.x-lx); menuPan=clampPan(menuPan-(p.x-lx)*0.011); lx=p.x; ly=p.y; return; }
    if(!drag||mode!=='hub'||fading||camAnim) return;
    camYaw-=(p.x-lx)*SENS; camPitch=Math.max(0.06,Math.min(1.2,camPitch+(p.y-ly)*SENS)); lx=p.x; ly=p.y; });
  addEventListener('mouseup',()=>{ drag=false; mdrag=false; });
  // touch look-drag tracks its own touch identifier so the joystick finger never steals the camera
  let lookId=null;
  canvas.addEventListener('touchstart',e=>{ initAudio(); if(lookId!==null) return; const t=e.changedTouches[0];
    lookId=t.identifier; lx=t.clientX; ly=t.clientY;
    if(mode==='hub') drag=true; else if(mode==='menu'&&!viewerOpen){ mdrag=true; mMoved=0; } },{passive:true});
  canvas.addEventListener('touchmove',e=>{ let t=null; for(const c of e.changedTouches) if(c.identifier===lookId) t=c; if(!t) return;
    if(mdrag&&mode==='menu'){ mMoved+=Math.abs(t.clientX-lx); menuPan=clampPan(menuPan-(t.clientX-lx)*0.011); lx=t.clientX; ly=t.clientY; return; }
    if(!drag)return; camYaw-=(t.clientX-lx)*SENS; camPitch=Math.max(0.06,Math.min(1.2,camPitch+(t.clientY-ly)*SENS)); lx=t.clientX; ly=t.clientY; },{passive:true});
  const lookEnd=e=>{ for(const c of e.changedTouches) if(c.identifier===lookId){ lookId=null; drag=false; mdrag=false; } };
  canvas.addEventListener('touchend',lookEnd); canvas.addEventListener('touchcancel',lookEnd);

  // ── touch controls: virtual joystick + JUMP + contextual ENTER/BACK (coarse-pointer devices only) ──
  const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
  let joyX=0,joyY=0,joyRun=false,joyId=null;
  const joyEl=document.getElementById('joy'), joyKnob=document.getElementById('joyKnob'),
        btnJump=document.getElementById('btnJump'), btnAct=document.getElementById('btnAct'), btnBack=document.getElementById('btnBack');
  if(IS_TOUCH){
    document.body.classList.add('touch');
    const touchRows=[['Move','Left stick'],['Run','Push stick far'],['Jump','JUMP button'],['Look around','Drag the screen'],['Enter a building','Tap ENTER']];
    document.querySelectorAll('#controls .row').forEach((r,i)=>{ if(touchRows[i]) r.innerHTML='<span>'+touchRows[i][0]+'</span><b>'+touchRows[i][1]+'</b>'; });
    const joySet=t=>{ const r=joyEl.getBoundingClientRect(); const R=r.width/2-10;
      let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2); const m=Math.hypot(dx,dy);
      if(m>R){ dx*=R/m; dy*=R/m; }
      joyKnob.style.transform='translate('+dx+'px,'+dy+'px)';
      joyX=dx/R; joyY=dy/R; joyRun=Math.hypot(joyX,joyY)>0.86; };
    joyEl.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); if(joyId!==null) return; const t=e.changedTouches[0]; joyId=t.identifier; joySet(t); },{passive:false});
    joyEl.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===joyId) joySet(t); },{passive:false});
    const joyEnd=e=>{ for(const t of e.changedTouches) if(t.identifier===joyId){ joyId=null; joyX=0; joyY=0; joyRun=false; joyKnob.style.transform=''; } };
    joyEl.addEventListener('touchend',joyEnd); joyEl.addEventListener('touchcancel',joyEnd);
    btnJump.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); jumpQ=true; },{passive:false});
    btnAct.addEventListener('touchstart',e=>{ e.preventDefault(); if(mode==='hub'&&nearPortal&&!fading) enterPortal(nearPortal); },{passive:false});
    btnBack.addEventListener('touchstart',e=>{ e.preventDefault(); if(viewerOpen) closeViewer(); else if(mode==='menu'&&!fading) exitPortal(); },{passive:false});
  }
  canvas.addEventListener('wheel',e=>{ if(mode==='menu'){ if(!viewerOpen) menuPan=clampPan(menuPan+(e.deltaY+e.deltaX)*0.012); return; }
    camDist=Math.max(3,Math.min(16,camDist+e.deltaY*0.01)); },{passive:true});
  // control panel shows first; Enter dismisses it
  const startBtn=document.getElementById('startBtn');
  let entered=false;   // the spawn greeting bubble waits for this so you watch it build
  if(startBtn) startBtn.addEventListener('click',()=>{ document.getElementById('controls').classList.add('hide'); initAudio(); entered=true; });

  // ── loop: LEGO waddle (fused-leg minifig) + hop ──
  const clock=new THREE.Clock();
  let velX=0,velZ=0,curYaw=Math.PI,phase=0,prevSin=0,velY=0,grounded=true,jumpQ=false,swingAmt=0,jumpPose=0,jumpSide=1;
  const fV=new THREE.Vector3(),rV=new THREE.Vector3(),mV=new THREE.Vector3(),_v=new THREE.Vector3();
  const BX0=-30, BX1=64, BZ0=-35, BZ1=32, WALK=2.7, RUN=5.0;   // 2x-layout walk bounds, pushed a few units onto the apron past each rim
  function frame(dt){
    dayT=(dayT+dt/CYCLE_SECS)%1; applyTOD();   // day/night keeps turning; all lights fade smoothly
    let ix=0,iz=0;
    if(keys['w']||keys['arrowup'])iz+=1; if(keys['s']||keys['arrowdown'])iz-=1;
    if(keys['d']||keys['arrowright'])ix+=1; if(keys['a']||keys['arrowleft'])ix-=1;
    if(joyId!==null){ ix+=joyX; iz-=joyY; }   // analog stick: up on the pad walks forward
    if(viewerOpen||fading||mode!=='hub'||camAnim){ ix=0; iz=0; }   // freeze the walk unless roaming the hub
    fV.set(-Math.sin(camYaw),0,-Math.cos(camYaw)); rV.set(-fV.z,0,fV.x);
    mV.set(0,0,0).addScaledVector(fV,iz).addScaledVector(rV,ix);
    const mag=Math.min(1,mV.length()), running=!!keys['shift']||joyRun;
    let dX=0,dZ=0; if(mag>0.02){ mV.normalize(); const s=(running?RUN:WALK)*mag; dX=mV.x*s; dZ=mV.z*s; }
    const kf=1-Math.exp(-12*dt); velX+=(dX-velX)*kf; velZ+=(dZ-velZ)*kf;
    // axis-separated move so you slide along walls and can hug them (0 gap); only real geometry blocks
    const nx=player.position.x+velX*dt, nz=player.position.z+velZ*dt;
    if(mode!=='hub' || !stepBlocked(nx, player.position.z)) player.position.x=nx; else velX*=0.2;
    if(mode!=='hub' || !stepBlocked(player.position.x, nz)) player.position.z=nz; else velZ*=0.2;
    player.position.x=Math.max(BX0,Math.min(BX1,player.position.x));
    player.position.z=Math.max(BZ0,Math.min(BZ1,player.position.z));
    const speed=Math.hypot(velX,velZ), moving=speed>0.15;
    if(speed>0.3) curYaw=Math.atan2(velX,velZ);
    let dy=curYaw-player.rotation.y; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); player.rotation.y+=dy*Math.min(1,dt*16);
    // hop + stair/floor following: step UP onto ledges only while grounded; otherwise land on the surface below (else fall)
    const climb=inStair(player.position.x,player.position.z)?MAXSTEP:LOWSTEP;   // big steps only on the real stairs
    let gy=surfaceBelow(player.position.x, player.position.z, player.position.y+(grounded?climb:0.12)); if(gy===null) gy=0;
    if(jumpQ&&grounded){ velY=4.4; grounded=false; jumpSide=-jumpSide; } jumpQ=false;   // alternate the split pose each jump
    velY-=16*dt; player.position.y+=velY*dt;
    if(player.position.y<=gy){ player.position.y=gy; velY=0; grounded=true; } else grounded=false;
    // walk cycle: alternating legs + counter-swinging arms, with a light stiff waddle
    phase += moving ? dt*(speed*1.9+3) : dt*2;
    const wob = moving?1:0.15;
    figBody.rotation.z = Math.sin(phase)*0.045*wob;
    figBody.rotation.x = moving ? 0.05*Math.min(1,speed/RUN) : 0;
    figBody.position.y = moving ? Math.abs(Math.sin(phase))*0.05 : Math.sin(phase*0.5)*0.008;
    if(!grounded) figBody.rotation.z*=0.3;
    const si=Math.sin(phase);
    // limb swing eases in/out with movement; scales with speed
    const tgt = (moving && grounded) ? (0.18+0.34*Math.min(1,speed/RUN)) : 0;
    swingAmt += (tgt-swingAmt)*Math.min(1,dt*9);
    const sw = si*swingAmt;
    jumpPose += ((grounded?0:1)-jumpPose)*Math.min(1,dt*14);   // ease into a split leap pose while airborne
    if(hipL&&hipR&&shL&&shR){ const jp=jumpPose*jumpSide;   // jumpSide mirrors the split pose on alternating jumps
      hipL.rotation.x = sw*(1-jumpPose) + 0.75*jp;      // one leg kicks up/forward
      hipR.rotation.x = -sw*(1-jumpPose) - 0.75*jp;     // the other kicks back
      shL.rotation.x  = -sw*0.85*(1-jumpPose) - 0.6*jp; // opposite arm back
      shR.rotation.x  =  sw*0.85*(1-jumpPose) + 0.6*jp; // and the other arm up/forward
    }
    if(grounded&&moving&&((prevSin<0&&si>=0)||(prevSin>0&&si<=0)))
      tick(speed, surfaceAt(player.position.x, player.position.z));
    prevSin=si;
    // NABU crystal idles with a slow spin so it reads as alive/interactive
    if(window.__props && window.__props.crystal) window.__props.crystal.rotation.y += dt*0.8;
    // ── ruins door teleporter + portal proximity + contextual prompt ──
    skyFollow(camera);        // the sky rides with the camera, so its horizon is the real one
    ruinsDoorTeleport();
    updateBubbles(dt);        // proximity-built LEGO title bubbles over each structure
    updateTentacles(dt);      // the four arms creeping out of the player's back
    audioFrame(dt);           // wind/birds bed, river swell, the run-down house creaking
    if(!fading){
      nearPortal = (mode==='hub') ? portalAt(player.position.x, player.position.z, player.position.y) : null;
      nearChest = (mode==='hub' && !nearPortal) ? chestAt(player.position.x, player.position.z) : false;
      let msg='';
      if(viewerOpen) msg='';
      else if(mode==='menu') msg=IS_TOUCH
        ? ((activePortal&&PORTALS[activePortal].panMax>0) ? 'Tap a project &nbsp;·&nbsp; Drag to browse' : 'Tap a project')
        : ((activePortal&&PORTALS[activePortal].panMax>0)
          ? 'Click a project &nbsp;·&nbsp; Drag or scroll to browse &nbsp;·&nbsp; <b>Q</b> to leave'
          : 'Click a project &nbsp;·&nbsp; <b>Q</b> to leave');
      else if(nearPortal) msg=IS_TOUCH ? 'Enter' : 'Press <b>E</b> &nbsp;·&nbsp; Enter';   // the place's NAME is on its title bubble now
      else if(nearChest) msg=IS_TOUCH ? 'Inspect' : 'Press <b>E</b> &nbsp;·&nbsp; Inspect';
      if(msg){ promptEl.innerHTML=msg; promptEl.classList.add('on'); } else promptEl.classList.remove('on');
      if(IS_TOUCH){ btnAct.classList.toggle('on', mode==='hub'&&!!nearPortal);
        btnBack.classList.toggle('on', mode==='menu'&&!viewerOpen); }
    }
    // ── camera + render ──
    if(mode==='menu'){
      const tt=performance.now()*0.001;
      menuPanCur+=(menuPan-menuPanCur)*Math.min(1,dt*8);   // eased carousel pan; panels arc around wherever you've browsed to
      const pp=activePortal?PORTALS[activePortal].panels:[];
      for(let i=0;i<pp.length;i++){ const rel=pp[i].userData.bx-menuPanCur;
        pp[i].position.x=rel; pp[i].position.z=-Math.min(3.0,Math.abs(rel)*0.43);
        pp[i].rotation.y=-Math.max(-0.5,Math.min(0.5,rel*0.10));
        pp[i].position.y=Math.sin(tt*1.1+i*0.7)*0.05; }
      if(PIPE && renderer.toneMapping!==THREE.ACESFilmicToneMapping) renderer.toneMapping=THREE.ACESFilmicToneMapping;
      renderer.setRenderTarget(null);
      renderer.setClearColor(0x000000,0); renderer.render(menuScene, menuCam);
    } else {
      key.position.set(player.position.x+SUN_OFF[0],SUN_OFF[1],player.position.z+SUN_OFF[2]); key.target.position.copy(player.position); key.target.updateMatrixWorld();
      if(PIPE && renderer.toneMapping!==THREE.NoToneMapping) renderer.toneMapping=THREE.NoToneMapping;
      if(window.__FC){ const f=window.__FC; camera.position.set(f.eye[0],f.eye[1],f.eye[2]); camera.lookAt(f.look[0],f.look[1],f.look[2]);
        if(PIPE){ PIPE.render(); return; } renderer.setClearColor(0x0c1120,1); renderer.render(scene,camera); return; }
      if(camAnim){ camAnim.t=Math.min(1,camAnim.t+dt/camAnim.dur);
        const e=camAnim.t<0.5?2*camAnim.t*camAnim.t:1-Math.pow(-2*camAnim.t+2,2)/2;
        camera.position.lerpVectors(camAnim.p0,camAnim.p1,e); camLook.lerpVectors(camAnim.l0,camAnim.l1,e); camera.lookAt(camLook);
        if(camAnim.t>=1){ const cb=camAnim.after; camAnim=null; if(cb) cb(); }
      } else {
        let hd=camDist*Math.cos(camPitch);
        const dxc=Math.sin(camYaw), dzc=Math.cos(camYaw);   // camera-collision: pull in when a wall sits between player and camera
        // the occupancy grid is sampled at GROUND body height, so it only means anything while the
        // player is near the ground; on the balcony those cells are the floor below, not obstructions
        if(player.position.y<1.5)
          for(let d=0.6; d<hd; d+=OCS){ if(camCell(player.position.x+dxc*d, player.position.z+dzc*d)){ hd=Math.max(1.0, d-0.4); break; } }
        const vd=hd*Math.tan(camPitch);
        const cx=player.position.x+dxc*hd, cz=player.position.z+dzc*hd;
        camera.position.lerp(_v.set(cx, player.position.y+0.6+vd, cz), 0.2);
        camLook.set(player.position.x, player.position.y+0.95, player.position.z); camera.lookAt(camLook);
      }
      if(PIPE) PIPE.render();
      else { renderer.setClearColor(0x0c1120,1); renderer.render(scene, camera); }
    }
  }
  // ── DEBUG (temporary — removed before finalize): drive camera/player from the console for placement
  window.__D={ THREE, scene, renderer,
    get camera(){return camera}, player,
    set yaw(v){camYaw=v}, set pitch(v){camPitch=v}, set dist(v){camDist=v},
    get time(){return dayT}, set time(v){dayT=v; applyTOD();},
    tp(x,z){ player.position.x=x; player.position.z=z; velX=velZ=0; },
    step(dt){ frame(Math.min(dt||0.033,0.05)); },   // manual frame pump for headless verification (rAF pauses in hidden panes)
    blocked: blockedAt, portalAt, shopPad, pipe:PIPE,
    get upCells(){ return ruinsUpCells.size; },
    upAt:(x,z)=>ruinsUpCells.has(floorKey(x,z)),
    surfaceAt:(x,z)=>surfaceAt(x,z),
    get audio(){ return {ctx:actx, master, ambBus, sfxBus, river, on:sndOn, tick, creak, bird,
      brickSnap, doorbell, doorOpen, zap}; } };
  function loop(){ requestAnimationFrame(loop); frame(Math.min(clock.getDelta(),0.05)); }
  loop();
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    menuCam.aspect=innerWidth/innerHeight; menuCam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight,false);
    if(PIPE) PIPE.setSize(); });
  </script>
</body>
</html>
