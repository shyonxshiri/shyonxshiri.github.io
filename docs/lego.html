        (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(!m) return;
          m.roughness=0.58; m.metalness=0; m.userData.envBase=0.22; m.needsUpdate=true; });
        // the whites of the eyes take the suit's blue and glow with it. Skin and print unchanged,
        // and no metal here: he is wearing armour, he is not made of it.
        recolourPart(o.material, HEAD_KEY, HEAD_NEW, HEAD_GLOW); });
      heroWait.head=true; tryHero();
    }, undefined, e=>{ console.warn('hero head load failed', e); heroWait.head=true; tryHero(); });
  }

  // the civilian body has to be FINAL before the suit can be measured against it: the denim
  // legs replace the shipped ones and the hairpiece hides part of the head, and both arrive
  // on their own async callbacks.
  function tryHero(){
    if(heroBuilt || !heroWait.legs || !heroWait.hair || !heroWait.suit || !heroWait.hairPiece || !heroWait.head) return;
    if(!heroSuit || !window.__figModel) return;
    heroBuilt=true;
    try{ buildHero(window.__figModel); }
    catch(err){ console.warn('hero build failed', err); }
  }

  function buildHero(model){
    figBody.updateWorldMatrix(true,true);
    const inv=new THREE.Matrix4().copy(figBody.matrixWorld).invert();
    const tb=new THREE.Box3();
    const boxOf=objs=>{ const b=new THREE.Box3();
      objs.forEach(o=>{ o.updateWorldMatrix(true,false); tb.setFromObject(o).applyMatrix4(inv); b.union(tb); }); return b; };

    // ── the civilian body: everything on the figure that is not the head and not already
    // hidden by the legs swap. Captured BEFORE the suit is added so the suit can never
    // classify itself as the thing it replaces.
    const headNode=model.getObjectByName('Inner-Node-jesse_dot_io-7');
    const headSet=new Set(); if(headNode) headNode.traverse(o=>{ if(o.isMesh) headSet.add(o); });
    // the civilian HAIRPIECE has to come off with the body (the hero brings his own), but it sits
    // ABOVE the neck, so it must not be part of the height the suit is sized against
    const hairSet=new Set(); if(window.__hair) window.__hair.traverse(o=>{ if(o.isMesh) hairSet.add(o); });
    figBody.traverse(o=>{ if(o.isMesh && o.visible && !headSet.has(o)) civMeshes.push(o); });
    if(!civMeshes.length) throw new Error('no civilian body to measure against');
    // measure at REST: the hips and shoulders are live pivots, and if the figure happens to be
    // mid-stride when the suit finishes loading, the feet are not where the ground is
    const pv=[hipL,hipR,shL,shR].filter(Boolean), keep=pv.map(o=>o.rotation.x);
    pv.forEach(o=>{ o.rotation.x=0; }); figBody.updateWorldMatrix(true,true);
    const body=civMeshes.filter(o=>!hairSet.has(o));
    const civ=boxOf(body.length?body:civMeshes);      // feet at min.y, neck post at max.y

    // ── the suit's parts, by the role names baked into hero_suit.glb ──
    const part={};
    heroSuit.traverse(o=>{ if(!o.isMesh) return;
      const n=(o.name||'')+' '+((o.parent&&o.parent.name)||'');
      for(const k of ['torso','waist','cape','back','arm1','arm2','hand1','hand2','leg1','leg2'])
        if(n.indexOf('hero_'+k)>=0) part[k]=o; });
    const need=['torso','leg1','leg2'];
    for(const k of need) if(!part[k]) throw new Error('hero suit is missing '+k);
    figBody.add(heroSuit); heroSuit.updateWorldMatrix(true,true);
    // The hide list is captured HERE, before the rig runs. `attach()` reparents the arms, hands
    // and legs onto the hip/shoulder pivots, so they stop being descendants of heroSuit, and a
    // traverse taken after rigging silently misses precisely those five pieces: the suit then
    // never hides them and they poke through the civilian body.
    heroSuit.traverse(o=>{ if(o.isMesh) heroMeshes.push(o); });

    // SCALE: COLLAR to COLLAR, not neck stud to neck post. Those two studs are different
    // heights (the suit's is 0.274 of its own torso, the figure's neck post 0.160), so sizing on
    // them leaves the suit's collar 0.07 short and the bare neck shows as a gap under the chin.
    // The collar is the top of the WIDE part of a torso, which survives either piece changing.
    const hLegs=boxOf([part.leg1,part.leg2]);
    const hCollar=collarY([part.torso], inv), hFeet=hLegs.min.y;
    const cCollar=collarY(body.length?body:civMeshes, inv);
    const sc=(cCollar-civ.min.y)/((hCollar-hFeet)||1);
    heroSuit.scale.multiplyScalar(sc); heroSuit.updateWorldMatrix(true,true);

    // SEAT: feet exactly where the civilian's feet are, and the suit's NECK STUD directly under
    // the head that is staying on. Anchoring x/z on the neck rather than on the body's bounding
    // box is what keeps the head from sitting off-centre on the collar.
    const neck=neckCentre(part.torso, inv);
    const headBox=boxOf(headSet.size?[...headSet]:[model]);
    const legs2=boxOf([part.leg1,part.leg2]);
    heroSuit.position.x += (headBox.min.x+headBox.max.x)/2 - neck.x;
    heroSuit.position.z += (headBox.min.z+headBox.max.z)/2 - neck.z;
    heroSuit.position.y += civ.min.y - legs2.min.y;
    heroSuit.updateWorldMatrix(true,true);
    pv.forEach((o,i)=>{ o.rotation.x=keep[i]; });     // hand the walk its pivots back
    figBody.updateWorldMatrix(true,true);

    // ── rig: the suit's limbs ride the same hip and shoulder pivots the civilian walk drives,
    // so the waddle, the arm counter-swing and the split jump pose all carry over for free.
    // Left/right comes from where each piece actually SITS, never from the exported name.
    const side=o=>{ const b=boxOf([o]); return (b.min.x+b.max.x)/2; };
    const pairTo=(a,b,L,R)=>{ if(!a||!b||!L||!R) return;
      if(side(a)<side(b)){ L.attach(a); R.attach(b); } else { L.attach(b); R.attach(a); } };
    pairTo(part.leg1, part.leg2, hipL, hipR);
    // Arms and hands swing together on the shoulder, but on the SUIT'S OWN shoulder, not the
    // civilian one: armHinge() reads the shoulder peg off each arm and the pivot goes on that
    // axis, so the arm turns inside its socket however far it is raised. x is the arm's own
    // centre, which the swing never uses (a rotation.x moves nothing in x) but keeps the pivot
    // inside the piece it belongs to. hShL/hShR then copy shL/shR every frame, so the walk, the
    // jump split, the flight pose and the landing all still come from one place.
    if(part.arm1&&part.arm2&&shL&&shR){
      const a1=side(part.arm1)<side(part.arm2)?part.arm1:part.arm2, a2=(a1===part.arm1)?part.arm2:part.arm1;
      const socket=(arm,inward)=>{ const b=boxOf([arm]), h=armHinge(arm,inward,inv);
        const g=new THREE.Group();
        // fall back to the civilian recipe (top edge, 0.05 in from the back) if the piece has no
        // readable peg, which is still better than borrowing the civilian's absolute position
        g.position.set((b.min.x+b.max.x)/2, h?h.y:b.max.y-0.03, h?h.z:b.min.z+0.05);
        figBody.add(g); return g; };
      hShL=socket(a1,+1); hShR=socket(a2,-1);       // a1 sits at -x, so its peg faces +x, and a2's -x
      hShL.attach(a1); hShR.attach(a2);
      if(part.hand1&&part.hand2){
        const h1=side(part.hand1)<side(part.hand2)?part.hand1:part.hand2, h2=(h1===part.hand1)?part.hand2:part.hand1;
        hShL.attach(h1); hShR.attach(h2); } }

    // ── the hairpiece, seated on the head's stud exactly the way the civilian one is ──
    if(heroHair && headNode){
      model.updateWorldMatrix(true,true);
      const minv=new THREE.Matrix4().copy(model.matrixWorld).invert();
      const hb=new THREE.Box3().setFromObject(headNode).applyMatrix4(minv);
      const hcx=(hb.min.x+hb.max.x)/2, hcz=(hb.min.z+hb.max.z)/2, studTop=hb.max.y;
      // size: the civilian piece's approved scale, corrected for the half-percent the two
      // sockets differ by. If the civilian hair never loaded, derive it from the head instead.
      let s;
      if(window.__hairFit && window.__hairFit.s) s=window.__hairFit.s*(HH_CAV_REF/HH_CAV_R);
      else {
        let headR=0; const v=new THREE.Vector3();
        headNode.traverse(o=>{ if(!o.isMesh||!o.geometry) return; const pa=o.geometry.attributes.position; if(!pa) return;
          const m=new THREE.Matrix4().multiplyMatrices(minv,o.matrixWorld);
          for(let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(m);
            const d=Math.hypot(v.x-hcx,v.z-hcz); if(d>headR) headR=d; } });
        s=(headR/HH_CAV_R)*0.89;
      }
      // SPIN comes from HH_NAPE, a measured constant, not from an inference about the suit.
      // backSign is still recorded so __hero.hair can report which way the cape says the figure
      // faces, but nothing depends on it: an orientation that has to be RIGHT should not hinge on
      // a runtime guess nobody can see fail.
      const capeB = part.cape ? boxOf([part.cape]) : null, torsoB = boxOf([part.torso]);
      let backSign = -1;
      if(capeB) backSign = Math.sign(((capeB.min.z+capeB.max.z)/2) - ((torsoB.min.z+torsoB.max.z)/2)) || -1;
      model.add(heroHair);
      heroSeat={hcx, hcz, studTop, base:s, spin:(Math.PI-HH_NAPE), backSign};
      seatHeroHair();
    }

    buildCape(part.cape, inv);

    // ── THE HERO'S HEAD, fitted INTO THE CIVILIAN HEAD'S OWN BOX. The suit's collar and the
    // hairpiece's seat were both solved against the civilian head, and neither is re-solved here:
    // the replacement is scaled uniformly to that head's height and dropped into the same place,
    // so from the outside the box the head occupies is unchanged and everything measured against
    // it still lands. It is a swap of what is printed on the brick, not of where the brick is.
    if(heroHead && headSet.size){
      const civHead=boxOf([...headSet]);
      model.add(heroHead); heroHead.updateWorldMatrix(true,true);
      let hb=boxOf([heroHead]);
      heroHead.scale.multiplyScalar((civHead.max.y-civHead.min.y)/((hb.max.y-hb.min.y)||1));
      heroHead.updateWorldMatrix(true,true); hb=boxOf([heroHead]);
      heroHead.position.x += (civHead.min.x+civHead.max.x)/2 - (hb.min.x+hb.max.x)/2;
      heroHead.position.z += (civHead.min.z+civHead.max.z)/2 - (hb.min.z+hb.max.z)/2;
      heroHead.position.y += civHead.min.y - hb.min.y;              // necks coincide, so it seats on the same post
      heroHead.updateWorldMatrix(true,true);
      heroHead.traverse(o=>{ if(o.isMesh && heroMeshes.indexOf(o)<0) heroMeshes.push(o); });
      // and the civilian head now comes OFF with the rest of the civilian body. It is deliberately
      // not in civMeshes: that array is the measuring set, and a head inside it moves the collar
      // the suit is sized against. The tag is what wearHero reads, so tagging is enough.
      headSet.forEach(o=>{ o.userData.civPart=true; });
    }
    if(heroHair) heroHair.traverse(o=>{ if(o.isMesh && heroMeshes.indexOf(o)<0) heroMeshes.push(o); });
    // belt and braces: every classified part is on the list whatever the rig did with it
    Object.keys(part).forEach(k=>{ const o=part[k]; if(o && heroMeshes.indexOf(o)<0) heroMeshes.push(o); });
    // TAG the meshes themselves. wearHero() then re-walks the live tree instead of trusting a list
    // captured at one moment, so no future reparenting can strand a piece as permanently visible.
    civMeshes .forEach(o=>{ o.userData.civPart =true; });
    heroMeshes.forEach(o=>{ o.userData.heroPart=true; o.userData.civPart=false; });
    wearHero(false);                       // built, but the chest still has to be opened
    window.__hero={ get on(){return heroOn}, get unlocked(){return heroUnlocked},
      get flying(){return flying},
      wear:wearHero, fly:setFly,
      fit:{scale:+sc.toFixed(5), civ:[+civ.min.y.toFixed(4),+civ.max.y.toFixed(4)]},
      get hair(){ return window.__heroHairFit; },
      drop(v){ HH_DROP=+v||0; seatHeroHair(); return window.__heroHairFit; },
      trim(v){ HH_TRIM=+v||1; seatHeroHair(); return window.__heroHairFit; },
      spin(deg){ HH_SPIN=(+deg||0)*Math.PI/180; seatHeroHair(); return window.__heroHairFit; },
      side(v){ HH_SIDE=+v||0; seatHeroHair(); return window.__heroHairFit; },
      nudge(dx,dy,dz){ heroSuit.position.x+=dx||0; heroSuit.position.y+=dy||0; heroSuit.position.z+=dz||0;
        heroSuit.updateWorldMatrix(true,true); return heroSuit.position.toArray().map(v=>+v.toFixed(4)); },
      arm(up,rest){ if(up!=null) FLY_ARM_UP=+up; if(rest!=null) FLY_ARM_REST=+rest;
        return {up:FLY_ARM_UP, rest:FLY_ARM_REST}; },
      armAmt(kick,travel){ if(kick!=null) FLY_ARM_KICK=+kick; if(travel!=null) FLY_ARM_TRAVEL=+travel;
        return {kick:FLY_ARM_KICK, travel:FLY_ARM_TRAVEL}; },
      pitch(hover,dive){ if(hover!=null) FLY_PITCH_HOVER=+hover; if(dive!=null) FLY_PITCH_DIVE=+dive;
        return {hover:FLY_PITCH_HOVER, dive:FLY_PITCH_DIVE, deg:+(FLY_PITCH_DIVE*180/Math.PI).toFixed(1)}; },
      // top speed and climb rate. Everything that reads speed normalises against FLY_SPD, so the
      // pose, the arms and the cape all follow these two on their own.
      speed(spd,climb){ if(spd!=null) FLY_SPD=Math.max(1,+spd); if(climb!=null) FLY_CLIMB=Math.max(0.5,+climb);
        return {spd:FLY_SPD, climb:FLY_CLIMB, vsRun:+(FLY_SPD/RUN).toFixed(2)}; },
      // the launch: seconds, how long the coil holds, the pop's speed, the back lean
      take(secs,coil,pop,pitch){ if(secs!=null) TAKE_T=Math.max(0.1,+secs); if(coil!=null) TAKE_COIL=Math.max(0,+coil);
        if(pop!=null) TAKE_POP=+pop; if(pitch!=null) TAKE_PITCH=+pitch;
        return {secs:TAKE_T, coil:TAKE_COIL, pop:TAKE_POP, pitch:TAKE_PITCH}; },
      // the cape: hanging sway, walk sway, hover billow, flight billow, then wave and flutter
      // drag is the whole of the cape now: raise it and the airflow wins over its weight sooner
      cape(drag,wave1,hz1,pow,kick){ if(drag!=null) CAPE_DRAG=+drag; if(wave1!=null) CAPE_WAVE1=+wave1;
        if(hz1!=null) CAPE_HZ1=+hz1; if(pow!=null) CAPE_POW=Math.max(0.2,+pow); if(kick!=null) CAPE_KICK=+kick;
        const C=capeRig;
        return {drag:CAPE_DRAG, wave:CAPE_WAVE1, hz:CAPE_HZ1, pow:CAPE_POW, kick:CAPE_KICK,
                aim:C?+C.lift.toFixed(3):null,
                // rest is the hole the piece shipped with; live is what it measures right now.
                // They have to be the same number, always: the ring is pinned.
                hole: C?{rest:C.hole, live:holeR(C.pa.array, C.pa.count, C.hv, C.h1, C.UP, C.LAT, C.BACK, C.P)}:null}; },
      // how far above the ground the flight silhouette starts standing back up. Raise it if he
      // still reads as lying down as he arrives, lower it if he snaps upright too early.
      flare(v){ if(v!=null) FLY_FLARE=Math.max(0.05,+v); return FLY_FLARE; },
      // how softly the climb answers Space and Shift. Lower is a longer, gentler glide.
      ease(v){ if(v!=null) FLY_EASE=Math.max(0.5,+v); return FLY_EASE; },
      // how long his feet have to stay on the ground before it counts as a landing. Shift skips it.
      hold(v){ if(v!=null) GROUND_HOLD=Math.max(0,+v); return GROUND_HOLD; },
      // the hover float: how far he drifts, how fast, and the airspeed that flattens it out
      hover(amp,hz,ref){ if(amp!=null) HOVER_BOB=+amp; if(hz!=null) HOVER_HZ=+hz; if(ref!=null) HOVER_REF=Math.max(0.1,+ref);
        return {amp:HOVER_BOB, hz:+(HOVER_HZ/(2*Math.PI)).toFixed(3), ref:HOVER_REF}; },
      // how far the arms and legs drift while he holds station, in radians
      sway(arm,leg){ if(arm!=null) SWAY_ARM=+arm; if(leg!=null) SWAY_LEG=+leg;
        return {arm:SWAY_ARM, leg:SWAY_LEG,
                deg:[+(SWAY_ARM*180/Math.PI).toFixed(1), +(SWAY_LEG*180/Math.PI).toFixed(1)]}; },
      // how much harder the aim pulls up and down while flying. 1 is the on-foot feel.
      look(v){ if(v!=null) PITCH_FLY_SENS=Math.max(0.2,+v);
        return {mult:PITCH_FLY_SENS, radPerPx:+(SENS*PITCH_FLY_SENS).toFixed(5)}; },
      // how high the hop goes while the suit is on. 4.4 is the civilian one, gravity is 16, so the
      // peak is v*v/32 units: 9.5 is 2.82, about seven and a half studs.
      leap(v){ if(v!=null) HERO_LEAP=Math.max(1,+v);
        return {leap:HERO_LEAP, peak:+((HERO_LEAP*HERO_LEAP)/32).toFixed(2), hop:4.4}; },
      // the touchdown beat: seconds, forward lean, downward duck, trailing leg, arm sweep back
      land(secs,pitch,duck,leg,arm){ if(secs!=null) LAND_T=Math.max(0.05,+secs);
        if(pitch!=null) LAND_PITCH=+pitch; if(duck!=null) LAND_DUCK=+duck;
        if(leg!=null) LAND_LEG=+leg; if(arm!=null) LAND_ARM=+arm;
        return {secs:LAND_T, pitch:LAND_PITCH, duck:LAND_DUCK, leg:LAND_LEG, arm:LAND_ARM}; },
      // where the suit's arms actually hang their sockets, for checking the fit by number
      get sockets(){ return [hShL,hShR].map(o=>o?o.position.toArray().map(v=>+v.toFixed(4)):null); },
      grow(f){ heroSuit.scale.multiplyScalar(+f||1); heroSuit.updateWorldMatrix(true,true);
        return +heroSuit.scale.x.toFixed(5); },
      lock(){ heroUnlocked=false; wearHero(false); },
      head:heroHead,
      // the palette, live: __hero.colours(body, silver, carbon, glow, glowAmount) as hex numbers
      colours:setSuitColours, colors:setSuitColours,
      // the face, live. Both the tone and the light on it, because a skin reading too dark is as
      // often the env as the hex: __hero.skin(0xD09268) or __hero.skin(null, 0.58, 0.30)
      skin(hex,rough,env){ if(hex!=null){ HEAD_NEW[0]=hex; pushColours(); }
        if(heroHead && (rough!=null||env!=null)) heroHead.traverse(o=>{ if(!o.isMesh) return;
          (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(!m) return;
            if(rough!=null) m.roughness=+rough; if(env!=null) m.userData.envBase=+env;
            m.needsUpdate=true; }); });
        return {tone:'#'+HEAD_NEW[0].toString(16).toUpperCase().padStart(6,'0'), civilian:'#C68B5E'}; },
      // and the metal, live: __hero.metal(metalness, roughness, env)
      metal(mt,rg,ev){ if(heroSuit) heroSuit.traverse(o=>{ if(o.isMesh && !(capeRig && o.material===capeRig.mat))
          metalise(o.material, mt==null?0.90:+mt, rg==null?0.34:+rg, ev==null?1.30:+ev); });
        return {metalness:mt, roughness:rg, env:ev}; },
      get palette(){ const hex=h=>'#'+h.toString(16).toUpperCase().padStart(6,'0');
        return {was:SUIT_KEY.map(hex), now:SUIT_NEW.map(hex), glow:hex(GLOW_COL), amt:GLOW_AMT}; },
      roofs:roofY, suit:heroSuit, piece:heroHair };
  }

  // ── FACE PRINT SIZE ───────────────────────────────────────────────────────────────────
  // The printed eyes, mouth and brows, moved DOWN the head so the hairpiece stops crowding the
  // brows. Full size: shrinking the print was tried and looked wrong. The head brick itself is
  // untouched, so nothing that measures the head (the hairpiece seat, the suit's collar) moves.
  //
  // Both the drop and the (now unused) scale run per vertex on the CYLINDER the head actually is,
  // never as a group transform on the object. Each point KEEPS its distance from the head's axis
  // and only its height and angle change, so it can never leave the surface it is printed on. A
  // group transform cannot do this: a plain 0.90 scale about the print's own centre pulls it in
  // to where the head bulges forward and sinks 118 of its 125 vertices into the face by up to
  // 0.0068. Holding the radius keeps the drift at 6e-8 instead.
  let FACE_PRINT=1.00;   // 1 = original size. __face.set()
  let FACE_DROP=0.025;   // how far down the head the print sits. __face.drop()
  function shrinkFacePrint(model){
    const headNode=model.getObjectByName('Inner-Node-jesse_dot_io-7'); if(!headNode) return;
    const isPrint=o=>{ if(!o.isMesh) return false;
      const ms=Array.isArray(o.material)?o.material:[o.material];
      return ms.some(m=>m && /BLACK-FACE|BROWS/i.test(m.name||'')); };
    const prints=[], shell=[];
    headNode.traverse(o=>{ if(o.isMesh) (isPrint(o)?prints:shell).push(o); });
    if(!prints.length) return;
    const v=new THREE.Vector3();   // scratch vector for every vertex read below, apply() included
    headNode.updateWorldMatrix(true,true);
    const hinv=new THREE.Matrix4().copy(headNode.matrixWorld).invert();
    // the head's axis, taken from the SHELL so the print's own offset cannot bias it
    const sb=new THREE.Box3(), tb=new THREE.Box3();
    (shell.length?shell:prints).forEach(o=>{ tb.setFromObject(o).applyMatrix4(hinv); sb.union(tb); });
    const axX=(sb.min.x+sb.max.x)/2, axZ=(sb.min.z+sb.max.z)/2;
    // THE HEAD'S OWN PROFILE, radius against height, sampled off the shell. The head is not a
    // plain cylinder: it flares in over roughly the bottom 0.03 and again near the crown, so a
    // print that simply slid DOWN while holding its radius would part company with the face.
    // Each print vertex instead remembers its offset from this profile and keeps that offset at
    // whatever height it lands on, which reproduces the original exactly at a drop of 0.
    const PB=72, prof=new Float32Array(PB), pLo=sb.min.y, pSpan=Math.max(1e-6, sb.max.y-sb.min.y);
    (shell.length?shell:prints).forEach(o=>{
      const m=new THREE.Matrix4().multiplyMatrices(hinv, o.matrixWorld);
      const pa=o.geometry.attributes.position;
      for(let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(m);
        const b=Math.max(0,Math.min(PB-1,Math.floor((v.y-pLo)/pSpan*PB)));
        const r=Math.hypot(v.x-axX, v.z-axZ); if(r>prof[b]) prof[b]=r; } });
    for(let i=0;i<PB;i++) if(!prof[i]){ let a=i,b=i;               // fill any band the mesh missed
      while(a>0 && !prof[a]) a--; while(b<PB-1 && !prof[b]) b++;
      prof[i]=Math.max(prof[a]||0, prof[b]||0); }
    const shellR=y=>{ const t=Math.max(0,Math.min(PB-1.001,(y-pLo)/pSpan*PB-0.5));
      const i=Math.floor(t), f=t-i; return prof[i]*(1-f)+prof[Math.min(PB-1,i+1)]*f; };
    // each print mesh gets its OWN geometry, so a shared buffer is never written through
    const rec=[];
    let cxs=0, czs=0, cys=0, n=0;
    prints.forEach(o=>{
      o.geometry=o.geometry.clone();
      const toHead=new THREE.Matrix4().multiplyMatrices(hinv, o.matrixWorld);
      const pa=o.geometry.attributes.position, base=new Float32Array(pa.count*3), off=new Float32Array(pa.count);
      for(let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(toHead);
        base[i*3]=v.x; base[i*3+1]=v.y; base[i*3+2]=v.z; cxs+=v.x; czs+=v.z; cys+=v.y; n++;
        off[i]=Math.hypot(v.x-axX, v.z-axZ)-shellR(v.y); }   // how far off the face this point sits
      rec.push({o, base, off, toLocal:new THREE.Matrix4().copy(toHead).invert()});
    });
    const th0=Math.atan2(cxs/n-axX, czs/n-axZ), y0=cys/n;
    function apply(){
      rec.forEach(r=>{
        const pa=r.o.geometry.attributes.position;
        for(let i=0;i<pa.count;i++){
          const x=r.base[i*3], y=r.base[i*3+1], z=r.base[i*3+2];
          const dx=x-axX, dz=z-axZ;
          let th=Math.atan2(dx,dz)-th0;                    // angle about the axis
          th=Math.atan2(Math.sin(th),Math.cos(th))*FACE_PRINT+th0;
          const ny=y0+(y-y0)*FACE_PRINT-FACE_DROP;         // new height on the head
          const rad=shellR(ny)+r.off[i];                   // ride the head's profile at that height
          v.set(axX+rad*Math.sin(th), ny, axZ+rad*Math.cos(th));
          v.applyMatrix4(r.toLocal);
          pa.setXYZ(i, v.x, v.y, v.z);
        }
        pa.needsUpdate=true;
        r.o.geometry.computeBoundingSphere(); r.o.geometry.computeBoundingBox();
      });
    }
    apply();
    window.__face={ get scale(){return FACE_PRINT}, get dropped(){return FACE_DROP},
      set(val){ FACE_PRINT=+val||1; apply(); return FACE_PRINT; },
      drop(val){ FACE_DROP=+val||0; apply(); return FACE_DROP; },
      axis:[+axX.toFixed(4),+axZ.toFixed(4)], parts:prints.map(o=>o.name) };
  }

  // The COLLAR: the highest point on a body that is still full width, i.e. where the torso shell
  // stops and the bare neck stud begins. Measured as the top of everything within 55% of the
  // widest radius, which is a big enough margin that neither figure's shoulders can be missed and
  // small enough that no neck stud can sneak in. This, not the stud, is what has to line up
  // between the two bodies, because it is the line the head's chin actually sits against.
  function collarY(meshes, inv){
    const v=new THREE.Vector3(), P=[];
    meshes.forEach(o=>{ if(!o.geometry) return; const pa=o.geometry.attributes.position; if(!pa) return;
      o.updateWorldMatrix(true,false);
      const m=new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
      for(let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(m); P.push(v.x,v.y,v.z); } });
    if(!P.length) return 0;
    let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
    for(let i=0;i<P.length;i+=3){ if(P[i]<x0)x0=P[i]; if(P[i]>x1)x1=P[i];
      if(P[i+2]<z0)z0=P[i+2]; if(P[i+2]>z1)z1=P[i+2]; }
    const cx=(x0+x1)/2, cz=(z0+z1)/2;
    let rmax=0;
    for(let i=0;i<P.length;i+=3){ const r=Math.hypot(P[i]-cx,P[i+2]-cz); if(r>rmax) rmax=r; }
    const lim=rmax*0.55; let top=-1e9;
    for(let i=0;i<P.length;i+=3){ if(Math.hypot(P[i]-cx,P[i+2]-cz)>=lim && P[i+1]>top) top=P[i+1]; }
    return top>-1e8 ? top : 0;
  }

  // The HINGE of a minifig arm: the shoulder peg on its inner face, whose axis is what the real
  // part turns on. The peg is the only thing that reaches the innermost tenth of the piece (the
  // arm shell stops well short of it), so the centre of what that slice spans in y and z IS the
  // axis. Measured off the geometry, so a different arm piece fits itself.
  //
  // Worth the trouble because the error is invisible until it isn't: pinning the suit's arm at its
  // top edge instead, the way the civilian rig does, sits only 0.010 from this hinge, and at the
  // walk's quarter radian nobody can see the difference. At the flight pose's 2.14 radians the same
  // 0.075 between the pin and the cap centre swings the cap 0.13 clear of the shoulder, which is
  // half the arm's own depth: the arms visibly leave their sockets.
  function armHinge(arm, inward, inv){
    if(!arm||!arm.geometry) return null;
    const pa=arm.geometry.attributes.position; if(!pa) return null;
    arm.updateWorldMatrix(true,false);
    const m=new THREE.Matrix4().multiplyMatrices(inv, arm.matrixWorld), v=new THREE.Vector3();
    let x0=1e9,x1=-1e9;
    for(let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(m);
      if(v.x<x0)x0=v.x; if(v.x>x1)x1=v.x; }
    const cut = inward>0 ? x1-(x1-x0)*0.10 : x0+(x1-x0)*0.10;
    let y0=1e9,y1=-1e9,z0=1e9,z1=-1e9,n=0;
    for(let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(m);
      if(inward>0 ? v.x<cut : v.x>cut) continue;
      if(v.y<y0)y0=v.y; if(v.y>y1)y1=v.y; if(v.z<z0)z0=v.z; if(v.z>z1)z1=v.z; n++; }
    return n>3 ? {y:(y0+y1)/2, z:(z0+z1)/2} : null;
  }

  // the (x,z) centre of a torso's TOP SLICE: the neck stud the head goes on, which is the one
  // point on the suit that has to line up with the head that is not being replaced
  function neckCentre(torso, inv){
    torso.updateWorldMatrix(true,false);
    const m=new THREE.Matrix4().multiplyMatrices(inv, torso.matrixWorld);
    const pa=torso.geometry.attributes.position, v=new THREE.Vector3();
    let top=-1e9; for(let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(m); if(v.y>top) top=v.y; }
    let bot=1e9; for(let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(m); if(v.y<bot) bot=v.y; }
    const band=Math.max(1e-4,(top-bot)*0.08);          // the stud, as a share of the torso's own height
    let sx=0,sz=0,n=0;
    for(let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(m);
      if(v.y>top-band){ sx+=v.x; sz+=v.z; n++; } }
    return n ? {x:sx/n, z:sz/n} : {x:0,z:0};
  }

  // Wear / take off. The HEAD carries neither tag, which is the whole trick: it is the one part
  // both bodies share, so it is never touched. Driven by a traverse of the LIVE tree rather than
  // by the capture-time arrays, because the rig reparents the arms, hands and legs onto the
  // hip/shoulder pivots and any list taken at the wrong moment is quietly missing them.
  function wearHero(on){
    heroOn=!!on && heroMeshes.length>0;
    figBody.traverse(o=>{ if(!o.isMesh) return;
      if(o.userData.heroPart) o.visible=heroOn;
      else if(o.userData.civPart) o.visible=!heroOn; });
    if(!heroOn && flying) setFly(false);
    syncPowerHUD();
  }

  // FIGURE — your minifig, scaled to ~5 studs tall, feet on the ground
  gltf.load('./assets/figure.glb', (g)=>{
    const model=g.scene;
    model.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; o.frustumCulled=false; polish(o);
      // SKIN: deeper tan than the baked #E8C99F, matte (no waxy sheen) and barely reflective,
      // so the env/hemi fill cannot wash the face and hands pale
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(!m) return;
        // SKIN: the figure is meant to look like Shyon, who is Persian, so this is a warmer olive
        // mid tone rather than the pale LEGO tan the model ships with (and warmer/deeper than the
        // #DDB184 an earlier pass used). Matte and barely reflective for the same reason as before:
        // the shine pass's gloss made it read waxy, and reflections wash a mid tone pale.
        if(/TAN-SKIN/i.test(m.name||'')){ m.color.set(0xC68B5E).convertSRGBToLinear(); m.roughness=0.58; m.userData.envBase=0.22; }
        // FACE PRINT (eyes + mouth): true black already, but gloss + env made it mirror the blue
        // sky and read blue-grey. Matte printed ink, no reflections, so it STAYS black.
        if(/BLACK-FACE/i.test(m.name||'')){ m.color.set(0x000000); m.roughness=0.65; m.userData.envBase=0.0; }
        // BROWS: same story. The baked dark brown is near-black, so ANY gloss or env on it is
        // pure reflection and the brows flashed light grey/white whenever the sky caught them.
        // Printed ink like the rest of the face: true black, matte, zero reflections.
        if(/BROWS/i.test(m.name||'')){ m.color.set(0x000000); m.roughness=0.9; m.userData.envBase=0.0; } }); } });
    // native LEGO scale (shares blend units with plate + shop), centered, feet on ground

    figBody.add(model); window.__figModel=model;
    window.__fig=model;

    shrinkFacePrint(model);
    // LEGS SWAP — Bizarro's pants replace Jesse's legs, bound to the hip pivots so the walk still animates
    gltf.load('./assets/legs.glb', (lg)=>{
      const legs=lg.scene; legs.traverse(o=>{ if(o.isMesh){ o.castShadow=o.receiveShadow=true; o.frustumCulled=false; polish(o); } });
      const inv=new THREE.Matrix4().copy(figBody.matrixWorld).invert();
      // measure the OLD pants (legs + hip block) BEFORE hiding them: the denim takes exactly their place,
      // same size and seat, only the look changes
      const oldB=new THREE.Box3(), tB=new THREE.Box3();
      [hipL,hipR].forEach(p=>{ if(p) p.traverse(o=>{ if(o.isMesh){ tB.setFromObject(o).applyMatrix4(inv); oldB.union(tB); } }); });
      model.traverse(o=>{ if(o.isMesh && /Base1346/.test(o.name)){ tB.setFromObject(o).applyMatrix4(inv); oldB.union(tB); } });
      [hipL,hipR].forEach(p=>{ if(p) p.traverse(o=>{ if(o.isMesh) o.visible=false; }); });       // hide old legs
      model.traverse(o=>{ if(o.isMesh && /Base1346/.test(o.name)) o.visible=false; });             // hide old hip block

      legs.scale.multiplyScalar((oldB.max.y-oldB.min.y)/((lb.max.y-lb.min.y)||1));   // same height as the old pants
      legs.updateWorldMatrix(true,true); lb=new THREE.Box3().setFromObject(legs).applyMatrix4(inv);
      legs.position.x += (oldB.min.x+oldB.max.x)/2-(lb.min.x+lb.max.x)/2;            // same centre as the old pants
      legs.position.z += (oldB.min.z+oldB.max.z)/2-(lb.min.z+lb.max.z)/2;
      legs.position.y += oldB.min.y-lb.min.y;                                        // feet exactly where the old feet were
      legs.updateWorldMatrix(true,true);
      // close the waist seam: the denim's EXTERIOR top edge sits below the torso's bottom rim
      // (its hidden inner plug is proportionally taller than the old pants', so the bbox-height
      // fit leaves a thin see-through gap). Measure the exterior shoulder on the WAIST BAND's own
      // front face (the plug above it is recessed in z; the feet stick out further, so neither can
      // use a whole-assembly z filter) and stretch uniformly from the feet until the shoulder tucks
      // slightly up into the torso rim. Uniform, not y-only: the hip attach() below decomposes
      // world matrices and a non-uniform parent scale would shear the reattached leg parts.
      let rim=1e9; model.traverse(o=>{ if(o.isMesh && /Base1349/.test(o.name)){ tB.setFromObject(o).applyMatrix4(inv); rim=Math.min(rim,tB.min.y); } });
      let band=null, bandTop=-1e9; legs.traverse(o=>{ if(!o.isMesh) return;
        tB.setFromObject(o).applyMatrix4(inv); if(tB.max.y>bandTop){ bandTop=tB.max.y; band=o; } });
      let sh=-1e9; if(band){ const bb=new THREE.Box3().setFromObject(band).applyMatrix4(inv);
        const mm=new THREE.Matrix4().multiplyMatrices(inv,band.matrixWorld), vv=new THREE.Vector3(), pp=band.geometry.attributes.position;
        for(let i=0;i<pp.count;i++){ vv.fromBufferAttribute(pp,i).applyMatrix4(mm); if(vv.z>bb.max.z-0.01 && vv.y>sh) sh=vv.y; } }
      if(rim<1e8 && sh>oldB.min.y+0.1 && sh<rim){                                    // feet sit at oldB.min.y after the seat above
        legs.scale.multiplyScalar((rim+0.006-oldB.min.y)/(sh-oldB.min.y));
        legs.updateWorldMatrix(true,true); lb=new THREE.Box3().setFromObject(legs).applyMatrix4(inv);
        legs.position.x += (oldB.min.x+oldB.max.x)/2-(lb.min.x+lb.max.x)/2;          // recenter after the scale
        legs.position.z += (oldB.min.z+oldB.max.z)/2-(lb.min.z+lb.max.z)/2;
        legs.position.y += oldB.min.y-lb.min.y;                                      // feet back on the ground
        legs.updateWorldMatrix(true,true);
      }
      const parts=[]; legs.traverse(o=>{ if(o.isMesh){ const b=new THREE.Box3().setFromObject(o).applyMatrix4(inv); parts.push({o,cx:(b.min.x+b.max.x)/2,cy:(b.min.y+b.max.y)/2}); } });
      const WAIST_CUT=oldB.min.y+0.66*(oldB.max.y-oldB.min.y);   // upper third (waist band) stays with the body
      parts.forEach(p=>{ if(p.cy>WAIST_CUT) return;              // waist stays with the body

      window.__legs=legs; legsRoot=legs;

    }, undefined, e=>{ console.warn('legs load failed', e); heroWait.legs=true; tryHero(); });
    // HAIR — Bizarro's hairpiece, snapped onto the figure's head (moves with the figure)
    gltf.load('./assets/hair.glb', (hg)=>{
      const hair=hg.scene;
      hair.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; o.frustumCulled=false; polish(o); } });   // dark brown + smooth shading baked into hair.glb
      // ── SEATED ON THE STUD, the way the real part goes on. A hairpiece is not fitted by bounding
      // box: its underside is a CAVITY that swallows the head, and at the top of that cavity is a
      // BORE that the head's stud goes up into. Everything below is measured off the geometry, so
      // it survives the piece being swapped again.
      model.updateWorldMatrix(true,true);
      const inv=new THREE.Matrix4().copy(model.matrixWorld).invert();
      const headNode=model.getObjectByName('Inner-Node-jesse_dot_io-7');
      const headBox=new THREE.Box3().setFromObject(headNode||model).applyMatrix4(inv);
      model.add(hair); hair.rotation.set(0,0,0); hair.scale.setScalar(1); hair.position.set(0,0,0);
      hair.updateWorldMatrix(true,true);
      const hv=[]; { const t=new THREE.Vector3(), hinv=new THREE.Matrix4().copy(hair.matrixWorld).invert();
        hair.traverse(o=>{ if(!o.isMesh||!o.geometry) return; const pa=o.geometry.attributes.position; if(!pa) return;
          o.updateWorldMatrix(true,false);
          const m=new THREE.Matrix4().multiplyMatrices(hinv, o.matrixWorld);
          for(let i=0;i<pa.count;i++){ t.fromBufferAttribute(pa,i).applyMatrix4(m); hv.push([t.x,t.y,t.z]); } }); }
      const hx=hv.map(p=>p[0]), hy=hv.map(p=>p[1]), hz=hv.map(p=>p[2]);
      const ax=(Math.min(...hx)+Math.max(...hx))/2, az=(Math.min(...hz)+Math.max(...hz))/2;
      const y0=Math.min(...hy), HH=Math.max(...hy)-y0;
      const minRad=(a,b)=>{ let r=1e9;
        for(const p of hv){ if(p[1]<a||p[1]>=b) continue; const d=Math.hypot(p[0]-ax,p[2]-az); if(d<r) r=d; }
        return r; };
      const cavR=minRad(y0, y0+HH*0.35);                 // head cavity
      let shoulder=y0+HH*0.7;
      for(let k=1;k<26;k++){ const a=y0+HH*k/26;
        if(minRad(a,a+HH/26) < cavR*0.6){ shoulder=a; break; } }
      const boreR=minRad(shoulder, shoulder+HH*0.14);    // the anti-stud above it
      let boreTop=shoulder+HH*0.14;
      for(let k=0;k<20;k++){ const a=shoulder+HH*0.14*k/20;
        if(minRad(a,a+HH*0.02) < boreR*0.5){ boreTop=a; break; } }
      const hd=[]; { const t=new THREE.Vector3();
        headNode.traverse(o=>{ if(!o.isMesh||!o.geometry) return; const pa=o.geometry.attributes.position; if(!pa) return;
          const m=new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
          for(let i=0;i<pa.count;i++){ t.fromBufferAttribute(pa,i).applyMatrix4(m); hd.push([t.x,t.y,t.z]); } }); }
      const hcx=(headBox.min.x+headBox.max.x)/2, hcz=(headBox.min.z+headBox.max.z)/2;
      let headR=0; for(const p of hd){ const d=Math.hypot(p[0]-hcx,p[2]-hcz); if(d>headR) headR=d; }
      // the stud, off its TOP FACE RING: a band down from the top catches the skull's dome and
      // reads it twice as wide, and slicing downward finds nothing because the stud's side wall
      // carries no vertices between its top and base rings.

      // head, because the head's dome is shallower than the one the part was made for. 0.05 of
      // extra drop puts the hairline above the brows and the sides past the ears; past ~0.07 it
      // starts eating the forehead.
      const HAIR_DROP=0.05;
      // SIZE comes from the CAVITY matching the head, not from the bore matching the stud. The
      // bore on this piece is narrower than this head's stud, so sizing off the stud blows the
      // whole hairpiece up about 16% and it reads far too big. The cavity match puts it at ~1.00,
      // which is the size that looks right on the figure; the stud then sits a little proud
      // inside its hole, which nobody can see from outside.
      // 0.89: the exact cavity match reads heavy on this head, so the piece is trimmed. Tuned
      // with the user in decreasing steps, 1.00 -> 0.96 -> 0.94 -> 0.90 -> 0.89.
      const s=(headR/cavR)*0.89;
      // The part in this style does not run along the piece's own axes: left as exported it lies
      // diagonally across the head from the top. 20 degrees brings it front-to-back down the
      // middle (at 26 it tips over the other way). Rotated about the CAVITY AXIS, not the object
      // origin, or the piece swings off the head instead of spinning in place.

      window.__hairFit={ax,az,y0,HH,boreTop,hcx,hcz,studTop,s,
        info:{cavR:+cavR.toFixed(4),boreR:+boreR.toFixed(4),headR:+headR.toFixed(4),
              studR:+studR.toFixed(4),scale:+s.toFixed(5)}};

    }, undefined, e=>{ console.warn('hair load failed', e); heroWait.hair=true; tryHero(); });
    loadHero(model);

  }, undefined, e=>{ console.warn('figure load failed', e); loadedFig=true; ready(); });

  const SHOP_SCALE=1.47709;                                 // PITCH/snap are defined globally above
  const shopHolder=new THREE.Group();
  shopHolder.position.set(snap(-19.95), -0.12, snap(-25.12)); // 2x layout: doubled from snap(-9.975)/snap(-12.56), still stud-snapped, stamped in
  shopHolder.rotation.y=-Math.PI/2;                           // counter/awning/patio face the spawn

  // MODERN HOUSE — About + Contact live here. Native scale (already 0.369 pitch),

  // since the 2x layout. Re-derive them if the glb's outer bbox ever changes again.

  const MH_BOX={x:[-13.487076, 0.425377], y:[-0.004971, 6.893730], z:[-7.873914, 5.993265]};
  gltf.load('./assets/modern_house.glb', (g)=>{
    const house=g.scene;
    house.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; o.frustumCulled=false; polish(o); } });
    house.updateMatrixWorld(true);

    houseHolder.add(house); rasterizeSolid(houseHolder, houseCells, null, null, false, true); noteRoof('house', houseHolder);   // solid = the real walls only; lawn/garden stays walkable
    // ── THE UPSTAIRS, which you reach by FLYING onto the balcony and walking in through its door.

  // ── WINDING REPAIR. Some Mecabricks exports come out with their triangle winding reversed
  // against their own NORMAL data: the normals are the true outward ones, but the triangles are
  // wound the other way, so every outer surface of the model is BACK-facing. Three lights a
  // DoubleSide surface as `normal * faceDirection`, so it then NEGATES the correct normal on
  // exactly those faces. The sun's N.L goes to zero over the whole visible skin, the environment
  // is sampled through an inward reflection vector, and the model renders on ambient alone: flat,
  // washed out, and with no highlight anywhere. It also silently deletes any FrontSide glass,
  // since the faces polish() means to keep are the ones being culled.
  // Detect it per GEOMETRY by voting the sign of (winding face normal . summed vertex normal)
  // over a sample of triangles, and reverse the losers by swapping the second and third index of
  // each triangle. The vote is nowhere near close on real data, so this is a no-op on a sound
  // asset: corvette.glb's twelve broken meshes score 0.998 to 1.000 reversed and its nine sound
  // ones 0.000 to 0.007, and every mesh in porsche.glb scores 0.000.
  function fixWinding(root){
    const seen=new Set(); let flipped=0, kept=0, tris=0;
    root.traverse(o=>{
      if(!o.isMesh || !o.geometry || seen.has(o.geometry.uuid)) return;
      const g=o.geometry; seen.add(g.uuid);
      const P=g.attributes.position, N=g.attributes.normal; if(!P||!N) return;
      const idx=g.index, tri=Math.floor((idx?idx.count:P.count)/3); if(tri<1) return;
      const gi=(t,k)=> idx ? idx.getX(t*3+k) : t*3+k;
      let neg=0, tot=0; const step=Math.max(1, Math.floor(tri/600));
      for(let t=0;t<tri;t+=step){
        const a=gi(t,0), b=gi(t,1), c=gi(t,2);
        const ax=P.getX(a), ay=P.getY(a), az=P.getZ(a);
        const ux=P.getX(b)-ax, uy=P.getY(b)-ay, uz=P.getZ(b)-az;
        const vx=P.getX(c)-ax, vy=P.getY(c)-ay, vz=P.getZ(c)-az;
        const fx=uy*vz-uz*vy, fy=uz*vx-ux*vz, fz=ux*vy-uy*vx;
        const nx=N.getX(a)+N.getX(b)+N.getX(c), ny=N.getY(a)+N.getY(b)+N.getY(c), nz=N.getZ(a)+N.getZ(b)+N.getZ(c);
        const d=fx*nx+fy*ny+fz*nz;
        if(d!==0){ if(d<0) neg++; tot++; }
      }
      if(!tot || neg*2<=tot){ kept++; return; }
      flipped++; tris+=tri;
      if(idx){ const arr=idx.array;
        for(let t=0;t<tri;t++){ const i=t*3+1, j=t*3+2, sw=arr[i]; arr[i]=arr[j]; arr[j]=sw; }
        idx.needsUpdate=true;
      } else {                                  // unindexed: swap vertices 1 and 2 in every attribute
        for(const k in g.attributes){ const at=g.attributes[k], n=at.itemSize, arr=at.array;
          for(let t=0;t<tri;t++){ const i=(t*3+1)*n, j=(t*3+2)*n;
            for(let q=0;q<n;q++){ const sw=arr[i+q]; arr[i+q]=arr[j+q]; arr[j+q]=sw; } }
          at.needsUpdate=true; }
      }
    });
    return {flipped, kept, tris};
  }
  // ── CABIN TINT, shared by both cars. Recolours the triangles of a model that fall inside a set
  // of MEASURED boxes, leaving the rest of the mesh they belong to alone. Both builds are joined
  // by material, so an interior piece is NOT its own mesh and cannot simply be reassigned: the
  // triangles are picked by centroid, reordered into one contiguous run, and the mesh is then
  // drawn as two material groups. Groups need contiguous index ranges, which is the only reason
  // for the sort. Boxes are in the MODEL's own local frame (the glTF scene space), so the holder,
  // the targetLen scale and the bbox recentre cannot move them.
  // `groups` is [{re, boxes, wholeBoxes, color, plastic}]: `re` matches the material NAME, `boxes` is a list
  // of [x0,x1,y0,y1,z0,z1], `color` is a THREE.Color already in whatever space that model's own
  // factors use (the Corvette's are converted to linear on load, the Porsche's ship linear), and
  // `plastic` forces metalness 0 on the clone, which the Porsche's cabin floor needs because the
  // material it clones from has already been overridden to metallic silver for the wheel rims.
  function tintByBoxes(m, groups){
    m.updateMatrixWorld(true);
    const inv=new THREE.Matrix4().copy(m.matrixWorld).invert();
    const L=new THREE.Matrix4(), v=new THREE.Vector3(), bc=new THREE.Vector3();
    const cache=new Map(); let n=0;
    m.traverse(o=>{
      if(!o.isMesh||!o.geometry) return;
      const mat=Array.isArray(o.material)?o.material[0]:o.material;
      if(!mat) return;
      const grp=groups.find(q=>q.re.test(mat.name||''));
      if(!grp) return;
      const BOXES=grp.boxes||[];
      const g=o.geometry, P=g.attributes.position, idx=g.index;
      const tri=Math.floor((idx?idx.count:P.count)/3); if(tri<1) return;
      L.multiplyMatrices(inv, o.matrixWorld);
      const gi=(t,k)=> idx ? idx.getX(t*3+k) : t*3+k;
      // `wholeBoxes` tests the MESH's own centre instead of each triangle's, and takes the mesh
      // entire when it hits. It exists for a piece a per-triangle box cannot reach: the Porsche's
      // dash block and the steering wheel mounted into it overlap along ALL THREE axes, so no box
      // holds one without cutting the other. Their centres are 0.27 apart in y, which is all the
      // separation this needs, and it is measured off the geometry rather than read off the
      // exported mesh names.
      let whole=false;
      if(grp.wholeBoxes){
        if(!g.boundingBox) g.computeBoundingBox();
        v.copy(g.boundingBox.getCenter(bc)).applyMatrix4(L);
        for(let i=0;i<grp.wholeBoxes.length;i++){ const q=grp.wholeBoxes[i];
          if(v.x>=q[0]&&v.x<=q[1]&&v.y>=q[2]&&v.y<=q[3]&&v.z>=q[4]&&v.z<=q[5]){ whole=true; break; } }
      }
      const pick=[], rest=[];
      for(let t=0;t<tri;t++){
        let hit=whole;
        if(!hit){
          const a=gi(t,0), b=gi(t,1), c=gi(t,2);
          v.set((P.getX(a)+P.getX(b)+P.getX(c))/3,
                (P.getY(a)+P.getY(b)+P.getY(c))/3,
                (P.getZ(a)+P.getZ(b)+P.getZ(c))/3).applyMatrix4(L);
          for(let i=0;i<BOXES.length;i++){ const q=BOXES[i];
            if(v.x>=q[0]&&v.x<=q[1]&&v.y>=q[2]&&v.y<=q[3]&&v.z>=q[4]&&v.z<=q[5]){ hit=true; break; } }
        }
        (hit?pick:rest).push(t);
      }
      if(!pick.length) return;
      const src=idx?idx.array:null;
      const out=new (src?src.constructor:Uint32Array)(tri*3);
      let w=0;
      const put=t=>{ for(let k=0;k<3;k++) out[w++]= src ? src[t*3+k] : t*3+k; };
      pick.forEach(put); rest.forEach(put);
      g.setIndex(new THREE.BufferAttribute(out,1));
      const key=mat.uuid+'|'+grp.color.getHexString();
      let tint=cache.get(key);
      if(!tint){ tint=mat.clone(); tint.name=(mat.name||'mat')+'-cabin';

        // piece, so it takes ONE colour, drawn from a family of real LEGO greens converted to
        // linear and divided by the MOC's own dark green (an instance colour multiplies). The
        // bias here runs off the WATER rather than off the lawn's drifts: the greens deepen
        // toward mid-channel, where a real plant sits wettest and in its own shade, and lift
        // toward the banks. rw is that reach, 0 at the centerline and 1 at the shore.

        const reedTone=(r,x,z)=>{
          if(r<0.06) return REED_TONES[5];

    // rectangle sitting across the bend is exactly what made the corner read square, so that

      grain(t, vol*0.85, 2100+Math.random()*600, 1.2, 0.035);
      const n=3+Math.floor(Math.random()*3);
      for(let i=0;i<n;i++) grain(t+0.008+Math.random()*0.05, vol*(0.10+Math.random()*0.22),
        2600+Math.random()*2600, 3+Math.random()*4, 0.018+Math.random()*0.022);
      const o=actx.createOscillator(); o.type='triangle';       // the minifig's own hollow ABS foot
      o.frequency.setValueAtTime(235+Math.random()*35,t); o.frequency.exponentialRampToValueAtTime(150,t+0.05);
      const gb=actx.createGain(); gb.gain.setValueAtTime(vol*0.7,t); gb.gain.exponentialRampToValueAtTime(0.0005,t+0.075);
      o.connect(gb).connect(sfxBus); o.start(t); o.stop(t+0.09);
    } }

  // ── BRICK SNAP. Two bricks meeting, the sound a LEGO game makes when a build assembles

  // seating in the tube under it. `up` is the assembling sound (the knock FALLS, the way a piece
  // settles home); coming apart plays it in reverse, pitch rising, with a drier, shorter click.
  // The first version of this was inaudible in play: it ran at 0.075 scaled by the full distance
  // falloff, which put it five to seven times under a footstep by the time a sign was at its
  // trigger distance. It is louder now and barely attenuated, because the thing making the noise
  // is a house-sized sign, not a pebble.
  function brickSnap(vol, up){ if(!actx||!sndOn) return; const t=actx.currentTime;
    const f=2500+Math.random()*1100;
    grain(t, vol*0.85, f, up?1.5:2.2, up?0.030:0.020);            // shell on shell
    grain(t+0.004, vol*0.5, 1200+Math.random()*500, 2.0, 0.045);  // the chunky middle of the clack
    const o=actx.createOscillator(); o.type='triangle';
    const a=300+Math.random()*60, b=a*(up?0.55:1.75);
    o.frequency.setValueAtTime(up?a:b, t); o.frequency.exponentialRampToValueAtTime(up?b:a, t+0.06);
    const g=actx.createGain(); g.gain.setValueAtTime(vol*(up?1.15:0.8), t);
    g.gain.exponentialRampToValueAtTime(0.0004, t+(up?0.10:0.07));
    o.connect(g).connect(sfxBus); o.start(t); o.stop(t+0.12);
    const o2=actx.createOscillator(); o2.type='sine';             // the low seat of the stud
    o2.frequency.setValueAtTime(up?150:250, t); o2.frequency.exponentialRampToValueAtTime(up?96:150, t+0.07);
    const g2=actx.createGain(); g2.gain.setValueAtTime(vol*0.55, t);
    g2.gain.exponentialRampToValueAtTime(0.0004, t+0.09);
    o2.connect(g2).connect(sfxBus); o2.start(t); o2.stop(t+0.11); }

  // ── DOORBELL, for the coffee shop. Two struck notes, each a sine with a bell partial over it
  // (2.76x, the classic inharmonic bell ratio) and a long exponential tail.
  function doorbell(vol){ if(!actx||!sndOn) return; const t0=actx.currentTime;
    [[0,660],[0.30,524]].forEach(([off,f])=>{ const t=t0+off;
      [[f,1.0,1.5],[f*2.76,0.30,1.0],[f*5.4,0.09,0.5]].forEach(([hz,amp,dur])=>{
        const o=actx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(hz,t);
        const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(vol*amp,t+0.006);
        g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
        o.connect(g).connect(sfxBus); o.start(t); o.stop(t+dur+0.05); }); }); }

  // ── WOODEN DOOR, for the run-down house: the latch lets go, then the timber swings.
  // NOTE ON LEVELS: a high-Q bandpass passes almost none of a noise source's energy, so the gains
  // in here look enormous next to the rest of the file. Do not "fix" them by eye.
  // HOW THESE WERE BALANCED, because peak sampling lies about short sounds: a ScriptProcessor on
  // the sfx bus sums every sample, and each sound is compared by MEAN POWER (its energy over its
  // own duration), which is what loudness actually tracks. A footstep measures 21.7. Every
  // deliberate foreground event in here is tuned to about 3.5x that: brickSnap(0.20) is 77,
  // doorbell(0.17) and doorOpen(0.135) land on the same figure. An earlier pass set the bell to
  // 0.42 off a peak reading and it was 21x a footstep, which is a shout, not a doorbell.
  function doorOpen(vol){ if(!actx||!sndOn) return; const t=actx.currentTime;
    grain(t, vol*2.4, 1800+Math.random()*500, 0.9, 0.040);        // the latch letting go
    grain(t+0.02, vol*1.6, 620, 0.7, 0.06);
    const src=actx.createBufferSource(); src.buffer=loopBuf; src.loop=true;
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=7+Math.random()*4;
    const f0=250+Math.random()*90, dur=0.85;
    bp.frequency.setValueAtTime(f0,t+0.06); bp.frequency.linearRampToValueAtTime(f0*0.5,t+0.06+dur);
    const g=actx.createGain(); g.gain.setValueAtTime(0.0004,t+0.06);
    g.gain.exponentialRampToValueAtTime(vol*14,t+0.14);
    let tt=t+0.14; while(tt<t+dur){ const d=0.05+Math.random()*0.1;   // stick-slip of the hinge
      g.gain.exponentialRampToValueAtTime(vol*14*(0.25+Math.random()*0.7), tt+d); tt+=d; }
    g.gain.exponentialRampToValueAtTime(0.0004,t+0.06+dur);
    src.connect(bp).connect(g).connect(sfxBus); src.start(t+0.06); src.stop(t+0.06+dur+0.05);
    const o=actx.createOscillator(); o.type='sine';               // the weight of the door swinging
    o.frequency.setValueAtTime(96,t+0.06); o.frequency.exponentialRampToValueAtTime(62,t+0.7);
    const gb=actx.createGain(); gb.gain.setValueAtTime(0.0004,t+0.06);
    gb.gain.exponentialRampToValueAtTime(vol*1.5,t+0.16); gb.gain.exponentialRampToValueAtTime(0.0004,t+0.8);
    o.connect(gb).connect(sfxBus); o.start(t+0.06); o.stop(t+0.9); }

  // ── BIRDSONG. One call is a run of 2 to 5 whistled notes, each a quick pitch sweep; the runs
  // are spaced randomly and panned randomly so they read as different birds around the map.
  function bird(vol){ if(!actx) return; const t0=actx.currentTime;
    const pan=actx.createStereoPanner?actx.createStereoPanner():null;
    const out=actx.createGain(); out.gain.value=vol;
    if(pan){ pan.pan.value=Math.random()*1.6-0.8; out.connect(pan).connect(ambBus); } else out.connect(ambBus);
    const n=2+Math.floor(Math.random()*4), base=2200+Math.random()*1700, up=Math.random()<0.5;
    for(let i=0;i<n;i++){ const t=t0+i*(0.07+Math.random()*0.09), d=0.05+Math.random()*0.06;
      const o=actx.createOscillator(); o.type='sine';
      const f=base*(1+i*(up?0.06:-0.05))*(0.94+Math.random()*0.12);
      o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*(up?1.5:0.68),t+d);
      const g=actx.createGain(); g.gain.setValueAtTime(0.0004,t);
      g.gain.exponentialRampToValueAtTime(1,t+0.012); g.gain.exponentialRampToValueAtTime(0.0004,t+d);
      o.connect(g).connect(out); o.start(t); o.stop(t+d+0.02); } }

  // ── WOOD CREAK, for the run-down house. A creak is stick-slip: the timber grips, releases,
  // grips again, so this is a high-Q band sweeping DOWN while its level stutters, over a low
  // body thump. Volume comes from how close the player is to the house (see audioFrame).
  function creak(vol){ if(!actx) return; const t=actx.currentTime, dur=0.45+Math.random()*0.65;
    const src=actx.createBufferSource(); src.buffer=loopBuf; src.loop=true;
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=13+Math.random()*9;
    const f0=185+Math.random()*150;
    bp.frequency.setValueAtTime(f0,t); bp.frequency.linearRampToValueAtTime(f0*(0.58+Math.random()*0.28),t+dur);
    const g=actx.createGain(); g.gain.setValueAtTime(0.0004,t); g.gain.exponentialRampToValueAtTime(vol,t+0.05);
    let tt=t+0.05; while(tt<t+dur-0.12){ const d=0.035+Math.random()*0.1;   // the stutter
      g.gain.exponentialRampToValueAtTime(vol*(0.22+Math.random()*0.8),tt+d); tt+=d; }
    g.gain.exponentialRampToValueAtTime(0.0004,t+dur);
    src.connect(bp).connect(g).connect(ambBus); src.start(t); src.stop(t+dur+0.05);
    const o=actx.createOscillator(); o.type='sine';                        // the beam taking the load
    o.frequency.setValueAtTime(86+Math.random()*22,t); o.frequency.exponentialRampToValueAtTime(58,t+dur*0.8);
    const gb=actx.createGain(); gb.gain.setValueAtTime(0.0004,t);
    gb.gain.exponentialRampToValueAtTime(vol*0.55,t+0.09); gb.gain.exponentialRampToValueAtTime(0.0004,t+dur*0.9);
    o.connect(gb).connect(ambBus); o.start(t); o.stop(t+dur); }

  // ── ELECTRIC ARC. The Easter egg's only tell: something in the chest behind the run-down house
  // is still live. Three or four crackling bursts over half a second, each a highpassed noise
  // snap over a detuned square pair with the pitch jittering, under a low thrum. Deliberately
  // short and dry so it reads as a spark, not a machine.
  // TAKE-OFF: the scuff of the boots leaving the plate, a low thump under it for the push, and a
  // whoosh that sweeps UP as he goes. The sweep is the whole trick: the same noise burst with a
  // fixed filter is a landing, and only the rising bandpass says he is leaving.
  // lvl scales the whole thing; sweep is the rising whoosh, which belongs to LEAVING. A leap comes
  // back down, so it gets the scuff and the thump and no sweep, and the two read as related events
  // rather than the same one.
  function launchSfx(surf, lvl, sweep){
    if(!actx||!sndOn) return; const t=actx.currentTime;
    const L=lvl==null?1:lvl; if(sweep==null) sweep=true;
    tick(8, surf);                                       // the boots pushing off, on whatever he is standing on
    const o=actx.createOscillator(); o.type='triangle';  // the thump of the push itself
    o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(46,t+0.16);
    const g=actx.createGain(); g.gain.setValueAtTime(0.26*L,t); g.gain.exponentialRampToValueAtTime(0.0004,t+0.20);
    o.connect(g).connect(sfxBus); o.start(t); o.stop(t+0.22);
    if(!sweep) return;
    const src=actx.createBufferSource(); src.buffer=noiseBuf;   // the whoosh
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.1;
    bp.frequency.setValueAtTime(260,t); bp.frequency.exponentialRampToValueAtTime(2900,t+0.34);
    const wg=actx.createGain(); wg.gain.setValueAtTime(0.0001,t);
    wg.gain.exponentialRampToValueAtTime(0.22*L,t+0.10);
    wg.gain.exponentialRampToValueAtTime(0.0004,t+0.42);
    src.connect(bp).connect(wg).connect(sfxBus); src.start(t); src.stop(t+0.46);
    const o2=actx.createOscillator(); o2.type='sine';    // a thin rising tone so the whoosh has a direction
    o2.frequency.setValueAtTime(190,t); o2.frequency.exponentialRampToValueAtTime(620,t+0.30);
    const g2=actx.createGain(); g2.gain.setValueAtTime(0.0001,t);
    g2.gain.exponentialRampToValueAtTime(0.09*L,t+0.07); g2.gain.exponentialRampToValueAtTime(0.0004,t+0.34);
    o2.connect(g2).connect(sfxBus); o2.start(t); o2.stop(t+0.36);
  }
  // measured at 1.25: 5.9x a footstep in mean power, level with the landing beat and well under
  // the chest's arc at 21.9, with the peak at 0.33 against that arc's 0.383
  const SUITON_LVL=1.25;
  // ── THE SUIT GOING ON. A TRANSFORMER folding together, short. The signature of that sound is
  // not the impacts, it is the RATCHET: a dense run of pitched clicks that accelerates and rises,
  // which is what reads as a mechanism running rather than a pile of parts landing. Everything
  // else hangs off it. Synthesised like the rest of the Realm, no files ship.
  //
  //   0.00  the ratchet, 26 clicks, interval 0.030 closing to 0.012, pitch 900 up to 3000
  //   0.05  three SERVOS overlapping at different pitches, one of them running backwards
  //   0.10  two metallic SLIDES, a bandpass sweeping across noise
  //   0.62  the LOCK: a low clunk with two inharmonic partials ringing on over it
  //
  // Under a second end to end. What it deliberately does NOT have any more is a reactor hum
  // underneath: that was the Iron Man reading, and it made the whole thing sit still.
  function suitOnSfx(){
    if(!actx||!sndOn) return; const t0=actx.currentTime;
    // one bus for the whole event, so its level against the rest of the Realm is a single number
    const bus=actx.createGain(); bus.gain.value=SUITON_LVL; bus.connect(sfxBus);
    // THE RATCHET. High Q on the bandpass is what makes each click PITCHED rather than a tick, and
    // the pitch climbing over the run is what makes it a mechanism closing rather than a rattle.
    let t=t0, gap=0.030;
    for(let i=0;i<26;i++){
      const u=i/25;
      grain(t, 0.085+0.05*u+Math.random()*0.02, 900+2100*u*u, 9+6*Math.random(), 0.011, bus);
      if(i%3===0){                                        // every third tooth bites harder
        const o=actx.createOscillator(); o.type='square';
        o.frequency.setValueAtTime(190+340*u, t);
        const g=actx.createGain(); g.gain.setValueAtTime(0.055,t);
        g.gain.exponentialRampToValueAtTime(0.0004,t+0.022);
        o.connect(g).connect(bus); o.start(t); o.stop(t+0.03);
      }
      t+=gap; gap=Math.max(0.012, gap*0.938);
    }
    const lock=t+0.05;
    // THE SERVOS. Three, overlapping, at different pitches, and the middle one runs DOWN: motors
    // that all sweep the same way read as one motor, and one part going the other way is what
    // makes it sound like several things moving at once.
    [[0.05,150,430,0.22],[0.17,320,180,0.16],[0.30,220,560,0.20]].forEach(([off,f0,f1,dur])=>{
      const o=actx.createOscillator(); o.type='sawtooth';
      const a=t0+off, e=a+dur;
      o.frequency.setValueAtTime(f0,a); o.frequency.exponentialRampToValueAtTime(f1,e);
      const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=6;
      lp.frequency.setValueAtTime(Math.max(f0,f1)*3.2,a); lp.frequency.exponentialRampToValueAtTime(Math.max(f0,f1)*1.4,e);
      const g=actx.createGain(); g.gain.setValueAtTime(0.0001,a);
      g.gain.exponentialRampToValueAtTime(0.055,a+0.035);
      g.gain.exponentialRampToValueAtTime(0.0003,e);
      o.connect(lp).connect(g).connect(bus); o.start(a); o.stop(e+0.02);
    });
    // THE SLIDES: plate travelling on plate, a bandpass running across noise
    [[0.10,2600,900,0.16],[0.38,1200,3400,0.13]].forEach(([off,f0,f1,dur])=>{
      const a=t0+off;
      const src=actx.createBufferSource(); src.buffer=noiseBuf;
      const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=3.5;
      bp.frequency.setValueAtTime(f0,a); bp.frequency.exponentialRampToValueAtTime(f1,a+dur);
      const g=actx.createGain(); g.gain.setValueAtTime(0.0001,a);
      g.gain.exponentialRampToValueAtTime(0.075,a+0.03);
      g.gain.exponentialRampToValueAtTime(0.0004,a+dur);
      src.connect(bp).connect(g).connect(bus); src.start(a); src.stop(a+dur+0.02);
    });
    // THE LOCK. One clunk with weight under it, and two INHARMONIC partials ringing on: harmonic
    // ones would read as a bell, and this has to read as a plate seating home.
    const o=actx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(180,lock); o.frequency.exponentialRampToValueAtTime(58,lock+0.13);
    const g=actx.createGain(); g.gain.setValueAtTime(0.30,lock); g.gain.exponentialRampToValueAtTime(0.0004,lock+0.17);
    o.connect(g).connect(bus); o.start(lock); o.stop(lock+0.2);
    grain(lock, 0.22, 1800, 1.0, 0.05, bus);
    [1730, 2590].forEach((f,i)=>{
      const p=actx.createOscillator(); p.type='triangle'; p.frequency.setValueAtTime(f,lock);
      const pg=actx.createGain(); pg.gain.setValueAtTime(0.05-0.015*i,lock);
      pg.gain.exponentialRampToValueAtTime(0.0004,lock+0.34-0.08*i);
      p.connect(pg).connect(bus); p.start(lock); p.stop(lock+0.4);
    });
  }
  function zap(vol){ if(!actx||!sndOn) return; const t0=actx.currentTime;
    const n=3+Math.floor(Math.random()*2);
    for(let i=0;i<n;i++){ const t=t0+i*(0.07+Math.random()*0.11), d=0.05+Math.random()*0.07;
      grain(t, vol*(0.7+Math.random()*0.6), 3200+Math.random()*2800, 1.0, d);
      for(const det of [1,1.013]){                       // two detuned squares: the buzz of an arc
        const o=actx.createOscillator(); o.type='square';
        const f=(170+Math.random()*240)*det;
        o.frequency.setValueAtTime(f,t);
        o.frequency.linearRampToValueAtTime(f*(0.7+Math.random()*0.7), t+d);
        const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(vol*0.5,t+0.006);
        g.gain.exponentialRampToValueAtTime(0.0001,t+d);
        o.connect(g).connect(sfxBus); o.start(t); o.stop(t+d+0.02); } }
    const o=actx.createOscillator(); o.type='sawtooth';  // the thrum underneath
    o.frequency.setValueAtTime(58,t0); o.frequency.exponentialRampToValueAtTime(41,t0+0.55);
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220;
    const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol*0.45,t0+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.6);
    o.connect(lp).connect(g).connect(sfxBus); o.start(t0); o.stop(t0+0.65); }
  // where you have to be standing to hear it: across the bridge (its deck ends at z -15.52),
  // on the approach in front of the run-down house (its front wall is z -21.40)
  const ZAP_ZONE=[16.6,25.4,-21.6,-15.2];
  let zapTimer=25+Math.random()*20;

  // ── PER FRAME. Distance fades and the two scheduled sounds. Everything is measured from the
  // PLAYER, not the camera, so swinging the camera around does not change what you hear.
  const RDH_RECT=[16.28,25.09,-30.32,-21.40];        // the run-down house's own footprint
  function nearRect(r,x,z){ return Math.hypot(Math.max(r[0]-x,0,x-r[1]), Math.max(r[2]-z,0,z-r[3])); }
  const fall=(d,near,far)=>d<=near?1:d>=far?0:(1-(d-near)/(far-near));
  function audioFrame(dt){
    if(!actx||!sndOn||actx.state!=='running') return;
    const px=player.position.x, pz=player.position.z;
    // RIVER: silent past 30 units, full at the bank. The old curve multiplied TWO linear falls
    // together, which is why the water dropped away so fast: at 8 units it was already down to
    // half, and half of a sound that quiet is nothing. One fall, bent by a 0.75 power so it
    // holds up through the near field and thins out at the far end.
    if(river){ const d=riverProj(px,pz)[0];
      river.set(mode==='hub' ? Math.pow(fall(d,2.5,30),0.75) : 0); }
    // BIRDS: a call every 3.5 to 10 seconds. They hold at full through the day, START DYING DOWN
    // AT SUNSET (the evening keyframe is dayT 0.5) and are gone well before the night keyframe at
    // 0.75, then come back at first light. The old curve peaked at midday and was already down to
    // 0.28 by sunset, so they faded through the afternoon instead of holding and then dropping.
    const sm=(a,b,x)=>{ const u=Math.max(0,Math.min(1,(x-a)/(b-a))); return u*u*(3-2*u); };
    const day = dayT<0.50 ? 1                                   // morning through sunset: full
              : dayT<0.70 ? 1-sm(0.50,0.70,dayT)                // sunset into dusk: dying down
              : dayT<0.93 ? 0                                   // night: silent
              : sm(0.93,1.00,dayT);                             // first light: back
    birdTimer-=dt;
    if(birdTimer<=0){ birdTimer=3.5+Math.random()*6.5; if(day>0.12) bird(0.030*day); }
    // THE RUN-DOWN HOUSE creaks every 7 to 17 seconds, and only when you are close enough to
    // hear it: full at the walls, nothing past 24 units.
    creakTimer-=dt;
    if(creakTimer<=0){ creakTimer=7+Math.random()*10;
      const v=fall(nearRect(RDH_RECT,px,pz),1.5,24);
      if(v>0.05 && mode==='hub') creak(0.055*v); }
    // THE CHEST'S ARC. The countdown runs all the time, but it only ever FIRES while you are
    // standing on the approach in front of the run-down house, so the sound belongs to that spot
    // and is never heard anywhere else. Miss the window and it comes back round in a few seconds
    // rather than making you wait another two minutes.
    zapTimer-=dt;
    if(zapTimer<=0){
      const inZone = px>ZAP_ZONE[0] && px<ZAP_ZONE[1] && pz>ZAP_ZONE[2] && pz<ZAP_ZONE[3];
      if(inZone && mode==='hub'){ zap(0.185); zapTimer=105+Math.random()*30; }
      else zapTimer=7;
    }
    // inside a portal menu the world is behind glass: duck the bed, keep it turning
    ambBus.gain.setTargetAtTime(mode==='hub'?1:0.35, actx.currentTime, 0.3);
  }

  // ── controls ──
  const keys={}; let camYaw=0, camPitch=0.24, camDist=8.45;   // opening shot: straight down the path from the spawn, figure small in frame
  addEventListener('keydown', e=>{ const k=e.key.toLowerCase();
    if(k==='q'){ if(viewerOpen) closeViewer(); else if(mode==='menu') exitPortal(); return; }
    // R is the way out of the Realm now that the top-right link is touch only. Same href the
    // link carried, and it works from inside a portal too, exactly as the link did.
    if(k==='r'){ location.href='/'; return; }
    if(k==='m'){ toggleSnd(); say(sndOn?'Sound on':'Sound off',1.8); return; }
    if(k==='e'){ if(mode==='hub' && nearPortal && !fading) enterPortal(nearPortal);

        pp[i].rotation.y=-Math.max(-0.5,Math.min(0.5,rel*0.10));
        pp[i].position.y=Math.sin(tt*1.1+i*0.7)*0.05; }
      if(PIPE && renderer.toneMapping!==THREE.ACESFilmicToneMapping) renderer.toneMapping=THREE.ACESFilmicToneMapping;
      renderer.setRenderTarget(null);
      renderer.setClearColor(0x000000,0); renderer.render(menuScene, menuCam);
    } else {
      key.position.set(player.position.x+SUN_OFF[0],SUN_OFF[1],player.position.z+SUN_OFF[2]); key.target.position.copy(player.position); key.target.updateMatrixWorld();
      if(PIPE && renderer.toneMapping!==THREE.NoToneMapping) renderer.toneMapping=THREE.NoToneMapping;
      if(window.__FC){ const f=window.__FC; camera.position.set(f.eye[0],f.eye[1],f.eye[2]); camera.lookAt(f.look[0],f.look[1],f.look[2]);
        if(PIPE){ PIPE.render(); return; } renderer.setClearColor(0x0c1120,1); renderer.render(scene,camera); return; }
      if(camAnim){ camAnim.t=Math.min(1,camAnim.t+dt/camAnim.dur);
        const e=camAnim.t<0.5?2*camAnim.t*camAnim.t:1-Math.pow(-2*camAnim.t+2,2)/2;
        camera.position.lerpVectors(camAnim.p0,camAnim.p1,e); camLook.lerpVectors(camAnim.l0,camAnim.l1,e); camera.lookAt(camLook);
        if(camAnim.t>=1){ const cb=camAnim.after; camAnim=null; if(cb) cb(); }
      } else {
        let hd=camDist*Math.cos(camPitch);
        const dxc=Math.sin(camYaw), dzc=Math.cos(camYaw);   // camera-collision: pull in when a wall sits between player and camera
        // the occupancy grid is sampled at GROUND body height, so it only means anything while the
        // player is near the ground; on the balcony those cells are the floor below, not obstructions
        if(player.position.y<1.5)
          for(let d=0.6; d<hd; d+=OCS){ if(camCell(player.position.x+dxc*d, player.position.z+dzc*d)){ hd=Math.max(1.0, d-0.4); break; } }
        const vd=hd*Math.tan(camPitch);
        const cx=player.position.x+dxc*hd, cz=player.position.z+dzc*hd;
        let cy=player.position.y+0.6+vd;
        // Looking UP puts the camera BELOW the player (vd is negative), and in flight that is most
        // of the time, so it has to be held off the ground exactly the way the figure is.
        // camFloorY() is the fix: the old guard asked surfaceBelow() and SKIPPED the clamp when it
        // came back null, which over open ground is almost everywhere, because the tile plate is
        // not in the heightmap at all. That is why the walk falls back to 0 for its own floor
        // (see gy), and the camera now falls back the same way instead of dropping through.
        cy=Math.max(cy, camFloorY(cx,cz,cy));
        camera.position.lerp(_v.set(cx, cy, cz), 0.2);
        // and again on the EASED position. The line above fixes the TARGET, but the camera only
        // closes a fifth of the gap each frame, so on a fast low pass it lags behind the clamp and
        // spends a beat under the plate on its own account.
        const cf=camFloorY(camera.position.x, camera.position.z, camera.position.y);
        if(camera.position.y<cf) camera.position.y=cf;
        camLook.set(player.position.x, player.position.y+0.95, player.position.z); camera.lookAt(camLook);
      }
      if(PIPE) PIPE.render();
      else { renderer.setClearColor(0x0c1120,1); renderer.render(scene, camera); }
    }
  }
  // ── DEBUG (temporary — removed before finalize): drive camera/player from the console for placement
  window.__D={ THREE, scene, renderer,
    get camera(){return camera}, player,
    set yaw(v){camYaw=v}, set pitch(v){camPitch=v}, set dist(v){camDist=v},
    get time(){return dayT}, set time(v){dayT=v; applyTOD();},
    tp(x,z){ player.position.x=x; player.position.z=z; velX=velZ=0; },
    step(dt){ frame(Math.min(dt||0.033,0.05)); },   // manual frame pump for headless verification (rAF pauses in hidden panes)
    blocked: blockedAt, portalAt, shopPad, pipe:PIPE,
    get upCells(){ return ruinsUpCells.size; },
    upAt:(x,z)=>ruinsUpCells.has(floorKey(x,z)),
    get houseUp(){ return houseUpCells.size; },
    houseUpAt:(x,z)=>houseUpCells.has(floorKey(x,z)),
    ceil:(x,z)=>ceilUnder(x,z),                       // the flight ceiling over a point, per cell
    flyAt:(x,z,y)=>flyBlocked(x,z,y),                 // would a flying body at y be blocked here
    surf:(x,z,maxY)=>surfaceBelow(x,z,maxY==null?99:maxY),
    surfaceAt:(x,z)=>surfaceAt(x,z),
    get audio(){ return {ctx:actx, master, ambBus, sfxBus, river, on:sndOn, tick, creak, bird,
      brickSnap, doorbell, doorOpen, zap}; } };
  function loop(){ requestAnimationFrame(loop); frame(Math.min(clock.getDelta(),0.05)); }
  loop();
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    menuCam.aspect=innerWidth/innerHeight; menuCam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight,false);
    if(PIPE) PIPE.setSize(); });
  </script>
</body>
</html>
