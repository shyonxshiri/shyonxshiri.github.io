<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#12151c;font-family:'Nunito',sans-serif;color:#f6f4ef;}
  /* user-select/user-drag: a drag on a bare canvas otherwise starts the BROWSER's own gesture
     (a text selection across the HUD, or a native drag of the canvas as an image), and while
     that gesture owns the pointer the page stops receiving mousemove, so the camera freezes
     mid-pan. See the mousedown handler, which preventDefaults for the same reason. */
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none;}
  .hud{position:fixed;z-index:20;pointer-events:none;}
  .tl{top:20px;left:24px;}
  .tl .t{font-family:'Fredoka',sans-serif;font-weight:700;font-size:27px;letter-spacing:.5px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35);}
  .tl .s{font-weight:800;font-size:11px;letter-spacing:1px;color:#38bdf8;margin-top:3px;}
  kbd,.key{display:inline-block;font-family:'Nunito',sans-serif;font-weight:800;font-style:normal;color:#38bdf8;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:7px;padding:0 7px;line-height:1.7;}
  .hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;font-weight:700;font-size:12.5px;white-space:nowrap;
    color:#d9dce2;background:rgba(18,21,28,.68);border:1px solid rgba(255,255,255,.14);border-radius:980px;padding:9px 20px;backdrop-filter:blur(8px);}
  .hint b{font-family:'Nunito',sans-serif;font-weight:800;color:#38bdf8;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:7px;padding:0 7px;}
  #loader{position:fixed;inset:0;z-index:50;background:#12151c;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease;}
  #loader.hide{opacity:0;pointer-events:none;}
  #loader .m{font-family:'Fredoka',sans-serif;font-weight:600;font-size:46px;}
  #loader .wrap{display:flex;flex-direction:column;align-items:center;gap:18px;}
  #loader .bar{width:min(62vw,300px);height:10px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);overflow:hidden;}
  #loader .bar i{display:block;height:100%;width:0%;background:#38bdf8;border-radius:99px;transition:width .25s ease;}
  #loader .pct{font-weight:800;font-size:12px;letter-spacing:2px;color:#38bdf8;}
  #controls{position:fixed;inset:0;z-index:60;background:rgba(12,14,20,.82);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;}
  #controls.hide{opacity:0;pointer-events:none;}
  #controls .card{width:min(92vw,470px);padding:38px 44px 34px;background:rgba(26,29,38,.95);border:1px solid rgba(255,255,255,.12);border-radius:24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45);}
  #controls h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:39px;letter-spacing:.5px;line-height:1;
    margin:0 0 30px;}   /* takes over the spacing the old subtitle line used to provide */
  #controls .row{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15.5px;color:#cfd3da;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.07);}
  #controls .row b{font-family:'Nunito',sans-serif;font-weight:800;color:#38bdf8;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:8px;padding:2px 10px;font-size:14.5px;}
  #controls .go{margin-top:30px;padding:14px 52px;background:#38bdf8;color:#20222a;border:none;border-radius:16px;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:18.5px;letter-spacing:.5px;cursor:pointer;
    box-shadow:0 4px 0 #2c93c1, 0 8px 18px rgba(0,0,0,.35);transition:transform .08s ease, box-shadow .08s ease, background .15s ease;}
  #controls .go:hover{background:#66d0fb;}
  #controls .go:active{transform:translateY(3px);box-shadow:0 1px 0 #2c93c1, 0 4px 10px rgba(0,0,0,.3);}
  /* top-right cluster: laid out by flex so the sound button can never collide with the
     Leave link, whatever width the font gives that text */
  #topright{position:fixed;top:20px;right:24px;z-index:30;display:flex;align-items:center;gap:10px;}
  /* Both buttons are TOUCH ONLY. On a keyboard R leaves and M mutes, and with the pointer
     hidden a control you have to aim at is the wrong shape for this. `body.touch` is set in
     JS, so a phone starts hidden and shows them a beat later, under the loader. */
  body:not(.touch) #topright{display:none;}
  #leave,#snd{font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;
    color:#f6f4ef;text-decoration:none;background:rgba(18,21,28,.68);border:1px solid rgba(255,255,255,.16);
    border-bottom-width:2px;border-radius:980px;backdrop-filter:blur(8px);
    transition:background .15s ease, color .15s ease;}
  #leave{padding:8px 18px;}
  #leave:hover,#snd:hover{background:rgba(56,189,248,.92);color:#20222a;border-color:rgba(56,189,248,.9);}
  #snd{width:36px;height:33px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  #snd svg{width:17px;height:17px;display:block;}
  #snd .x{display:none;} #snd.off .x{display:block;} #snd.off .w{display:none;}
  /* SUPER HERO POWERS. Two pills that only exist once the chest has been opened: one wears
     the suit, one takes off. Same pill vocabulary as the sound button beside them, and the
     lit (yellow) state means the power is currently ON. */
  #fade{position:fixed;inset:0;background:#05070d;opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:40;}
  #fade.on{opacity:1;}
  #prompt{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:25;font-weight:700;font-size:15px;
    color:#fff;background:rgba(18,21,28,.74);border:1px solid rgba(255,255,255,.16);border-radius:980px;
    padding:12px 26px;backdrop-filter:blur(8px);opacity:0;transition:opacity .18s ease;pointer-events:none;white-space:nowrap;}
  #prompt.on{opacity:1;}
  #prompt b{font-family:'Nunito',sans-serif;font-weight:800;color:#38bdf8;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:8px;padding:1px 9px;}
  #viewer{position:fixed;inset:0;z-index:45;background:rgba(7,9,14,.93);display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;}
  #viewer.on{display:flex;}
  #viewer .card{max-width:min(860px,92vw);width:100%;background:#141720;border:1px solid rgba(255,255,255,.12);border-radius:20px;overflow:hidden;}
  #viewer .mwrap{position:relative;width:100%;}
  #viewer .media{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:56px;color:#141720;}
  /* ‹ › step through an asset's extra shots (only shown when it has more than one) */
  #viewer .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
    background:rgba(12,17,32,.74);border:1px solid rgba(255,255,255,.18);color:#e7eaf0;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:24px;line-height:1;padding-bottom:3px;
    display:none;align-items:center;justify-content:center;cursor:pointer;user-select:none;z-index:2;
    transition:background .18s ease,border-color .18s ease;}
  #viewer .nav.on{display:flex;}
  #viewer .nav:hover{background:rgba(56,189,248,.3);border-color:rgba(56,189,248,.65);}
  #viewer .nav.prev{left:14px;}
  #viewer .nav.next{right:14px;}
  #viewer .cap .s{margin-top:7px;font-weight:800;font-size:11px;letter-spacing:1.4px;color:#38bdf8;}
  #viewer .cap{padding:16px 20px;font-weight:800;font-size:12.5px;letter-spacing:1px;color:#b9bdc6;}
  #viewer .cap .d{margin-top:7px;font-weight:500;font-size:12px;letter-spacing:.3px;line-height:1.55;color:#8f95a3;}
  #viewer .cap a{display:inline-block;margin:10px 16px 0 0;color:#38bdf8;font-size:12px;letter-spacing:1px;
    text-decoration:none;border-bottom:1px solid rgba(56,189,248,.45);}
  #viewer .x{position:fixed;top:22px;right:24px;font-weight:800;font-size:13px;color:#b9bdc6;cursor:pointer;}
  /* The mouse only ever DRAGS out in the world, so the pointer itself is noise: hidden over the
     canvas by default (hub mode) and put back by enterPortal, where panels are really clicked.
     Only the canvas, so every HUD control keeps its own cursor. */
  #c{z-index:1;cursor:none;}
  #shopbg{position:fixed;inset:0;z-index:0;background:#0c1120 center/cover no-repeat;filter:blur(20px) brightness(.68) saturate(1.15);opacity:0;transition:opacity .55s ease;pointer-events:none;transform:scale(1.09);}
  #shopbg.on{opacity:1;}
  /* touch controls: only rendered on coarse-pointer devices (body.touch, set in JS) */
  #joy,#btnJump,#btnAct,#btnBack,#btnDown{display:none;}
  body.touch .hint{display:none;}
  body.touch #joy{display:block;position:fixed;left:24px;bottom:24px;z-index:26;width:122px;height:122px;border-radius:50%;
    background:rgba(18,21,28,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);touch-action:none;}
  body.touch #joy .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(56,189,248,.92);box-shadow:0 3px 0 #2c93c1, 0 6px 14px rgba(0,0,0,.4);pointer-events:none;}
  body.touch #btnJump{display:flex;position:fixed;right:24px;bottom:34px;z-index:26;width:76px;height:76px;border-radius:50%;border:none;
    align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.5px;color:#20222a;
    background:rgba(56,189,248,.92);box-shadow:0 4px 0 #2c93c1, 0 8px 18px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;}
  body.touch #btnDown.on{display:flex;position:fixed;right:112px;bottom:34px;z-index:26;width:64px;height:64px;border-radius:50%;border:none;
    align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;letter-spacing:.5px;color:#20222a;
    background:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(0,0,0,.3), 0 8px 18px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;}
  body.touch #btnAct.on{display:flex;position:fixed;right:32px;bottom:128px;z-index:26;border:none;align-items:center;justify-content:center;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;letter-spacing:.5px;color:#20222a;border-radius:980px;padding:13px 26px;
    background:rgba(255,255,255,.94);box-shadow:0 4px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;}
  body.touch #btnBack.on{display:flex;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:46;border:none;align-items:center;justify-content:center;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;letter-spacing:.5px;color:#f6f4ef;border-radius:980px;padding:12px 30px;
    background:rgba(18,21,28,.74);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);touch-action:none;user-select:none;-webkit-user-select:none;}
</style>
</head>
<body>
  <div id="shopbg"></div>
  <canvas id="c"></canvas>
  <div id="topright">
    <button id="snd" title="Sound" aria-label="Toggle sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/>
      <g class="w"><path d="M15.6 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></g>
      <g class="x"><path d="M16.5 9.5l5 5"/><path d="M21.5 9.5l-5 5"/></g></svg></button>
    <a id="leave" href="/">Leave the Realm</a>
  </div>
  <div class="hint"><b>WASD</b> / arrows to walk &nbsp;·&nbsp; <b>Shift</b> run &nbsp;·&nbsp; <b>Space</b> hop &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; <b>R</b> leave</div>
  <div id="loader"><div class="wrap"><div class="m">BUILDING…</div><div class="bar"><i></i></div><div class="pct">0%</div></div></div>
  <div id="controls"><div class="card">
    <h2>CONTROLS</h2>
    <div class="row"><span>Move</span><b>WASD / Arrows</b></div>
    <div class="row"><span>Run</span><b>Shift</b></div>
    <div class="row"><span>Jump</span><b>Space</b></div>
    <div class="row"><span>Look around</span><b>Drag mouse</b></div>
    <div class="row"><span>Enter a building</span><b>E</b></div>
    <div class="row"><span>Sound</span><b>M</b></div>
    <div class="row"><span>Leave the Realm</span><b>R</b></div>
    <button class="go" id="startBtn">Enter</button>
  </div></div>
  <div id="fade"></div>
  <div id="prompt"></div>
  <div id="joy"><div class="knob" id="joyKnob"></div></div>
  <button id="btnJump">JUMP</button>
  <button id="btnDown">DOWN</button>
  <button id="btnAct">ENTER</button>
  <button id="btnBack">BACK</button>
  <div id="viewer"><div class="x">Q ✕</div><div class="card"><div class="mwrap"><div class="media"></div><div class="nav prev">‹</div><div class="nav next">›</div></div><div class="cap"></div></div></div>

  <script src="/vendor/three.min.js"></script>
  <script src="/vendor/GLTFLoader.js"></script>
  <script src="/vendor/DRACOLoader.js"></script>
  <!-- post FX (three r128 examples, vendored): bloom + SMAA. The AO and the AgX grade are ours, below. -->
  <script src="/vendor/pp/Pass.js"></script>
  <script src="/vendor/pp/CopyShader.js"></script>
  <script src="/vendor/pp/LuminosityHighPassShader.js"></script>
  <script src="/vendor/pp/UnrealBloomPass.js"></script>
  <script src="/vendor/pp/SMAAShader.js"></script>
  <script src="/vendor/pp/SMAAPass.js"></script>
  <script>
  // kick the display fonts loading immediately so canvas-drawn labels (signs, panels) use them
  if(document.fonts){ document.fonts.load('600 40px "Fredoka"'); document.fonts.load('800 14px "Nunito"'); }
  const canvas = document.getElementById('c');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0c1120);
  scene.fog = new THREE.Fog(0x0c1120, 34, 76);   // pushed back again: from the spawn point every structure reads (mansion near face ~52 away, run-down house ~34, shop ~27, ruins ~24), and the border tree line + background woodland still layer into the haze
  // SKY DOME: linear fog only tints geometry, so without this the sky stays a flat clear color and
  // the "fog" reads as a ground gradient with a hard horizon line. The dome paints the fog color at
  // the horizon and blends it up into the sky color, so the fog visibly reaches into the sky.
  const skyDome=new THREE.Mesh(
    new THREE.SphereGeometry(150, 64, 40),   // enough segments that the gradient has no faceting at the horizon
    new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false,
      uniforms:{ topColor:{value:new THREE.Color(0x9fc4e8)}, bottomColor:{value:new THREE.Color(0xbcd0e0)},
                 offset:{value:6.0}, exponent:{value:0.55}, hzn:{value:0.10} },
      // OBJECT space, not world: the dome rides with the camera, and world position would fold
      // the camera's own height back into h, which is what put the true horizon a quarter of the
      // way up the gradient. In object space h depends only on the direction you are looking.
      vertexShader:'varying vec3 vWorldPosition; void main(){ vWorldPosition=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader:'uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition;\n'+
        // hzn: the gradient does not start climbing until a little way above the horizon, so
        // there is a band of pure fog colour where the sky meets the ground. Without it the
        // gradient rises fast enough (exponent 0.55) that fully fogged ground and the sky just
        // above it differ by a visible step, and every horizon reads as an edge.
        'uniform float hzn;\n'+
        'void main(){ float h=normalize(vWorldPosition+vec3(0.0,offset,0.0)).y;\n'+
        '  float t=pow(max(h-hzn,0.0)/max(1.0-hzn,1e-4),exponent);\n'+
        '  gl_FragColor=vec4(mix(bottomColor,topColor,t),1.0); }' }));

  skyDome.frustumCulled=false;
  scene.add(skyDome);
  // The dome has to RIDE WITH THE CAMERA. Parked at the world origin its own horizon (h=0) sits
  // wherever the origin is, so from a camera 34 units up a horizontal ray landed at h~0.27 on the
  // dome, a quarter of the way up the gradient: the sky just above the true horizon came out ~21
  // luminance levels darker than the fully fogged ground and every horizon read as a hard line.
  // Centred on the camera, h at the true horizon is offset/radius, which the hzn band covers.
  function skyFollow(c){ skyDome.position.copy(c.position); }

  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setSize(innerWidth, innerHeight, false);   // updateStyle false: CSS inset:0 + 100% owns the layout box
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  // lighting — cool sky + a warm key with soft shadows (one shared composition)
  const hemi=new THREE.HemisphereLight(0x9fc0ff, 0x20304a, 0.7); scene.add(hemi);
  const amb=new THREE.AmbientLight(0xffedcf, 0.2); scene.add(amb);   // warm white: daylight reads yellow, not clinical white (night runs it at 0.11 so the tint barely registers there)
  const key = new THREE.DirectionalLight(0xffdf8f, 1.55);   // warm yellow sun
  key.position.set(7, 13, 6); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1; key.shadow.camera.far = 48;
  key.shadow.camera.left = -12; key.shadow.camera.right = 12; key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
  key.shadow.bias = -0.0004; key.shadow.radius = 3;
  scene.add(key); scene.add(key.target);
  const rim = new THREE.DirectionalLight(0x5a86ff, 0.5); rim.position.set(-7,6,-6); scene.add(rim);

  // ── ENVIRONMENT REFLECTIONS — a tiny HDR sky (gradient dome + hot sun blob + cool fill)
  // baked once through PMREM and applied scene-wide, so every brick has a real world to
  // mirror. Per-material strength lives in userData.envBase; applyTOD scales all of them
  // with the daylight so reflections dim at night instead of glinting with a daytime sky.
  const ALL_MATS=new Set();
  function regMat(m, base){ if(!m||ALL_MATS.has(m)) return; m.userData.envBase=base; ALL_MATS.add(m); }
  // One polish pass per material: LEGO ABS gets a gloss ceiling, glass gets mirror-sharp
  // clarity (the frosted look came from high roughness on the TRANS materials, not opacity).
  function polish(o, cap){
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(!m || m.roughness==null || ALL_MATS.has(m)) return;
      m.metalness=0;
      const glassy = m.transparent===true || m.opacity<1 || /trans|glass/i.test(m.name||'');
      if(glassy){ if(m.opacity<1) m.transparent=true; m.roughness=Math.min(m.roughness,0.08);
        // A LEGO glass brick is a SOLID piece, so double-sided alpha blended its front and back
        // faces both, in arbitrary order (depthWrite is off): two layers of ~50% alpha compound
        // toward white, which is what made every window read as a milky slab you could not see
        // through. Front faces only gives one layer per brick and the interiors read again.
        m.side=THREE.FrontSide;
        // and 2.0 made them mirror the painted canvas sky hard enough to wash out on their own
        regMat(m,0.85); }
      else { m.roughness=Math.min(m.roughness, cap==null?0.38:cap); regMat(m,0.5); }
    });
  }
  {
    // The sky is painted on an equirect canvas (gradient + hot sun blob + soft ground band)
    // and PMREM-filtered so every roughness level gets a clean pre-blurred reflection.
    const cv=document.createElement('canvas'); cv.width=512; cv.height=256; const cc=cv.getContext('2d');
    const grd=cc.createLinearGradient(0,0,0,256);
    grd.addColorStop(0,'#7fb2e6'); grd.addColorStop(0.5,'#dce8f2'); grd.addColorStop(0.56,'#c7d6e2');
    grd.addColorStop(0.62,'#45543f'); grd.addColorStop(1,'#242e26');
    cc.fillStyle=grd; cc.fillRect(0,0,512,256);
    const sun=cc.createRadialGradient(140,66,3,140,66,46);
    sun.addColorStop(0,'rgba(255,252,235,1)'); sun.addColorStop(0.2,'rgba(255,243,205,0.95)'); sun.addColorStop(1,'rgba(255,243,205,0)');
    cc.fillStyle=sun; cc.beginPath(); cc.arc(140,66,46,0,Math.PI*2); cc.fill();
    const fill=cc.createRadialGradient(400,80,4,400,80,60);
    fill.addColorStop(0,'rgba(190,215,255,0.75)'); fill.addColorStop(1,'rgba(190,215,255,0)');
    cc.fillStyle=fill; cc.beginPath(); cc.arc(400,80,60,0,Math.PI*2); cc.fill();
    const eqTex=new THREE.CanvasTexture(cv);
    eqTex.mapping=THREE.EquirectangularReflectionMapping; eqTex.encoding=THREE.sRGBEncoding;
    const pm=new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader();
    scene.environment=pm.fromEquirectangular(eqTex).texture;
    pm.dispose(); eqTex.dispose();
    window.__R=renderer;   // debug handle for material/reflection tuning, strip with the rest of __D
  }

  // ══ RENDER PIPELINE ═══════════════════════════════════════════════════════════
  // Blender's rendered viewport gets its solidity from two things this page never had:
  // contact darkening in every crevice, and a filmic view transform that holds saturated
  // colour instead of washing it out. So the world now renders into a linear HDR buffer,
  // picks up screen-space ambient occlusion, blooms, and is graded through AgX (the same
  // transform Blender has used since 4.0) rather than ACES.
  //
  // Cost is ONE geometry pass, exactly as before: the AO reads the depth texture the main
  // pass already writes, at half resolution. Everything after it is fullscreen quads.
  // The portal menu keeps the old direct-to-screen ACES path (see frame()), so its
  // approved look and its transparent backdrop are untouched.
  const PIPE = (function(){
    const coarse = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
    // Touch devices keep the old direct render: the HDR buffers alone are ~130MB at 2x dpr.
    if(/nopipe/.test(location.hash) || coarse || !renderer.capabilities.isWebGL2 || !THREE.FullScreenQuad) return null;

    const V='varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }';
    // shared depth helpers: the depth texture is non-linear perspective depth in [0,1]
    const DEPTH_FNS=`
      uniform sampler2D tDepth; uniform mat4 projMat; uniform mat4 invProjMat;
      uniform float cNear; uniform float cFar;
      float rawDepth(vec2 uv){ return texture2D(tDepth,uv).x; }
      float viewZ(float d){ return (cNear*cFar)/((cFar-cNear)*d-cFar); }
      vec3 viewPos(vec2 uv, float d){
        float vz=viewZ(d);
        float clipW=projMat[2][3]*vz+projMat[3][3];
        vec4 clip=vec4((vec3(uv,d)-0.5)*2.0,1.0)*clipW;
        return (invProjMat*clip).xyz;
      }`;

    // ── ambient occlusion ──────────────────────────────────────────────────────
    // Alchemy/SAO style: sample a spiral of neighbours inside a world-space radius and
    // ask how much each one rises above the surface. Normals are rebuilt from the depth
    // buffer by picking, per axis, whichever neighbour is nearer in depth, which keeps
    // silhouettes crisp. LEGO is all flat planes and cylinders, so depth-derived normals
    // are effectively exact here and we never need a second geometry pass for them.
    const aoMat=new THREE.ShaderMaterial({
      defines:{ SAMPLES:16 },
      uniforms:{ tDepth:{value:null}, projMat:{value:new THREE.Matrix4()}, invProjMat:{value:new THREE.Matrix4()},
                 cNear:{value:0.1}, cFar:{value:200}, texel:{value:new THREE.Vector2()},
                 radius:{value:0.9}, bias:{value:0.02}, intensity:{value:4.0},
                 maxR:{value:0.075}, minR:{value:0.004} },
      vertexShader:V,
      fragmentShader:DEPTH_FNS+`
      uniform vec2 texel; uniform float radius; uniform float bias; uniform float intensity;
      uniform float maxR; uniform float minR;
      varying vec2 vUv;
      // interleaved gradient noise: unlike a sin/fract hash it varies smoothly across a small
      // neighbourhood, so the blur below actually cancels it instead of smearing it around
      float ign(vec2 p){ return fract(52.9829189*fract(dot(p,vec2(0.06711056,0.00583715)))); }
      // Pick whichever of an axis's two neighbours is nearer in depth, EXCEPT when that
      // side's delta collapsed to zero. On the buffer border the offset sample clamps back
      // onto this pixel, so that delta is exactly 0, and no depth difference is ever smaller
      // than 0, so the zero side won for every pixel on the row. cross() then returned zero
      // and normalize() divided by it. The NaN normal poisoned occ, survived the depth-aware
      // blur (one NaN tap NaNs the whole sum) and clamped to black in the grade, which is the
      // dark band that ran along the bottom and top of the frame.
      vec3 axis(vec3 a, vec3 b, float da, float db){
        bool aOK = dot(a,a) > 1e-14, bOK = dot(b,b) > 1e-14;
        if(!bOK) return a;
        if(!aOK) return b;
        return da < db ? a : b;
      }
      vec3 normalAt(vec2 uv, vec3 P){
        vec2 tx=vec2(texel.x,0.0), ty=vec2(0.0,texel.y);
        vec3 pr=viewPos(uv+tx,rawDepth(uv+tx)), pl=viewPos(uv-tx,rawDepth(uv-tx));
        vec3 pu=viewPos(uv+ty,rawDepth(uv+ty)), pd=viewPos(uv-ty,rawDepth(uv-ty));
        vec3 dx = axis(pr-P, P-pl, abs(pr.z-P.z), abs(P.z-pl.z));
        vec3 dy = axis(pu-P, P-pd, abs(pu.z-P.z), abs(P.z-pd.z));
        vec3 c=cross(dx,dy);
        // both axes degenerate (a corner texel, or flat depth): no normal is derivable, so
        // face the camera rather than hand main() a NaN
        if(dot(c,c) < 1e-20) return vec3(0.0,0.0,1.0);
        vec3 n=normalize(c);
        return n.z<0.0 ? -n : n;   // view-space surfaces face the camera
      }
      void main(){
        float d=rawDepth(vUv);
        if(d>=0.9999){ gl_FragColor=vec4(1.0); return; }   // sky: no occlusion
        vec3 P=viewPos(vUv,d);
        vec3 N=normalAt(vUv,P);
        vec2 rUV=vec2(projMat[0][0],projMat[1][1])*radius*0.5/max(-P.z,0.001);
        // CLAMP THE DISC. A world radius projects bigger the nearer the surface is, and the
        // camera pulls right in against walls and portals: at 1.5 units the unclamped disc
        // covered ~63% of the screen height, so the samples landed on unrelated geometry and
        // the result was grain no blur could reach. The floor keeps far AO above a texel.
        rUV*=clamp(rUV.y,minR,maxR)/max(rUV.y,1e-6);
        float rnd=ign(gl_FragCoord.xy);
        float r2=radius*radius, occ=0.0;
        for(int i=0;i<SAMPLES;i++){
          float a=(float(i)+0.5)/float(SAMPLES);
          float ang=a*6.2831853*7.0+rnd*6.2831853;      // spiral, rotated per pixel
          vec2 suv=vUv+vec2(cos(ang),sin(ang))*a*rUV;
          // off-buffer samples clamp to the border row, which reconstructs a point that is
          // not on any real surface. Treat them as unoccluded instead of inventing geometry.
          bool inBuf = suv.x>=0.0 && suv.x<=1.0 && suv.y>=0.0 && suv.y<=1.0;
          float sd=rawDepth(suv);
          if(inBuf && sd<0.9999){
            vec3 v=viewPos(suv,sd)-P;
            float vv=dot(v,v);
            float f=max(r2-vv,0.0)/r2;                   // smooth falloff to the radius
            // clamped to 1 per sample: unbounded, a neighbour a hair above the surface
            // returns a huge value and the whole pixel crushes to black. Bounded, "every
            // sample occludes" == 1, so intensity 1.0 is roughly physically calibrated:
            // an interior corner occludes about half the spiral and lands near ao 0.5.
            occ+=f*f*f*min(max((dot(v,N)-bias)/(0.05+vv),0.0),1.0);
          }
        }
        float ao=max(0.0,1.0-occ*intensity/float(SAMPLES));
        gl_FragColor=vec4(ao,ao,ao,1.0);
      }`});

    // depth-aware separable blur: smooths the sampling noise without bleeding occlusion
    // across silhouettes (a flower's AO must not smear onto the ground behind it)
    const blurMat=new THREE.ShaderMaterial({
      uniforms:{ tAO:{value:null}, tDepth:{value:null}, cNear:{value:0.1}, cFar:{value:200}, dir:{value:new THREE.Vector2()} },
      vertexShader:V,
      fragmentShader:`
      uniform sampler2D tAO; uniform sampler2D tDepth; uniform vec2 dir;
      uniform float cNear; uniform float cFar; varying vec2 vUv;
      float viewZ(float d){ return (cNear*cFar)/((cFar-cNear)*d-cFar); }
      void main(){
        float zc=viewZ(texture2D(tDepth,vUv).x);
        float sum=0.0, wsum=0.0;
        for(int i=-4;i<=4;i++){
          vec2 uv=vUv+dir*float(i);
          float w=exp(-float(i*i)/12.0);
          w*=max(0.0,1.0-abs(viewZ(texture2D(tDepth,uv).x)-zc)*2.0);
          sum+=texture2D(tAO,uv).r*w; wsum+=w;
        }
        gl_FragColor=vec4(vec3(sum/max(wsum,1e-4)),1.0);
      }`});

    const compMat=new THREE.ShaderMaterial({
      uniforms:{ tDiffuse:{value:null}, tAO:{value:null}, strength:{value:1.0} },
      vertexShader:V,
      fragmentShader:`
      uniform sampler2D tDiffuse; uniform sampler2D tAO; uniform float strength; varying vec2 vUv;
      void main(){ vec4 c=texture2D(tDiffuse,vUv);
        gl_FragColor=vec4(c.rgb*mix(1.0,texture2D(tAO,vUv).r,strength),c.a); }`});

    // ── AgX ────────────────────────────────────────────────────────────────────
    // Blender's default view transform. ACES (what this used before) hue-skews and
    // desaturates saturated primaries, which is why the crystal kept washing to pastel
    // and why the whole scene went pale whenever reflections were pushed. AgX rolls
    // highlights off without dragging the hue with them, so LEGO reds/blues/yellows
    // survive full sun.
    const gradeMat=new THREE.ShaderMaterial({
      uniforms:{ tDiffuse:{value:null}, exposure:{value:1.0}, saturation:{value:1.25}, vignette:{value:0.16},
                 slope:{value:1.0}, offset:{value:0.0}, power:{value:1.12}, gain:{value:1.45} },
      vertexShader:V,
      fragmentShader:`
      uniform sampler2D tDiffuse; uniform float exposure; uniform float saturation; uniform float vignette;
      uniform float slope; uniform float offset; uniform float power; uniform float gain;
      varying vec2 vUv;
      const mat3 SRGB_TO_REC2020=mat3(0.6274,0.0691,0.0164, 0.3293,0.9195,0.0880, 0.0433,0.0113,0.8956);
      const mat3 REC2020_TO_SRGB=mat3(1.6605,-0.1246,-0.0182, -0.5876,1.1329,-0.1006, -0.0728,-0.0083,1.1187);
      const mat3 AGX_IN=mat3(0.856627153315983,0.137318972929847,0.11189821299995,
                             0.0951212405381588,0.761241990602591,0.0767994186031903,
                             0.0482516061458583,0.101439036467562,0.811302368396859);
      const mat3 AGX_OUT=mat3(1.1271005818144368,-0.1413297634984383,-0.14132976349843826,
                              -0.11060664309660323,1.157823702216272,-0.11060664309660294,
                              -0.016493938717834573,-0.016493938717834257,1.2519364065950405);
      vec3 agxContrast(vec3 x){
        vec3 x2=x*x, x4=x2*x2;
        return 15.5*x4*x2 - 40.14*x4*x + 31.96*x4 - 6.868*x2*x + 0.4298*x2 + 0.1191*x - 0.00232;
      }
      vec3 agx(vec3 c){
        c=SRGB_TO_REC2020*c; c=AGX_IN*c;
        c=log2(max(c,1e-10));
        c=clamp((c+12.47393)/(4.026069+12.47393),0.0,1.0);
        // ASC-CDL style "look", applied on the log-encoded value, which is where Blender
        // applies its own AgX looks. Base AgX is deliberately flat; a little power puts the
        // contrast back without touching hue the way a plain contrast curve would.
        c=pow(max(c*slope+offset,0.0),vec3(power));
        c=agxContrast(c);
        c=AGX_OUT*c;
        c=pow(max(c,vec3(0.0)),vec3(2.2));          // AgX outputs display-encoded; back to linear
        return clamp(REC2020_TO_SRGB*c,0.0,1.0);
      }
      void main(){
        // gain sits on top of the day cycle's exposure: the TIMES keyframes were tuned for
        // ACES, and AgX plus the contrast look below lands about a stop lower without it
        vec3 c=agx(texture2D(tDiffuse,vUv).rgb*exposure*gain);
        c=mix(vec3(dot(c,vec3(0.2126,0.7152,0.0722))),c,saturation);
        vec2 q=(vUv-0.5)*2.0;
        c*=1.0-vignette*dot(q,q)*0.5;
        // linear -> sRGB (this pass owns the encode; the HDR buffers before it are linear)
        gl_FragColor=vec4(mix(c*12.92, 1.055*pow(max(c,vec3(0.0)),vec3(1.0/2.4))-0.055, step(vec3(0.0031308),c)),1.0);
      }`});

    // ── BUFFER INSPECTOR (#nanview = the HDR scene buffer, #nanlit = after the occlusion is
    // multiplied in). A single non-finite pixel is invisible on its own, but every blur in the
    // pipeline SMEARS it: a separable blur turns one bad pixel into a row and then into a thick
    // band, which is exactly what a dark band across the frame looks like. GLSL ES 1.00 has no
    // isnan(), so NaN is caught as "neither >=0 nor <=0", which is true of nothing else.
    const nanMat=new THREE.ShaderMaterial({ uniforms:{ tDiffuse:{value:null} }, vertexShader:V,
      fragmentShader:`
      uniform sampler2D tDiffuse; varying vec2 vUv;
      void main(){ vec3 c=texture2D(tDiffuse,vUv).rgb;
        bool nan = !(c.r>=0.0||c.r<=0.0) || !(c.g>=0.0||c.g<=0.0) || !(c.b>=0.0||c.b<=0.0);
        bool inf = max(max(c.r,c.g),c.b) > 1e18;
        // everything finite is shown as the world normally looks (Reinhard + gamma, no grade),
        // so the frame stays readable and a flagged pixel is unmistakable against it
        vec3 t=pow(max(c/(c+1.0),vec3(0.0)),vec3(1.0/2.2));
        gl_FragColor = nan ? vec4(1.0,0.0,1.0,1.0) : inf ? vec4(0.0,1.0,1.0,1.0) : vec4(t,1.0); }`});
    // raw AO straight to the screen, for tuning radius/intensity (window.__D.pipe.debugAO)
    // AO sits between about 0.7 and 1.0 over most of a frame, so shown raw it is a white screen
    // with almost nothing in it. This stretches 0.35..1 across the full range so the occlusion is
    // actually legible, and paints anything non-finite magenta.
    const aoViewMat=new THREE.ShaderMaterial({ uniforms:{ tAO:{value:null} }, vertexShader:V,
      fragmentShader:`
      uniform sampler2D tAO; varying vec2 vUv;
      void main(){ float a=texture2D(tAO,vUv).r;
        if(!(a>=0.0||a<=0.0)){ gl_FragColor=vec4(1.0,0.0,1.0,1.0); return; }
        float s=clamp((a-0.35)/0.65,0.0,1.0); gl_FragColor=vec4(s,s,s,1.0); }`});
    // ── MASTER DIAL ────────────────────────────────────────────────────────────
    // FULL is the 100% look; setAmount(a) lerps every effect from neutral (a=0, which is
    // plain AgX with no AO, bloom, vignette or contrast look) up to FULL (a=1). One knob
    // so the whole thing stays balanced instead of drifting as individual values are poked.
    // gain is NOT an effect, it is the exposure calibration that keeps AgX from sitting a
    // stop under ACES, so it only moves enough to hold brightness steady as `power` eases.
    const FULL={ ao:1.0, bloom:0.22, vignette:0.16, power:1.12, saturation:1.25 };
    let aoAmount=FULL.ao, amount=1;
    function setAmount(a){
      amount=Math.max(0,Math.min(1,a));
      aoAmount=FULL.ao*amount;
      if(bloom) bloom.strength=FULL.bloom*amount;
      gradeMat.uniforms.vignette.value=FULL.vignette*amount;
      gradeMat.uniforms.power.value=1+(FULL.power-1)*amount;
      gradeMat.uniforms.saturation.value=1+(FULL.saturation-1)*amount;
      gradeMat.uniforms.gain.value=1.45-0.09*(1-amount);
    }
    const quad=new THREE.FullScreenQuad(compMat);
    const HDR={ type:THREE.HalfFloatType, minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat, depthBuffer:true };
    const LDR={ type:THREE.UnsignedByteType, minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat, depthBuffer:false };
    let rtScene,rtLit,rtLDR,rtAO,rtAOb,bloom,smaa,W=0,H=0;

    function alloc(w,h){
      const hw=Math.max(1,Math.floor(w/2)), hh=Math.max(1,Math.floor(h/2));
      if(!rtScene){
        rtScene=new THREE.WebGLRenderTarget(w,h,HDR);
        rtScene.depthTexture=new THREE.DepthTexture(w,h);
        rtScene.depthTexture.type=THREE.UnsignedIntType;
        rtLit=new THREE.WebGLRenderTarget(w,h,HDR);
        rtLDR=new THREE.WebGLRenderTarget(w,h,LDR);
        rtAO=new THREE.WebGLRenderTarget(hw,hh,LDR);
        rtAOb=new THREE.WebGLRenderTarget(hw,hh,LDR);
        // threshold is in LINEAR HDR: a sunlit brick sits near 1.0, so anything under ~1.2
        // blooms the whole image into haze. Only speculars, lamps and the crystal clear this.
        // HALF RESOLUTION. Bloom is a wide soft glow, so the mip chain does not need full
        // res, and at full res it was the single most expensive thing in the pipeline (~4.2ms
        // of a ~4ms total cost). Halving it is ~4x cheaper and visually indistinguishable.
        bloom=new THREE.UnrealBloomPass(new THREE.Vector2(w/2,h/2),0.22,0.62,1.7);
        // the vendored pass allocates 8-bit mips, which clips the highlights we want to bloom
        [bloom.renderTargetBright].concat(bloom.renderTargetsHorizontal,bloom.renderTargetsVertical)
          .forEach(rt=>{ rt.texture.type=THREE.HalfFloatType; });
        smaa=new THREE.SMAAPass(w,h);
        smaa.renderToScreen=true;
        setAmount(amount);        // bloom is built here, so re-apply the dial to it
      } else {
        rtScene.setSize(w,h); rtLit.setSize(w,h); rtLDR.setSize(w,h);
        rtAO.setSize(hw,hh); rtAOb.setSize(hw,hh);
        bloom.setSize(w/2,h/2); smaa.setSize(w,h);
      }
      W=w; H=h;
      aoMat.uniforms.texel.value.set(1/w,1/h);
    }

    // sized off the renderer's own drawing buffer, never innerWidth: a page that loads in a
    // hidden tab reports innerWidth 0 and would allocate 1x1 buffers that never recover
    const _sz=new THREE.Vector2();
    function setSize(){
      renderer.getDrawingBufferSize(_sz);
      alloc(Math.max(1,Math.floor(_sz.x)), Math.max(1,Math.floor(_sz.y)));
    }

    function draw(mat,target){ quad.material=mat; renderer.setRenderTarget(target); renderer.clear(); quad.render(renderer); }

    // TEMPORARY diagnostic hashes, strip with the rest of the debug hooks. They MATCH ON
    // SUBSTRING now, not on the whole hash, so they combine: #noao-nobloom kills both. #aoview
    // puts the raw AO buffer on the screen, which is the only way to see whether an artifact is
    // in the occlusion itself or in what is done with it (Safari, no console).
    const HASH=location.hash;
    // the flags are read ONCE at load, and typing a new hash into the bar does not reload a
    // page, it only fires hashchange. Without this, switching from #noao to #aoview silently
    // leaves the old flags in force and the new one looks broken.
    addEventListener('hashchange',()=>location.reload());
    const API={
      debugAO: /aoview/.test(HASH), bypass:false,
      nanScene: /nanview/.test(HASH), nanLit: /nanlit/.test(HASH),
      useAO:   !/noao/.test(HASH),
      useBloom:!/nobloom/.test(HASH),
      useSMAA: !/nosmaa/.test(HASH),
      get amount(){ return amount; }, set amount(v){ setAmount(v); },
      ao:aoMat.uniforms, grade:gradeMat.uniforms,
      get aoStrength(){ return aoAmount; }, set aoStrength(v){ aoAmount=v; },
      get bloom(){ return bloom; },
      setSize,
      render(){
        if(API.bypass){   // old path: straight to the screen through ACES, for A/B comparison
          renderer.toneMapping=THREE.ACESFilmicToneMapping;
          renderer.setRenderTarget(null); renderer.setClearColor(0x0c1120,1); renderer.render(scene,camera);
          renderer.toneMapping=THREE.NoToneMapping; return;
        }
        if(!rtScene) setSize();
        // 1. the world, once, into linear HDR (the target's encoding makes the output linear,
        //    and toneMapping is off, so nothing is graded until the AgX pass at the end)
        renderer.setRenderTarget(rtScene);
        renderer.setClearColor(0x0c1120,1); renderer.clear();
        renderer.render(scene,camera);
        if(API.nanScene){ nanMat.uniforms.tDiffuse.value=rtScene.texture;
          renderer.setRenderTarget(null); renderer.clear(); quad.material=nanMat; quad.render(renderer); return; }
        // 2. AO from that pass's own depth buffer, half res, then a depth-aware blur
        aoMat.uniforms.tDepth.value=rtScene.depthTexture;
        aoMat.uniforms.projMat.value.copy(camera.projectionMatrix);
        aoMat.uniforms.invProjMat.value.copy(camera.projectionMatrixInverse);
        aoMat.uniforms.cNear.value=blurMat.uniforms.cNear.value=camera.near;
        aoMat.uniforms.cFar.value=blurMat.uniforms.cFar.value=camera.far;
        if(API.useAO){
          draw(aoMat,rtAO);
          blurMat.uniforms.tDepth.value=rtScene.depthTexture;
          blurMat.uniforms.tAO.value=rtAO.texture;
          blurMat.uniforms.dir.value.set(3/W,0); draw(blurMat,rtAOb);
          blurMat.uniforms.tAO.value=rtAOb.texture;
          blurMat.uniforms.dir.value.set(0,3/H); draw(blurMat,rtAO);
        }
        // 3. multiply the occlusion in, still in HDR
        compMat.uniforms.tDiffuse.value=rtScene.texture;
        compMat.uniforms.tAO.value=API.useAO?rtAO.texture:null;
        compMat.uniforms.strength.value=API.useAO?aoAmount:0;
        if(API.debugAO){ aoViewMat.uniforms.tAO.value=rtAO.texture;
          renderer.setRenderTarget(null); renderer.clear(); quad.material=aoViewMat; quad.render(renderer); return; }
        draw(compMat,rtLit);
        if(API.nanLit){ nanMat.uniforms.tDiffuse.value=rtLit.texture;
          renderer.setRenderTarget(null); renderer.clear(); quad.material=nanMat; quad.render(renderer); return; }
        // 4. bloom (adds into rtLit in place), 5. AgX grade, 6. SMAA to the screen
        if(API.useBloom) bloom.render(renderer,null,rtLit);
        gradeMat.uniforms.tDiffuse.value=rtLit.texture;
        gradeMat.uniforms.exposure.value=renderer.toneMappingExposure;
        if(API.useSMAA){ draw(gradeMat,rtLDR); renderer.setRenderTarget(null); smaa.render(renderer,null,rtLDR); }
        else draw(gradeMat,null);
      }
    };
    return API;
  })();
  if(PIPE){
    renderer.toneMapping=THREE.NoToneMapping;   // the AgX pass grades instead; exposure still comes from applyTOD
    PIPE.setSize();
    PIPE.amount=0.8;      // dialled back from the full look; window.__D.pipe.amount to taste
  }

  // ── day cycle: rotates continuously on a 7 minute loop (morning→midday→evening→night→morning) ──
  // At full night the sun is OFF (si 0) and the rim is soft, so no stray glint/reflection pools on
  // the ground; every value below is smoothly interpolated between neighbors, so lights fade in/out
  // slowly as the cycle turns instead of snapping.
  const TIMES=[
    {n:'morning', sky:0x8fc0ec, fog:0xb2cade, sun:0xffcf83, si:1.22, hs:0xb3ccec, hg:0x4d5f78, hi:0.56, amb:0.18, exp:1.04, off:[11,7,8],  rim:0x8fb0ff, ri:0.40, lamp:0.15, env:0.8},

    // is 0.8 above the deck, well over LOWSTEP, so there is nothing to step onto
    if(player.position.y>UP_FROM && ruinsUpCells.has(floorKey(px,pz))) return true;
    // and the mansion's upstairs, once you have flown into it: its own walls and the balcony
    // parapet, which stand entirely above the ground grid and are scenery to it
    if(player.position.y>HU_FROM && houseUpCells.has(floorKey(px,pz))) return true;
    if(!cell(px,pz)) return false;                                             // no body-height geometry → free
    return surfaceBelow(px,pz, player.position.y+(inStair(px,pz)?MAXSTEP:LOWSTEP))===null; }  // solid with no reachable surface → wall
  function stepBlocked(x,z){ return stepOne(x,z)||stepOne(x+PRAD,z)||stepOne(x-PRAD,z)||stepOne(x,z+PRAD)||stepOne(x,z-PRAD); }
  // prompt shows only within ~2 studs of the shop's actual barrier
  function nearShopBarrier(x,z){ const R=2*PITCH+PRAD;
    for(let dx=-R;dx<=R+0.001;dx+=OCS) for(let dz=-R;dz<=R+0.001;dz+=OCS){ if(dx*dx+dz*dz>R*R) continue;
      if(shopCells.has(Math.floor((x+dx)/OCS)*100003+Math.floor((z+dz)/OCS))) return true; } return false; }

  // ── placeholder brick "buildings" (to be replaced with real brick builds) ──
  const U=0.37, BRICK_H=0.44;
  const studGeo = new THREE.CylinderGeometry(U*0.3, U*0.3, 0.09, 12);
  function makeBrick(wS,dS,hB,mat){ const g=new THREE.Group(); const w=wS*U,d=dS*U,h=hB*BRICK_H;
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); b.castShadow=b.receiveShadow=true; b.position.y=h/2; g.add(b);
    for(let i=0;i<wS;i++)for(let j=0;j<dS;j++){ const s=new THREE.Mesh(studGeo,mat); s.castShadow=s.receiveShadow=true;
      s.position.set(-w/2+(i+0.5)*U, h+0.02, -d/2+(j+0.5)*U); g.add(s);} return g; }
  function label(t){ const c=document.createElement('canvas'); c.width=256;c.height=64; const x=c.getContext('2d');
    x.fillStyle='#0c1120'; x.fillRect(0,0,256,64); x.fillStyle='#38bdf8'; x.font='600 36px "Fredoka",sans-serif';
    x.textAlign='center'; x.textBaseline='middle'; x.fillText(t.toUpperCase(),128,36); const tx=new THREE.CanvasTexture(c); tx.anisotropy=4; return tx; }
  function building(x,z,ry,name,cA,cB){ const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry;
    const mA=plastic(cA),mB=plastic(cB),mG=plastic(0x8b8f96);
    const pL=makeBrick(2,4,5,mA); pL.position.x=-2.4*U; g.add(pL);
    const pR=makeBrick(2,4,5,mA); pR.position.x= 2.4*U; g.add(pR);
    const lin=makeBrick(7,4,1,mB); lin.position.y=5*BRICK_H; g.add(lin);
    const rf1=makeBrick(6,3,1,mG); rf1.position.y=6*BRICK_H; g.add(rf1);
    const rf2=makeBrick(4,2,1,mB); rf2.position.y=7*BRICK_H; g.add(rf2);
    const sf=new THREE.Mesh(new THREE.PlaneGeometry(6*U*0.9,1.0*U),new THREE.MeshBasicMaterial({map:label(name),transparent:true}));
    sf.position.set(0,4.4*BRICK_H,2*U+0.13); g.add(sf); scene.add(g); g.updateWorldMatrix(true,true); rasterizeSolid(g); return g; }
  // (Work placeholder removed — spawn point is here now)

  // ── player + figure ──
  const player = new THREE.Group(); scene.add(player);
  player.position.set(snap(-2.61),0,snap(-2.65));          // spawn on the gravel junction, looking straight down the path
  player.rotation.y=Math.PI;                               // already facing away from the camera: no spin on the first frame
  const figBody = new THREE.Group(); player.add(figBody);  // waddle applied here

  // limb pivots for the walk cycle — placed at the REAL sockets/hinges so each
  // limb rotates inside its own hole (top pinned) rather than see-sawing.
  let hipL=null,hipR=null,shL=null,shR=null;
  // The SUIT's own shoulder sockets. The civilian pivots above are pinned at the TOP EDGE of the
  // civilian arm, which is right for a 25 degree walk swing and wrong for the 123 degree flight
  // raise: an arm turned that far about its top edge carries its whole shoulder cap out of the
  // torso. The suit's arms are a different piece anyway, so they get pivots on the hinge the part
  // actually has. See armHinge() and buildHero(); driven from shL/shR every frame.
  let hShL=null,hShR=null;
  function rigFigure(model){
    const hub=model.getObjectByName('Node-jesse_dot_io'); if(!hub) return;
    model.updateWorldMatrix(true,true);
    // classify + place in the MODEL's own local space so the player's facing rotation
    // (which may already be spinning by the time async loading finishes) can't corrupt it.
    const inv=new THREE.Matrix4().copy(model.matrixWorld).invert();
    const tmp=new THREE.Matrix4(), v=new THREE.Vector3(), off=model.position;
    function localBox(o){ o.updateWorldMatrix(true,false); tmp.multiplyMatrices(inv,o.matrixWorld);
      const g=o.geometry; g.computeBoundingBox(); const bb=g.boundingBox; const box=new THREE.Box3();
      for(const X of[bb.min.x,bb.max.x]) for(const Y of[bb.min.y,bb.max.y]) for(const Z of[bb.min.z,bb.max.z]){ v.set(X,Y,Z).applyMatrix4(tmp); box.expandByPoint(v); }
      return box; }
    const info=[];
    hub.traverse(o=>{ if(o.isMesh){ const b=localBox(o);
      info.push({o, cx:(b.min.x+b.max.x)/2, cz:(b.min.z+b.max.z)/2, minY:b.min.y, maxY:b.max.y, minZ:b.min.z}); } });
    const leftLeg  = info.find(m=>m.cx<-0.05 && m.cx>-0.28 && m.minY<0.4);
    const rightLeg = info.find(m=>m.cx> 0.05 && m.cx< 0.28 && m.minY<0.4);
    const leftArm  = info.filter(m=>m.cx<=-0.28);
    const rightArm = info.filter(m=>m.cx>= 0.28);
    // figBody-local = model-local + model.position (model has scale 1, rotation 0)
    const pivot=(x,y,z)=>{ const p=new THREE.Group(); p.position.set(x+off.x,y+off.y,z+off.z); figBody.add(p); return p; };
    if(leftLeg) { hipL=pivot(leftLeg.cx,  leftLeg.maxY-0.04,  leftLeg.cz);  hipL.attach(leftLeg.o); }
    if(rightLeg){ hipR=pivot(rightLeg.cx, rightLeg.maxY-0.04, rightLeg.cz); hipR.attach(rightLeg.o); }
    function shoulder(group){ const y=Math.max(...group.map(m=>m.maxY))-0.03;
      const z=Math.min(...group.map(m=>m.minZ))+0.05; const x=group.reduce((s,m)=>s+m.cx,0)/group.length;
      const p=pivot(x,y,z); group.forEach(m=>p.attach(m.o)); return p; }
    if(leftArm.length)  shL=shoulder(leftArm);
    if(rightArm.length) shR=shoulder(rightArm);
  }

  // ── SHARED GREY-BOUNDARY MATH. wob() is a fixed sum of sines (deterministic, identical
  // every load) that wanders every grey boundary; rrect() is a rounded-rectangle distance;
  // fringe() is the outward-only spill past a pad rim. These live out here rather than
  // inside the ground loader because the coffee shop's portal trigger zone is defined from
  // the SAME outline the grey tiles are laid from: one source of truth, so the "Press E"
  // area can never drift out of sync with the grey the player can see under their feet.
  const wob=(x,z)=>0.55*Math.sin(x*0.42+z*0.17+1.7)+0.30*Math.sin(z*0.51-x*0.23+4.1)+0.15*Math.sin((x+z)*0.88+2.3);
  const rrect=(x,z,x0,x1,z0,z1,r)=>{ const dx=Math.abs(x-(x0+x1)/2)-((x1-x0)/2-r), dz=Math.abs(z-(z0+z1)/2)-((z1-z0)/2-r);
    return Math.hypot(Math.max(dx,0),Math.max(dz,0))+Math.min(Math.max(dx,dz),0)-r; };
  const cl=u=>u<0?0:u>1?1:u;
  const fringe=(x,z)=>0.36+0.45*(0.5+0.5*wob(x*1.31+7.2,z*1.31-3.4));   // outward only: 0.36..0.81 of gravel spilling past a pad rim
  // bank(u, side): how far one EDGE of a path wanders out from its nominal half width, u units
  // along it. This is what the river's banks do and what wob() alone cannot: wob is a function
  // of POSITION, so it moves both edges of a path the same way at the same time and the ribbon
  // just breathes, staying an even width. Giving each side its own phase (11.3 apart, the same
  // trick riverHW uses) lets one edge swell while the other pulls in, which is what reads as
  // hand-laid gravel rather than a ribbon with a wobble on it. Deterministic, no randomness.
  const bank=(u,side)=>{ const p=side>0?0:11.3;
    return 0.30*Math.sin(u*0.55+p)+0.17*Math.sin(u*1.09+p*1.7+2.1)+0.09*Math.sin(u*2.13+p*0.6+0.7); };
  const BANK_A=0.56;                                                   // |bank| never exceeds this
  // The coffee shop's grey foundation pad. The rect encloses the whole shop footprint
  // (bbox x -23.41..-16.49, z -30.08..-20.17), so this covers the open patio out front as
  // well as the ring of grey around the walls, ending exactly where the grass and the
  // sidewalk's gravel begin.
  // m = optional outward margin. The tiles are laid per STUD CELL, so a cell whose center is
  // just inside the boundary still draws a 1x1 piece reaching 0.185 further out; the portal
  // zone passes m=0.2 so the outermost half-stud of visible grey prompts too.
  function shopPad(x,z,m){ return rrect(x,z,-23.48,-16.38,-30.17,-19.96,1.1) < fringe(x,z)+(m||0); }

  // ── THE WALLED GARDEN, standing out in the woods behind the mansion and entered through its
  // own brick archway. garden.glb ships the fence, the arch and the planting but NO FLOOR of its
  // own, so the ground under it is laid here: the world's lawn simply reads through the fence,
  // and a dirt track leads in from the back of the house. There is deliberately NO paving of any
  // kind around it. It stands on grass, the way something found in a wood should.
  //
  // Every bound below is MEASURED off the exported glb and then carried through the holder
  // transform, never eyeballed. The holder sits at (65.0232, 0.7389) with rotY +PI/2 and
  // loadProp recentres the model on its own bbox first (centre mx 7.64085 / mz 8.4834), so a
  // model point lands at
  //     worldX = 65.0232 + s*(mz - 8.4834)        worldZ = 0.7389 - s*(mx - 7.64085)
  // The +PI/2 is what turns the garden to face us: its archway looks down the model's own -Z
  // (identified by rendering the piece from all six sides, not guessed from the node names),
  // and rotating +PI/2 about Y carries local -Z onto world -X, i.e. back toward the mansion.
  //
  // HOW FAR OUT IT STANDS. Its front is 8.79 clear of the mansion's east face (57.212). It has
  // been moved out twice: 2.88, then 4.72, now 8.79, both times because it still read as sitting
  // on the back of the house. Getting past 4.72 meant the treeline had to move with it, so five
  // background trees whose trunks fell inside the new walkable band were pulled (see the note on
  // FAR_TREES / TRIM_TREES) and BX1 went to 71.8. Canopies were never the limit and should not be
  // treated as one: measured off tree.glb at the site's own scale, a tree is 0.46 to 0.63 in
  // radius up to y 1.0 and only spreads to 2.61 above y 1.5, so the leaves pass over your head.
  // TRUNKS are the limit, and 71.8 clears every one left on the map.
  //
  // NOTHING MAY STAND IN THE GARDEN'S GRASS, only round it. Two planted trees used to land inside
  // the fence outright and a trim tree's canopy hung over the lawn. treeOK now refuses the whole
  // GDI box grown by 3.6, which is the largest canopy a planted tree can have (2.608 * the 1.36
  // top of its random scale range), so no leaf can reach the lawn; the trees left standing round
  // it were each checked against that same radius by hand.
  //
  // THE SCALE IS THE GARDEN'S OWN BRICK PITCH, not a targetLen and not a constant borrowed from
  // another asset. Measured off its own lattice the way both cars were: stud centres on a single
  // piece run 1.1474 apart across three studs and 1.5297 across four, giving 0.382467 and
  // 0.382425, so the pitch is 0.38245 and s = PITCH/0.38245 = 0.96601. Re-measure it after any
  // re-export; nothing here may share a scale with the cars or the bridge.
  const GD =[66.001,72.174,-2.508,3.985];   // outer footprint of the fence
  const GDI=[66.437,71.740,-1.786,3.657];   // its INNER face: everything inside is left to the lawn
  // THE DIRT TRACK IN. One straight run due east into the archway, so the arrival is head-on,
  // built the way the two gravel paths are: a rounded rect with a per-side bank wander, tapered
  // out at both ends so neither the start nor the mouth arrives mid-swell. It is 4 studs across
  // at the rect, which is the archway opening's own measured width (1.508), and swells to about
  // 6 where the wander is running. It STARTS 4.4 studs clear of the mansion's east wall and the
  // taper holds that end exactly on the rect, so the gap can never be eaten into: the ask was a
  // path found in the woods, not one growing out of the back of the house.
  const GT=[58.85,66.45,-0.724,0.756];      // the rect, laid on the archway's own centreline z 0.016
  function gardenTrack(x,z){
    if(x>GDI[0]&&x<GDI[1]&&z>GDI[2]&&z<GDI[3]) return false;              // stops dead at the fence: inside is lawn
    const t=cl((x-GT[0])/1.4)*cl((GT[1]-x)/1.0);
    return rrect(x,z,GT[0],GT[1],GT[2],GT[3],0.5) < t*(0.18+0.42*bank(x*1.3+31, z<0.016?-1:1)); }

  // ── THE SECOND CAR PAD: the driveway's concrete duplicated on the cars' LEFT, which is the
  // side on your RIGHT as you stand in front of them looking back at the house. Both cars point
  // their noses down -x, so the car's own left and your own right are the same side, +z, and
  // that is the side away from the house. The mansion's plate layer ends at z 7.2845, so this
  // slab starts at 7.03 and runs 4.69 further, which is the driveway lane's own width (2.46 to
  // 7.15) laid again. Same x span as the lane, west into the sidewalk the way mansionDrive goes.
  // The 0.25 overrun INTO the plate is the same trick mansionDrive uses and is not slop: those
  // cells are on the mask so they still give way to the model, and painting them grey turns the
  // quarter-stud the two grids are out of phase by from a green hairline into part of the
  // pavement. Dead straight, no wander, for the same reason the driveway is: it is a poured slab
  // butting a plate edge, not a gravel pad. It carries no scattered bits either, so it reads as
  // the same concrete the cars already stand on rather than as another gravel walk.
  // z0 is 6.30, NOT the 7.03 it started at. The plate layer does not end at 7.2845 all the way
  // along: that is only true of the mask's row e, x 50.72..57.37. West of that, across rows a to
  // d, the mask reads '.' at both gi 36 and 37, so the model's own plate stops at z 6.545 and
  // leaves 0.74 of open ground, which the code ground then grassed. That was a green strip 7.4
  // long lying against the driveway exactly where the Porsche parks. 6.30 covers it and keeps the
  // documented quarter-stud overrun INTO the plate edge; east of 50.72 the overrun simply runs
  // under a plate that is already there, and those cells are on the mask so the model still wins.
  function carPad(x,z){ return x>43.15 && x<57.37 && z>6.30 && z<11.9745; }
  // THE PLATE'S WEST EDGE. HP_X0 is 43.3286 and every pad along this stretch deliberately overruns
  // west to 43.15 so the quarter-stud the two grids are out of phase by reads as pavement rather
  // than a green hairline. Between the drive channel (which stops at z 3.11) and the car pad
  // (which now starts at 6.30) nothing did, so a half-stud of grass ran down the plate edge for
  // three units, right across the mouth of the driveway in front of the Porsche's nose. This is
  // that same overrun and nothing more: it is deliberately NOT part of `gritty`, because the slab
  // it butts carries no scattered bits and an edge that gravelled on its own would give the seam
  // straight back.
  function plateEdge(x,z){ return x>43.15 && x<43.34 && z>3.11 && z<6.30; }

  // What is under a given spot: 'grey' (gravel walk, pads, paths), 'green' (grass) or 'water'.
  // Filled in by the ground loader from the SAME predicates the tiles are laid from, so the
  // footstep you hear can never disagree with the tile you are standing on.
  let surfaceAt=()=>'green';

  const gltf = new THREE.GLTFLoader();
  const draco = new THREE.DRACOLoader();
  draco.setDecoderPath('/vendor/draco/');
  gltf.setDRACOLoader(draco);
  let loadedGround=false, loadedFig=false, groundTopY=0;
  // loading progress: item counts from the shared default manager; displayed percent only ever climbs
  const ldBar=document.querySelector('#loader .bar i'), ldPct=document.querySelector('#loader .pct'); let ldMax=0;
  // ── LOAD DIAGNOSTIC, silent unless something is actually wrong. The preview pane has no WebGL,
  // so a stalled load cannot be watched from a session: this puts the reason on the screen for
  // whoever IS looking. It stays invisible through a normal load and only speaks up after 12
  // seconds, listing the items the manager started but never finished (a callback that throws
  // inside GLTFLoader's promise chain quietly ends an item's progress without reporting an
  // error, and so does a dev server that goes down mid-load), plus any uncaught error.
  const ldPend=new Set(), ldNote=document.createElement('div');
  ldNote.style.cssText='margin-top:16px;max-width:82vw;font:11px/1.6 ui-monospace,SFMono-Regular,monospace;'+
    'color:#ff9d9d;text-align:left;white-space:pre-wrap;word-break:break-word';
  document.getElementById('loader').appendChild(ldNote);
  const ldSay=t=>{ ldNote.textContent += (ldNote.textContent?'\n':'') + t; };
  THREE.DefaultLoadingManager.onStart=(u)=>ldPend.add(u);
  THREE.DefaultLoadingManager.onProgress=(u,l,t)=>{ ldPend.delete(u);
    const p=Math.min(100,Math.round(l/Math.max(1,t)*100));
    if(p>ldMax){ ldMax=p; ldBar.style.width=p+'%'; ldPct.textContent=p+'%'; } };
  THREE.DefaultLoadingManager.onError=(u)=>ldSay('load error: '+u);
  window.addEventListener('error', e=>ldSay('js error: '+(e.message||e.error)+'  @ '+(e.filename||'').split('/').pop()+':'+e.lineno));
  window.addEventListener('unhandledrejection', e=>{ const r=e.reason; ldSay('unhandled: '+((r&&(r.message||r.stack))||r)); });
  setTimeout(()=>{ if(document.getElementById('loader').classList.contains('hide')) return;
    ldSay('stalled at '+ldMax+'%  ground:'+(loadedGround?'ok':'waiting')+'  figure:'+(loadedFig?'ok':'waiting')
      +'\nstill loading: '+([...ldPend].map(u=>u.split('/').pop()).join(', ')||'nothing outstanding')
      +'\nif nothing is outstanding the dev server went down: restart it and hard reload'); }, 12000);
  function ready(){ if(loadedGround && loadedFig) setTimeout(()=>document.getElementById('loader').classList.add('hide'), 300); }

  // GROUND — fine 2x2 plates (0.739u). GREEN grass is the base; GREY is used for a 6-stud
  // sidewalk loop connecting the buildings, and for a foundation pad under each building.
  gltf.load('./assets/ground_small.glb', (g)=>{
    g.scene.updateMatrixWorld(true);
    let tm=null; g.scene.traverse(o=>{ if(o.isMesh && !tm) tm=o; });
    const geo = tm.geometry.clone(); geo.applyMatrix4(tm.matrixWorld); geo.computeBoundingBox();
    const bb=geo.boundingBox, sx=bb.max.x-bb.min.x, sz=bb.max.z-bb.min.z;
    geo.translate(-(bb.min.x+bb.max.x)/2, -bb.max.y, -(bb.min.z+bb.max.z)/2);
    const matGrey = tm.material; if (matGrey.map) matGrey.map.encoding = THREE.sRGBEncoding;
    matGrey.metalness=0; matGrey.roughness=Math.min(matGrey.roughness==null?0.6:matGrey.roughness, 0.55);   // plates are plastic too: subtle sheen
    const matGreen = matGrey.clone(); matGreen.color.setRGB(0.0529,0.266,0.0775);   // exact LegoGreen (linear)
    regMat(matGrey,0.35); regMat(matGreen,0.35);
    window.__matGreen = matGreen;                                                    // synced to the mansion's grass on load
    // CONSTRUCTION LAYOUT (2x): every structure sits at twice its old stud-snapped distance
    // from the world center, so the plate roughly doubles per axis (asymmetric: the mansion
    // pushes the east side out further than the shop pushes the west).
    const X0=-26.6, X1=60.6, Z0=-31.0, Z1=28.4;
    const NX=Math.round((X1-X0)/sx), NZ=Math.round((Z1-Z0)/sz), OX=(X0+X1)/2, OZ=(Z0+Z1)/2;
    // ── ORGANIC GREYS — the gravel is shaped the way the river is: nothing is left as a bare
    // rectangle. wob() is a fixed sum of sines (deterministic, identical every load) that
    // wanders every grey boundary, and rrect() is a rounded-rectangle distance, so the pads
    // turn their corners instead of cutting them at 90 degrees. How much each region may
    // wander depends on what stands on it:
    //  · the SHOP PAD only ever grows. The shop's own bbox sits within 0.07 of the old rect,
    //    so any inward wander would show grass under its walls; its fringe spills 0.36..0.81
    //    past the rect all the way round, and the 0.36 floor always clears the 1.1 corner
    //    radius (a rounded corner cuts in at most 0.293r), so the old rect is never eaten into.
    //  · the RUINS PAD has 1.2 to 2.3 of margin to the structure, so it wanders both ways
    //    (+/-0.5) over a heavy 1.8 corner radius: a weathered gravel apron, not a square.
    //  · the two NARROW PATHS wander per side (-0.12 to +0.56, so 5.4 to 9 studs across),
    //    tapered back to their exact rect wherever something has to line up: the ruins
    //    doorway, the bridge deck, the sidewalk junctions.
    //  · the SIDEWALK's two edges wander INDEPENDENTLY along the arc (6.4 to 12.4 studs
    //    across, 9.5 on average against the old flat 8), and every bend carries a lobed
    //    corner disc so junctions widen out instead of turning a clean arc.
    // The tile loop below then rebuilds every tile the boundary crosses out of 1x1 pieces, so
    // the outline steps stud by stud (same treatment as the shoreline mosaic).
    // wob / rrect / cl / fringe / shopPad are hoisted to module scope (above the loader)
    // GRAVEL PATH from the spawn walk to the ruins doorway. 6 studs wide (3 tile columns:
    // centers -3.31 / -2.571 / -1.833, so the strip spans x -3.679..-1.464), which brackets
    // the doorway opening measured off the model by raycast (gap x -3.325..-1.415 in the front
    // wall face at z 16.03). It runs due +z from inside the walk's north edge (the walk covers
    // z -4.478..-1.522 here, directly behind the spawn point at -4.43/-3.33) and now overruns
    // into the ruins' own pad at 13.6, so the two greys still meet with no seam even where the
    // pad's wandering rim pulls back. The wander tapers out at both junctions.
    function ruinsPath(x,z){ const t=cl((z+2.6)/2.0)*cl((13.6-z)/2.0);
      return rrect(x,z,-3.6,-1.5,-2.6,13.6,0.5) < t*(0.22+0.6*bank(z*1.3, x<-2.55?-1:1)); }
    // 6-stud path from the walk to the run-down house's door. The river cuts it and the bridge
    // carries it, so the wander is held flat across the bridge corridor (the deck's own ends
    // must meet a full-width path) and at the walk and door junctions.
    function rdPath(x,z){ const t=cl((-4.0-z)/1.8)*cl((z+21.6)/1.8)*(1-cl((z+17.6)/1.5)*cl((-7.0-z)/1.5));
      return rrect(x,z,19.55,21.84,-21.6,-4.0,0.5) < t*(0.22+0.6*bank(z*1.3+40, x<20.7?-1:1)); }
    // grey foundation pads under the buildings (each rect = old rect + its structure's 2x move delta)
    function onPad(x,z){

    // about an axis running through it sideways, which is what dragged the neck ring out of shape.
    // Nothing here assumes an orientation: UP and BACK are read off the mesh's own matrix, so any
    // re-export, from either handedness, lands the same.
    mesh.updateWorldMatrix(true,false);

    const ax=new THREE.Vector3(e[0],e[1],e[2]).normalize();      // the local axes, in figBody space
    const ay=new THREE.Vector3(e[4],e[5],e[6]).normalize();
    const az=new THREE.Vector3(e[8],e[9],e[10]).normalize();
    const UP  =new THREE.Vector3(ax.y, ay.y, az.y).normalize();  // figBody +Y written in LOCAL coords
    const BACK=new THREE.Vector3(-ax.z,-ay.z,-az.z).normalize(); // figBody -Z, i.e. behind him
    const LAT =new THREE.Vector3().crossVectors(BACK,UP).normalize();
    const v=new THREE.Vector3();
    let h0=1e9,h1=-1e9,l0=1e9,l1=-1e9;
    const hv=new Float32Array(pa.count), lv=new Float32Array(pa.count);
    for(let i=0;i<pa.count;i++){ v.fromArray(rest,i*3);
      const h=v.dot(UP), l=v.dot(LAT); hv[i]=h; lv[i]=l;
      if(h<h0)h0=h; if(h>h1)h1=h; if(l<l0)l0=l; if(l>l1)l1=l; }
    // ── THE PIN. The neck ring that clips onto the torso is the top of the piece and must not move
    // by so much as a vertex: measured on hero_cape the ring sits in the top 1% of the height with
    // an inner radius of 0.116 about the torso's neck axis. Pinning the top 11% puts the boundary
    // 0.12 clear BELOW the ring's own underside, so the hole keeps its size and its shape whatever
    // the sheet does. Cloth is constrained where it is attached anyway, so this costs nothing.
    const H=(h1-h0)||1, pinH=h1-H*0.11;
    // ── THE HINGE is the sheet's own top row, not the collar's centre: swinging the sheet about
    // where it actually meets the collar is what keeps it attached instead of tearing away from it.
    // Found as the highest vertex that is NOT pinned, then the centroid of the band just under it,
    // rather than a fixed band below the pin line: this cape has a gap in y there and a fixed band
    // came back EMPTY, which put the hinge at the origin, below the whole piece. Every vertex then
    // read as being above it, the per-vertex ceiling collapsed to its 0.05 floor and the cape
    // stopped moving at all. A derived boundary has to be able to find something.
    let sh=-1e9;
    for(let i=0;i<pa.count;i++) if(hv[i]<=pinH && hv[i]>sh) sh=hv[i];

      t[i]=hv[i]>pinH ? 0 : Math.max(0,Math.min(1,(sh-hv[i])/((sh-h0)||1)));

      // ── AND THE CEILING. The angle at which THIS vertex would rise level with the hinge, so no

    // felt is rougher still. DoubleSide because the inside of it shows the moment it lifts.
    // Cloth, but a METALLIC weave now that it is silver rather than a magenta cape: it still has
    // to read as fabric, because it moves like fabric, so it keeps most of its roughness and takes

    // DoubleSide because the inside of it shows the moment it lifts.
    (Array.isArray(mesh.material)?mesh.material:[mesh.material]).forEach(m=>{ if(!m) return;

    const top=h1-0.004, v=new THREE.Vector3();

      cl+=v.dot(LAT); cb+=v.dot(BACK); n++; }
    if(!n) return null; cl/=n; cb/=n;
    let r=1e9;
    for(let i=0;i<count;i++){ if(hv[i]<top) continue; v.fromArray(arr,i*3).sub(P);

    const Pp=C.P, U=C.UP, B=C.BACK, L=C.LAT;
    const Pl=Pp.dot(L), Pu=Pp.dot(U), Pb=Pp.dot(B);
    const A=C.pa.array, R=C.rest, N=C.na?C.na.array:null, NR=C.nrest;

      const tt=C.t[i], i3=i*3;

      const w=Math.sin(C.ph*6.0 - tt*5.2 + C.u01[i]*2.4);
      let ang=C.lift*tt*tt + C.wave*tt*tt*w;             // t squared: the top barely moves, the hem moves most
      // saturate rather than clamp: tanh reaches the vertex's own ceiling asymptotically, so the
      // sheet still curves instead of flattening into a fan the moment one row hits its limit

      const nl= C.sl[i] + C.wave*CAPE_FLUT*tt*tt*Math.sin(C.ph*4.3 + C.u01[i]*3.1);

  // stud high, which is all the extra forehead was. The civilian piece takes the same 0.05.
  // 0.052 was the full stud height, which seats the piece so deep it buries the brows. 0.025

  let HH_SIDE=0.008;   // + = character's left / viewer's right; tune via __hero.side()

  // point of the outer shell (r > 1.15*cavR, so the cavity wall is excluded). A hairpiece is cut

  // piece's nape at +90 degrees (lowest hairline 1.584 at +97.5, furthest reach 0.4605 at +82.5).

  const HH_NAPE=Math.PI/2;
  let heroSeat=null;   // {hcx,hcz,studTop,base,spin} measured once, re-applied on every tweak

  // Seat the hairpiece on the head's stud. Split out from the fit so the three numbers above can

  // of the hero nobody has been able to LOOK at from here, and the pane has no WebGL to look with.

  // ── HIS COLOURS ─────────────────────────────────────────────────────────────────────────

  // three 16x16 flat swatches (cape, arms, gloves are one colour each) and four 1024 detail maps
  // carrying the trim, the glass detail and the black print outlines. So the recolour happens in
  // the SHADER, and that is a decision worth keeping:
  //   - a pixel pass at load would be 3.67M texels, most of a second of JavaScript;
  //   - editing the glb means a round trip through Blender, which renames nodes, and the part
  //     classification in buildHero() reads those names to find the torso, the arms, the cape;
  //   - in the shader it is a handful of ops per pixel, the asset is never touched, and the

  //

  // sits on rather than snapped to the nearest key: snapping leaves every trim edge jagged. The

  //

  // magenta 5.8%, and the light blue 1.07%, which is small enough that a 1.5% cut missed it.
  const SUIT_KEY=[0x004022, 0xD31593, 0xD4B039, 0x000000, 0x91C9D8];

  // the baked skin landed on #C58A5E, one part in 255 off the civilian's #C68B5E; the remap puts
  // it back exactly, and makes the tone a live dial at the same time
  const HEAD_KEY=[0xC58A5E, 0x000000, 0x0D0D0D, 0xFAFAFA];
  let   HEAD_NEW=[0xC68B5E, 0x000000, 0x0D0D0D, 0x3FC8FF];
  const HEAD_GLOW=3;
  // 3.4 puts the blue channel at 3.4 in linear, comfortably over the pipeline's 1.7 bloom
  // threshold, so the glow actually blooms rather than just being a bright blue.
  let GLOW_COL=0x3FC8FF, GLOW_AMT=3.4;

  const partShaders=[];
  function lin3(h){ const f=[(h>>16&255)/255,(h>>8&255)/255,(h&255)/255];
    return new THREE.Vector3(...f.map(c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4))); }
  // Deliberately PRIMITIVE GLSL: no loop, no uniform array indexed by a variable, no comma
  // operator. GLSL ES 1.00 only allows a constant-index-expression into a uniform array, so
  // indexing one with a function parameter fails to compile on WebGL1, which is the path touch and
  // #nopipe take. Separate uniforms and unrolled pairs cannot trip over any of that.
  function remapGLSL(n, glowIdx){
    let g='';
    for(let i=0;i<n;i++) g+='uniform vec3 uK'+i+'; uniform vec3 uN'+i+';\n';
    g+='uniform vec3 uGlowCol; uniform float uGlowAmt;\n';
    g+='vec3 remapPart(vec3 c, out float glow){\n';
    g+='  vec3 best = c; float bd = 1000000.0; glow = 0.0;\n';
    g+='  vec3 A; vec3 B; vec3 AB; vec3 q; vec3 r; float t; float d; float gw;\n';
